      // ============================================================
      // ОБНОВЛЕНИЕ ПАНЕЛИ ПО ВЫДЕЛЕНИЮ
      // ============================================================
      function updateSheetToolbarFromSelection() {
        if (!editingSheet || !editingSheet.richText) return;

        const range = getSheetSelectionRange();
        const chars = flattenSegments(editingSheet.richText);

        let c;
        if (range.start === range.end) {
          // Нет выделения — берём символ слева или справа
          if (range.start > 0 && chars[range.start - 1]) {
            c = chars[range.start - 1];
          } else if (range.start < chars.length && chars[range.start]) {
            c = chars[range.start];
          } else {
            c = editingSheet._currentStyle || {
              bold: false,
              italic: false,
              underline: false,
              strike: false,
              color: editingSheet.textColor || "#000000",
              size: editingSheet.textSize || 18,
              font: editingSheet.textFont || "Arial",
            };
          }
        } else {
          // Есть выделение — берём первый символ
          c = chars[range.start] ||
            editingSheet._currentStyle || {
              bold: false,
              italic: false,
              underline: false,
              strike: false,
              color: editingSheet.textColor || "#000000",
              size: editingSheet.textSize || 18,
              font: editingSheet.textFont || "Arial",
            };
        }

        document.getElementById("sheet-text-bold").classList.toggle("active", c.bold);
        document.getElementById("sheet-text-italic").classList.toggle("active", c.italic);
        document.getElementById("sheet-text-underline").classList.toggle("active", c.underline);
        document.getElementById("sheet-text-color").value = c.color || "#000000";
        const sizeEl = document.getElementById("sheet-text-size");
        if (sizeEl && document.activeElement !== sizeEl) {
          if (range.start === range.end) {
            // Нет выделения — показываем размер текущего стиля
            const curStyle = getSheetCurrentStyle(editingSheet);
            sizeEl.value = curStyle.size || 18;
          } else {
            // Есть выделение — показываем размер первого выделенного
            sizeEl.value = c.size || 18;
          }
        }
        document.getElementById("sheet-text-font").value = c.font || "Arial";

        ["sheet-text-left", "sheet-text-center", "sheet-text-right"].forEach((id) =>
          document.getElementById(id).classList.remove("active"),
        );
        const align = editingSheet.textAlign || "left";
        document.getElementById("sheet-text-" + align).classList.add("active");
      }

      // ============================================================
      // ПРИМЕНЕНИЕ СТИЛЯ К ВЫДЕЛЕНИЮ НА ЛИСТЕ
      // ============================================================
      function applyStyleToSheetSelection(styleFn) {
        if (!editingSheet || !editingSheet.richText) return;

        const range = getSheetSelectionRange();

        if (range.start === range.end) {
          if (!editingSheet._currentStyle) {
            editingSheet._currentStyle = {
              bold: false,
              italic: false,
              underline: false,
              strike: false,
              color: editingSheet.textColor || "#000000",
              size: editingSheet.textSize || 18,
              font: editingSheet.textFont || "Arial",
            };
          }
          styleFn(editingSheet._currentStyle);
          return;
        }

        const chars = flattenSegments(editingSheet.richText);
        for (let i = range.start; i < range.end; i++) {
          if (i < chars.length) {
            styleFn(chars[i]);
          }
        }

        editingSheet.richText = charsToSegments(chars);
        editingSheet.text = segmentsToText(editingSheet.richText);
        autoExpandSheet(editingSheet);
        render();
        saveBoardToServer();
      }

      function handleSheetKeydown(e) {
        if (!isSheetTextMode || !editingSheet) return;

        // Не перехватываем ввод в полях панели листа
        if (e.target && e.target.closest && e.target.closest("#sheet-text-toolbar")) {
          return;
        }
        // Пропускаем обычные символы — их обработает input-событие
        if (e.target && e.target.id === "mobile-sheet-input") {
          if (
            e.key === "Backspace" ||
            e.key === "Enter" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight" ||
            e.key === "ArrowUp" ||
            e.key === "ArrowDown"
          ) {
            // пропускаем дальше — пусть обработается
          } else {
            return;
          }
        }

        e.preventDefault();
        e.stopPropagation();

        const range = getSheetSelectionRange();
        const chars = flattenSegments(editingSheet.richText);

        // ===== СТИЛЬ ДЛЯ ВСТАВЛЯЕМЫХ СИМВОЛОВ =====
        // Если есть _currentStyle (пользователь нажал B/I/U/цвет без выделения) — используем его.
        // Иначе — стиль символа слева от курсора.
        let baseStyle;
        if (editingSheet._currentStyle) {
          baseStyle = { ...editingSheet._currentStyle };
        } else if (range.start > 0 && chars[range.start - 1]) {
          const left = chars[range.start - 1];
          baseStyle = {
            bold: left.bold,
            italic: left.italic,
            underline: left.underline,
            strike: left.strike,
            color: left.color,
            size: left.size,
            font: left.font,
          };
        } else {
          baseStyle = {
            bold: false,
            italic: false,
            underline: false,
            strike: false,
            color: editingSheet.textColor || "#000000",
            size: editingSheet.textSize || 18,
            font: editingSheet.textFont || "Arial",
          };
        }

        // ===== ESCAPE =====
        if (e.key === "Escape") {
          stopSheetTextEditing();
          return;
        }

        // ===== CTRL-КОМБИНАЦИИ =====
        if (e.ctrlKey || e.metaKey) {
          if (e.key === "b" || e.key === "B" || e.key === "и") {
            document.getElementById("sheet-text-bold").click();
            return;
          }
          if (e.key === "i" || e.key === "I" || e.key === "ш") {
            document.getElementById("sheet-text-italic").click();
            return;
          }
          if (e.key === "u" || e.key === "U" || e.key === "г") {
            document.getElementById("sheet-text-underline").click();
            return;
          }
          if (e.key === "a" || e.key === "A" || e.key === "ф") {
            sheetSelection.anchor = 0;
            sheetSelection.focus = chars.length;
            render();
            updateSheetToolbarFromSelection();
            return;
          }
          if (e.key === "c" || e.key === "C" || e.key === "с") {
            copySelected();
            return;
          }
          if (e.key === "z" || e.key === "Z" || e.key === "я") {
            undo();
            return;
          }
          return;
        }

        // ===== СТРЕЛКИ =====
        if (e.key === "ArrowLeft") {
          if (range.start !== range.end) {
            sheetSelection.anchor = sheetSelection.focus = range.start;
          } else if (sheetSelection.focus > 0) {
            sheetSelection.focus--;
            sheetSelection.anchor = sheetSelection.focus;
          }
          render();
          updateSheetToolbarFromSelection();
          return;
        }
        if (e.key === "ArrowRight") {
          if (range.start !== range.end) {
            sheetSelection.anchor = sheetSelection.focus = range.end;
          } else if (sheetSelection.focus < chars.length) {
            sheetSelection.focus++;
            sheetSelection.anchor = sheetSelection.focus;
          }
          render();
          updateSheetToolbarFromSelection();
          return;
        }

        if (e.key === "ArrowUp") {
          e.preventDefault();
          e.stopPropagation();

          const flatChars = flattenSegments(editingSheet.richText);
          const range2 = getSheetSelectionRange();
          const focus = sheetSelection.focus;

          // Определяем текущую строку и X курсора
          let lineIdx = 0,
            charInLine = 0;
          let found = false;
          for (let i = 0; i < flatChars.length; i++) {
            if (i === focus) {
              found = true;
              break;
            }
            if (flatChars[i].char === "\n") {
              lineIdx++;
              charInLine = 0;
            } else charInLine++;
          }
          if (!found) {
            charInLine = 0;
            lineIdx = 0;
            for (let i = 0; i < flatChars.length; i++) {
              if (flatChars[i].char === "\n") lineIdx++;
            }
          }

          if (lineIdx === 0) {
            sheetSelection.anchor = sheetSelection.focus = 0;
            render();
            updateSheetToolbarFromSelection();
            return;
          }

          // X курсора в текущей строке
          const measureCtx = document.createElement("canvas").getContext("2d");
          let xCursor = 0;
          let startOfCur = 0;
          for (let i = focus - 1; i >= 0; i--) {
            if (flatChars[i].char === "\n") {
              startOfCur = i + 1;
              break;
            }
          }
          for (let i = startOfCur; i < focus; i++) {
            measureCtx.font = buildFont(flatChars[i], 1);
            xCursor += measureCtx.measureText(flatChars[i].char).width;
          }

          // Начало предыдущей строки
          let prevStart = 0;
          for (let i = startOfCur - 2; i >= 0; i--) {
            if (flatChars[i].char === "\n") {
              prevStart = i + 1;
              break;
            }
          }
          // Конец предыдущей строки
          let prevEnd = startOfCur - 1;

          // Ищем позицию в предыдущей строке по X
          let newCharInLine = 0;
          let xAcc = 0;
          for (let i = prevStart; i < prevEnd; i++) {
            const c = flatChars[i];
            if (!c) break;
            measureCtx.font = buildFont(c, 1);
            const charW = measureCtx.measureText(c.char).width;
            if (xAcc + charW / 2 >= xCursor) break;
            xAcc += charW;
            newCharInLine++;
          }

          sheetSelection.anchor = sheetSelection.focus = prevStart + newCharInLine;
          render();
          updateSheetToolbarFromSelection();
          return;
        }

        if (e.key === "ArrowDown") {
          e.preventDefault();
          e.stopPropagation();

          const flatChars = flattenSegments(editingSheet.richText);
          const focus = sheetSelection.focus;

          // Определяем текущую строку
          let lineIdx = 0;
          let found = false;
          for (let i = 0; i < flatChars.length; i++) {
            if (i === focus) {
              found = true;
              break;
            }
            if (flatChars[i].char === "\n") lineIdx++;
          }
          if (!found) {
            for (let i = 0; i < flatChars.length; i++) {
              if (flatChars[i].char === "\n") lineIdx++;
            }
          }

          // Всего строк
          let totalLines = 1;
          for (const c of flatChars) if (c.char === "\n") totalLines++;

          if (lineIdx >= totalLines - 1) {
            sheetSelection.anchor = sheetSelection.focus = flatChars.length;
            render();
            updateSheetToolbarFromSelection();
            return;
          }

          // X курсора в текущей строке
          const measureCtx = document.createElement("canvas").getContext("2d");
          let xCursor = 0;
          let startOfCur = 0;
          for (let i = focus - 1; i >= 0; i--) {
            if (flatChars[i].char === "\n") {
              startOfCur = i + 1;
              break;
            }
          }
          for (let i = startOfCur; i < focus; i++) {
            measureCtx.font = buildFont(flatChars[i], 1);
            xCursor += measureCtx.measureText(flatChars[i].char).width;
          }

          // Начало следующей строки
          let nextStart = flatChars.length;
          for (let i = focus; i < flatChars.length; i++) {
            if (flatChars[i].char === "\n") {
              nextStart = i + 1;
              break;
            }
          }
          // Конец следующей строки
          let nextEnd = flatChars.length;
          for (let i = nextStart; i < flatChars.length; i++) {
            if (flatChars[i].char === "\n") {
              nextEnd = i;
              break;
            }
          }

          // Ищем позицию в следующей строке по X
          let newCharInLine = 0;
          let xAcc = 0;
          for (let i = nextStart; i < nextEnd; i++) {
            const c = flatChars[i];
            if (!c) break;
            measureCtx.font = buildFont(c, 1);
            const charW = measureCtx.measureText(c.char).width;
            if (xAcc + charW / 2 >= xCursor) break;
            xAcc += charW;
            newCharInLine++;
          }

          sheetSelection.anchor = sheetSelection.focus = nextStart + newCharInLine;
          render();
          updateSheetToolbarFromSelection();
          return;
        }

        if (e.key === "Home") {
          sheetSelection.anchor = sheetSelection.focus = 0;
          render();
          updateSheetToolbarFromSelection();
          return;
        }
        if (e.key === "End") {
          sheetSelection.anchor = sheetSelection.focus = chars.length;
          render();
          updateSheetToolbarFromSelection();
          return;
        }

        // ===== BACKSPACE =====
        if (e.key === "Backspace") {
          if (range.start !== range.end) {
            const newChars = [...chars.slice(0, range.start), ...chars.slice(range.end)];
            editingSheet.richText = charsToSegments(newChars);
            editingSheet.text = segmentsToText(editingSheet.richText);
            sheetSelection.anchor = sheetSelection.focus = range.start;
          } else if (range.start > 0) {
            const newChars = [...chars];
            newChars.splice(range.start - 1, 1);
            editingSheet.richText = charsToSegments(newChars);
            editingSheet.text = segmentsToText(editingSheet.richText);
            sheetSelection.anchor = sheetSelection.focus = range.start - 1;
          }
          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();
          saveBoardHistory();
          saveBoardToServer();
          return;
        }

        // ===== DELETE =====
        if (e.key === "Delete") {
          if (range.start !== range.end) {
            const newChars = [...chars.slice(0, range.start), ...chars.slice(range.end)];
            editingSheet.richText = charsToSegments(newChars);
            editingSheet.text = segmentsToText(editingSheet.richText);
            sheetSelection.anchor = sheetSelection.focus = range.start;
          } else if (range.start < chars.length) {
            const newChars = [...chars];
            newChars.splice(range.start, 1);
            editingSheet.richText = charsToSegments(newChars);
            editingSheet.text = segmentsToText(editingSheet.richText);
          }
          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();
          saveBoardHistory();
          saveBoardToServer();
          return;
        }

        // ===== ENTER =====
        if (e.key === "Enter") {
          const before = chars.slice(0, range.start);
          const after = chars.slice(range.end);
          const inserted = [{ ...baseStyle, char: "\n" }];
          const newChars = [...before, ...inserted, ...after];
          editingSheet.richText = charsToSegments(newChars);
          editingSheet.text = segmentsToText(editingSheet.richText);
          sheetSelection.anchor = sheetSelection.focus = range.start + 1;
          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();
          saveBoardHistory();
          saveBoardToServer();
          return;
        }

        // ===== TAB =====
        if (e.key === "Tab") {
          const before = chars.slice(0, range.start);
          const after = chars.slice(range.end);
          const inserted = [];
          for (let i = 0; i < 4; i++) inserted.push({ ...baseStyle, char: " " });
          const newChars = [...before, ...inserted, ...after];
          editingSheet.richText = charsToSegments(newChars);
          editingSheet.text = segmentsToText(editingSheet.richText);
          sheetSelection.anchor = sheetSelection.focus = range.start + 4;
          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();
          saveBoardHistory();
          saveBoardToServer();
          return;
        }

        // ===== ОБЫЧНЫЙ СИМВОЛ =====
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const before = chars.slice(0, range.start);
          const after = chars.slice(range.end);
          const inserted = [{ ...baseStyle, char: e.key }];
          const newChars = [...before, ...inserted, ...after];

          editingSheet.richText = charsToSegments(newChars);
          editingSheet.text = segmentsToText(editingSheet.richText);
          sheetSelection.anchor = sheetSelection.focus = range.start + 1;

          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();

          clearTimeout(window._sheetSaveTimeout);
          window._sheetSaveTimeout = setTimeout(() => {
            saveBoardHistory();
            saveBoardToServer();
          }, 800);
          return;
        }
      }

      function startSheetTextEditing() {
        const btn = document.getElementById("sheet-edit-btn");
        if (!btn) return;

        let sheetObj = null;
        if (selected.length === 1) {
          const obj = objects.find((o) => o.id === selected[0]);
          if (obj && obj.type === "sheet") {
            sheetObj = obj;
          }
        }
        if (!sheetObj) return;

        editingSheet = sheetObj;
        isSheetTextMode = true;
        focusTarget = "sheet";

        btn.textContent = "✓ Готово";
        btn.classList.add("active");

        const toolbar = document.getElementById("sheet-text-toolbar");
        if (toolbar) {
          toolbar.classList.add("show");
          document.getElementById("sheet-text-font").value = sheetObj.textFont || "Arial";
          document.getElementById("sheet-text-size").value = sheetObj.textSize || 18;
          document.getElementById("sheet-text-color").value = sheetObj.textColor || "#000000";
          document.getElementById("sheet-text-bold").classList.toggle("active", sheetObj.textBold || false);
          document.getElementById("sheet-text-italic").classList.toggle("active", sheetObj.textItalic || false);
          document.getElementById("sheet-text-underline").classList.toggle("active", sheetObj.textUnderline || false);
          ["sheet-text-left", "sheet-text-center", "sheet-text-right"].forEach((id) =>
            document.getElementById(id).classList.remove("active"),
          );
          if (sheetObj.textAlign === "center") document.getElementById("sheet-text-center").classList.add("active");
          else if (sheetObj.textAlign === "right") document.getElementById("sheet-text-right").classList.add("active");
          else document.getElementById("sheet-text-left").classList.add("active");
        }

        if (canvas) canvas.style.cursor = "text";

        // ===== ИНИЦИАЛИЗИРУЕМ richText =====
        if (!sheetObj.richText) {
          sheetObj.richText = textToSegments(sheetObj.text || "", {
            bold: sheetObj.textBold || false,
            italic: sheetObj.textItalic || false,
            underline: sheetObj.textUnderline || false,
            strike: false,
            color: sheetObj.textColor || "#000000",
            size: sheetObj.textSize || 18,
            font: sheetObj.textFont || "Arial",
          });
        }
        sheetObj.text = segmentsToText(sheetObj.richText);

        // ===== ИНИЦИАЛИЗИРУЕМ ТЕКУЩИЙ СТИЛЬ (КАК В WORD) =====
        if (!sheetObj._currentStyle) {
          sheetObj._currentStyle = {
            bold: sheetObj.textBold || false,
            italic: sheetObj.textItalic || false,
            underline: sheetObj.textUnderline || false,
            strike: false,
            color: sheetObj.textColor || "#000000",
            size: sheetObj.textSize || 18,
            font: sheetObj.textFont || "Arial",
          };
        }

        // Ставим курсор в конец
        const totalChars = sheetObj.richText.reduce((s, seg) => s + seg.text.length, 0);
        sheetSelection.anchor = totalChars;
        sheetSelection.focus = totalChars;

        render();
        showHint("✏️ Печатайте текст");
        startCursorBlink();

        // ===== ПОДКЛЮЧАЕМ ОБРАБОТЧИК КЛАВИАТУРЫ =====
        document.removeEventListener("keydown", handleSheetKeydown, true);
        document.addEventListener("keydown", handleSheetKeydown, true);
        // Показываем мобильную клавиатуру
        const mobileInput = document.getElementById("mobile-sheet-input");
        if (mobileInput) {
          mobileInput.value = "";
          mobileInput.focus();
        }
      }

      // ============================================================
      // УТИЛИТЫ RICH-TEXT ДЛЯ ЛИСТА
      // ============================================================

      function textToSegments(text, baseStyle) {
        if (!text) return [];
        return [
          {
            text: text,
            bold: baseStyle.bold || false,
            italic: baseStyle.italic || false,
            underline: baseStyle.underline || false,
            strike: baseStyle.strike || false,
            color: baseStyle.color || "#000000",
            size: baseStyle.size || 18,
            font: baseStyle.font || "Arial",
          },
        ];
      }

      function segmentsToText(segments) {
        if (!segments || !segments.length) return "";
        return segments.map((s) => s.text).join("");
      }

      function flattenSegments(segments) {
        const chars = [];
        (segments || []).forEach((seg) => {
          for (let i = 0; i < seg.text.length; i++) {
            chars.push({
              char: seg.text[i],
              bold: seg.bold || false,
              italic: seg.italic || false,
              underline: seg.underline || false,
              strike: seg.strike || false,
              color: seg.color || "#000000",
              size: seg.size || 18,
              font: seg.font || "Arial",
            });
          }
        });
        return chars;
      }

      function charsToSegments(chars) {
        if (!chars.length) return [];
        const segments = [];
        let current = { ...chars[0], text: chars[0].char };
        delete current.char;
        for (let i = 1; i < chars.length; i++) {
          const c = chars[i];
          const same =
            c.bold === current.bold &&
            c.italic === current.italic &&
            c.underline === current.underline &&
            c.strike === current.strike &&
            c.color === current.color &&
            c.size === current.size &&
            c.font === current.font;
          if (same) {
            current.text += c.char;
          } else {
            segments.push(current);
            current = { ...c, text: c.char };
            delete current.char;
          }
        }
        segments.push(current);
        return segments;
      }

      function buildFont(seg, zoomLevel) {
        const size = (seg.size || 18) * zoomLevel;
        return (seg.bold ? "bold " : "") + (seg.italic ? "italic " : "") + size + "px " + (seg.font || "Arial");
      }

      function getSheetSelectionRange() {
        return {
          start: Math.min(sheetSelection.anchor, sheetSelection.focus),
          end: Math.max(sheetSelection.anchor, sheetSelection.focus),
        };
      }

      function wrapRichTextLines(richText, maxWidthWorld) {
        const chars = flattenSegments(richText);

        // Разбиваем по \n на абзацы, сохраняя индексы
        const paragraphs = []; // [{chars: [...], startFlatIdx: N}]
        let current = [];
        let currentStart = 0;

        chars.forEach((c, i) => {
          if (c.char === "\n") {
            paragraphs.push({ chars: current, startFlatIdx: currentStart });
            current = [];
            currentStart = i + 1;
          } else {
            current.push(c);
          }
        });
        paragraphs.push({ chars: current, startFlatIdx: currentStart });

        const measureCanvas = document.createElement("canvas");
        const measureCtx = measureCanvas.getContext("2d");

        const lines = []; // визуальные строки
        const flatIndexToLine = []; // flatIndexToLine[flatIdx] = lineIdx
        const lineToFlatStart = []; // lineToFlatStart[lineIdx] = flatIdx первого символа строки

        paragraphs.forEach((para, paraIdx) => {
          if (para.chars.length === 0) {
            // Пустой абзац (две \n подряд или \n в конце)
            const lineIdx = lines.length;
            lines.push({ line: [], startX: 0, width: 0, isParagraphEnd: true });
            lineToFlatStart.push(para.startFlatIdx);
            // \n сам по себе — не символ в lines, но его индекс в flat = para.startFlatIdx
            // (если это \n в конце абзаца, он находится ПЕРЕД startFlatIdx следующего)
            return;
          }

          let currentLine = [];
          let currentWidth = 0;
          let lineStartFlatIdx = para.startFlatIdx;
          let charOffsetInPara = 0;

          para.chars.forEach((c, i) => {
            measureCtx.font = buildFont(c, 1);
            const charW = measureCtx.measureText(c.char).width;

            if (currentWidth + charW > maxWidthWorld && currentLine.length > 0) {
              // Заканчиваем текущую строку
              const lineIdx = lines.length;
              lines.push({ line: currentLine, startX: 0, width: currentWidth, isParagraphEnd: false });
              lineToFlatStart.push(lineStartFlatIdx);
              // Все символы этой строки → lineIdx
              for (let j = 0; j < currentLine.length; j++) {
                flatIndexToLine[lineStartFlatIdx + j] = lineIdx;
              }

              // Начинаем новую
              currentLine = [];
              currentWidth = 0;
              lineStartFlatIdx = para.startFlatIdx + i;
            }

            currentLine.push(c);
            currentWidth += charW;
          });

          // Последняя строка абзаца
          const lineIdx = lines.length;
          lines.push({
            line: currentLine,
            startX: 0,
            width: currentWidth,
            isParagraphEnd: true,
            paragraphEndFlatIdx: para.startFlatIdx + para.chars.length, // индекс \n после абзаца
          });
          lineToFlatStart.push(lineStartFlatIdx);
          for (let j = 0; j < currentLine.length; j++) {
            flatIndexToLine[lineStartFlatIdx + j] = lineIdx;
          }

          // Если это не последний абзац — есть \n после него
          if (paraIdx < paragraphs.length - 1) {
            flatIndexToLine[para.startFlatIdx + para.chars.length] = lineIdx;
          }
        });

        // Считаем startX для каждой строки (выравнивание)
        const maxWidth = maxWidthWorld;
        const align = arguments[2] || "left";

        lines.forEach((li) => {
          if (align === "center") li.startX = (maxWidth - li.width) / 2;
          else if (align === "right") li.startX = maxWidth - li.width;
          else li.startX = 0;
        });

        return { lines, flatIndexToLine, lineToFlatStart };
      }

      function getSheetTextLayout(sheetObj) {
        const minX = Math.min(sheetObj.x1, sheetObj.x2);
        const maxX = Math.max(sheetObj.x1, sheetObj.x2);
        const minY = Math.min(sheetObj.y1, sheetObj.y2);
        const maxY = Math.max(sheetObj.y1, sheetObj.y2);
        const padding = 20;
        const maxWidthWorld = maxX - minX - padding * 2;

        const richText = sheetObj.richText || [];
        const baseSize = sheetObj.textSize || 18;
        const align = sheetObj.textAlign || "left";

        const wrapped = wrapRichTextLines(richText, maxWidthWorld, align);
        const lines = wrapped.lines;
        const flatIndexToLine = wrapped.flatIndexToLine;
        const lineToFlatStart = wrapped.lineToFlatStart;

        // Считаем Y-позицию каждой строки и lineHeight для каждой строки
        const lineHeights = [];
        const lineYs = [];
        let curY = 0;
        lines.forEach((lineInfo) => {
          let maxSizeInLine = baseSize;
          lineInfo.line.forEach((c) => {
            if ((c.size || baseSize) > maxSizeInLine) maxSizeInLine = c.size;
          });
          const lh = maxSizeInLine * 1.4;
          lineHeights.push(lh);
          lineYs.push(curY);
          curY += lh;
        });

        return {
          lines,
          flatIndexToLine,
          lineToFlatStart,
          lineHeights,
          lineYs,
          minX,
          maxX,
          minY,
          maxY,
          padding,
          maxWidthWorld,
          baseSize,
          lineHeight: baseSize * 1.4,
          textLeft: minX + padding,
          textTop: minY + padding,
        };
      }

      function stopSheetTextEditing() {
        stopCursorBlink();
        document.removeEventListener("keydown", handleSheetKeydown, true);
        if (!isSheetTextMode) return;
        const mobileInput = document.getElementById("mobile-sheet-input");
        if (mobileInput) mobileInput.blur();

        if (editingSheet) {
          // Синхронизируем обычный text с richText (для совместимости)
          editingSheet.text = segmentsToText(editingSheet.richText);

          // Сохраняем текущий стиль в сам лист (для следующего редактирования)
          if (editingSheet._currentStyle) {
            editingSheet.textColor = editingSheet._currentStyle.color;
            editingSheet.textSize = editingSheet._currentStyle.size;
            editingSheet.textFont = editingSheet._currentStyle.font;
            editingSheet.textBold = editingSheet._currentStyle.bold;
            editingSheet.textItalic = editingSheet._currentStyle.italic;
            editingSheet.textUnderline = editingSheet._currentStyle.underline;
          }
          // НЕ удаляем _currentStyle — оставляем для следующего открытия

          // Сбрасываем выделение
          sheetSelection.anchor = 0;
          sheetSelection.focus = 0;
        }

        if (editingSheet) {
          autoExpandSheet(editingSheet);
        }

        isSheetTextMode = false;
        editingSheet = null;
        focusTarget = "canvas";

        const toolbar = document.getElementById("sheet-text-toolbar");
        if (toolbar) toolbar.classList.remove("show");

        const btn = document.getElementById("sheet-edit-btn");
        if (btn) {
          btn.textContent = "✏️ Редактировать";
          btn.classList.remove("active");
        }

        if (canvas) canvas.style.cursor = "default";

        saveBoardHistory();
        saveBoardToServer();
        render();
        showHint("✅ Текст сохранён");
        setTimeout(updateSheetEditButton, 100);
      }

      function autoExpandSheet(sheetObj) {
        if (!sheetObj || sheetObj.type !== "sheet") return;
        if (!sheetObj.richText || sheetObj.richText.length === 0) return;

        const minX = Math.min(sheetObj.x1, sheetObj.x2);
        const maxX = Math.max(sheetObj.x1, sheetObj.x2);
        const minY = Math.min(sheetObj.y1, sheetObj.y2);
        const maxY = Math.max(sheetObj.y1, sheetObj.y2);

        const padding = 20;
        const maxWidth = maxX - minX - padding * 2;
        if (maxWidth <= 0) return;

        const layoutInfo = getSheetTextLayout(sheetObj);

        // Высота = сумма высот ВСЕХ строк с учётом их собственных размеров
        let totalHeight = 0;
        const chars = flattenSegments(sheetObj.richText);
        const measureCtx = document.createElement("canvas").getContext("2d");

        layoutInfo.lines.forEach((lineInfo) => {
          let maxSizeInLine = sheetObj.textSize || 18;
          lineInfo.line.forEach((c) => {
            if ((c.size || 18) > maxSizeInLine) maxSizeInLine = c.size;
          });
          totalHeight += maxSizeInLine * 1.4;
        });

        totalHeight += padding * 2;
        const currentHeight = maxY - minY;

        if (totalHeight > currentHeight) {
          sheetObj.y2 = minY + totalHeight;
        }
      }

      function drawSheetText(ctx, sheetObj) {
        const richText = sheetObj.richText;

        if (!richText || richText.length === 0) {
          if (isSheetTextMode && editingSheet === sheetObj) {
            const layoutInfo = getSheetTextLayout(sheetObj);
            const p1 = worldToScreen(layoutInfo.textLeft, layoutInfo.textTop);
            drawSheetCursor(ctx, sheetObj, layoutInfo, p1);
          }
          return;
        }

        const layoutInfo = getSheetTextLayout(sheetObj);
        const { lines, textLeft, textTop, lineYs } = layoutInfo;

        const p1 = worldToScreen(textLeft, textTop);

        ctx.save();
        ctx.textBaseline = "top";

        if (isSheetTextMode && editingSheet === sheetObj) {
          drawSheetSelectionBackground(ctx, sheetObj, layoutInfo, p1);
        }

        lines.forEach((lineInfo, lineIdx) => {
          const line = lineInfo.line;
          const textX = worldToScreen(textLeft + lineInfo.startX, textTop).x;
          let xCursor = textX;
          const yScreen = p1.y + lineYs[lineIdx] * zoom;

          line.forEach((c) => {
            const fontSize = (c.size || 18) * zoom;
            ctx.font = buildFont(c, zoom);
            ctx.fillStyle = c.color;
            const charW = ctx.measureText(c.char).width;
            ctx.fillText(c.char, xCursor, yScreen);

            if (c.underline) {
              ctx.strokeStyle = c.color;
              ctx.lineWidth = Math.max(1, 1.5 * zoom);
              ctx.beginPath();
              ctx.moveTo(xCursor, yScreen + fontSize + 2 * zoom);
              ctx.lineTo(xCursor + charW, yScreen + fontSize + 2 * zoom);
              ctx.stroke();
            }
            if (c.strike) {
              ctx.strokeStyle = c.color;
              ctx.lineWidth = Math.max(1, 1.5 * zoom);
              ctx.beginPath();
              ctx.moveTo(xCursor, yScreen + fontSize / 2);
              ctx.lineTo(xCursor + charW, yScreen + fontSize / 2);
              ctx.stroke();
            }
            xCursor += charW;
          });
        });

        ctx.restore();

        if (isSheetTextMode && editingSheet === sheetObj) {
          drawSheetCursor(ctx, sheetObj, layoutInfo, p1);
        }
      }

      function drawSheetSelectionBackground(ctx, sheetObj, layoutInfo, p1) {
        const range = getSheetSelectionRange();
        if (range.start === range.end) return;

        const { lines, lineYs, lineToFlatStart } = layoutInfo;
        const baseSize = layoutInfo.baseSize;

        ctx.save();
        ctx.fillStyle = "rgba(0, 122, 255, 0.3)";

        lines.forEach((lineInfo, lineIdx) => {
          const startFlat = lineToFlatStart[lineIdx] !== undefined ? lineToFlatStart[lineIdx] : 0;
          const textX = worldToScreen(layoutInfo.textLeft + lineInfo.startX, 0).x;
          const yScreen = p1.y + lineYs[lineIdx] * zoom;
          let xCursor = textX;

          let maxSizeInLine = baseSize;
          lineInfo.line.forEach((c) => {
            if ((c.size || baseSize) > maxSizeInLine) maxSizeInLine = c.size;
          });
          const lineHeightScreen = maxSizeInLine * 1.4 * zoom;

          let flatIdx = startFlat;
          lineInfo.line.forEach((c) => {
            ctx.font = buildFont(c, zoom);
            const charW = ctx.measureText(c.char).width;

            if (flatIdx >= range.start && flatIdx < range.end) {
              ctx.fillRect(xCursor, yScreen, charW, lineHeightScreen);
            }

            xCursor += charW;
            flatIdx++;
          });
        });

        ctx.restore();
      }

      function drawSheetCursor(ctx, sheetObj, layoutInfo, p1) {
        if (!isSheetTextMode || editingSheet !== sheetObj) return;

        const range = getSheetSelectionRange();
        if (range.start !== range.end) return;

        const focus = sheetSelection.focus;
        const { lines, textLeft, lineYs, baseSize, flatIndexToLine, lineToFlatStart } = layoutInfo;

        const measureCanvas = document.createElement("canvas");
        const measureCtx = measureCanvas.getContext("2d");

        if (!lines || lines.length === 0) {
          const screenX = worldToScreen(textLeft, 0).x;
          const screenY = p1.y;
          ctx.save();
          ctx.fillStyle = "#007aff";
          ctx.fillRect(screenX, screenY, Math.max(2, 2 * zoom), baseSize * zoom);
          ctx.restore();
          return;
        }

        const flatChars = flattenSegments(sheetObj.richText);

        // ===== ОПРЕДЕЛЯЕМ ВИЗУАЛЬНУЮ СТРОКУ ЧЕРЕЗ МАПУ =====
        let lineIdx;
        let charInLine;

        if (focus < flatIndexToLine.length && flatIndexToLine[focus] !== undefined) {
          lineIdx = flatIndexToLine[focus];
          // Считаем позицию в строке как focus - начало строки
          const startFlat = lineToFlatStart[lineIdx] !== undefined ? lineToFlatStart[lineIdx] : 0;
          charInLine = focus - startFlat;
        } else if (focus > 0 && flatIndexToLine[focus - 1] !== undefined) {
          // focus = конец текста или после \n
          lineIdx = flatIndexToLine[focus - 1];
          const startFlat = lineToFlatStart[lineIdx] !== undefined ? lineToFlatStart[lineIdx] : 0;
          charInLine = focus - 1 - startFlat + 1;
        } else {
          lineIdx = 0;
          charInLine = 0;
        }

        if (lineIdx >= lines.length) lineIdx = lines.length - 1;
        if (lineIdx < 0) lineIdx = 0;

        const lineInfo = lines[lineIdx];
        if (!lineInfo) return;
        if (charInLine > lineInfo.line.length) charInLine = lineInfo.line.length;
        if (charInLine < 0) charInLine = 0;

        // ===== X В СТРОКЕ =====
        let xWorld = lineInfo.startX;
        for (let i = 0; i < charInLine && i < lineInfo.line.length; i++) {
          measureCtx.font = buildFont(lineInfo.line[i], 1);
          xWorld += measureCtx.measureText(lineInfo.line[i].char).width;
        }

        let charSize = baseSize;
        if (charInLine < lineInfo.line.length) {
          charSize = lineInfo.line[charInLine].size || baseSize;
        } else if (lineInfo.line.length > 0) {
          charSize = lineInfo.line[lineInfo.line.length - 1].size || baseSize;
        }

        const screenX = worldToScreen(textLeft + xWorld, 0).x;
        const screenY = p1.y + lineYs[lineIdx] * zoom;

        ctx.save();
        ctx.fillStyle = "#007aff";
        ctx.fillRect(screenX, screenY, Math.max(2, 2 * zoom), charSize * zoom);
        ctx.restore();
      }

      // Оставляем старую функцию для совместимости (заглушка)
      function drawSheetSelectionAndCursor(ctx, sheetObj) {
        // Пустой лист — просто ничего не рисуем
      }

      // Курсор в режиме редактирования листа
      function drawSheetTextCursor(ctx, sheetObj, lines) {
        const minX = Math.min(sheetObj.x1, sheetObj.x2);
        const maxX = Math.max(sheetObj.x1, sheetObj.x2);
        const minY = Math.min(sheetObj.y1, sheetObj.y2);
        const maxY = Math.max(sheetObj.y1, sheetObj.y2);

        const padding = 20;
        const fontSizeWorld = sheetObj.textSize || 18;
        const font = sheetObj.textFont || "Arial";
        const screenFontSize = fontSizeWorld * zoom;
        const align = sheetObj.textAlign || "left";

        const p1 = worldToScreen(minX + padding, minY + padding);
        const p2 = worldToScreen(maxX - padding, maxY - padding);

        // Мигающий курсор
        const time = Date.now();
        if (Math.floor(time / 500) % 2 === 0) {
          ctx.save();
          ctx.font =
            (sheetObj.textBold ? "bold " : "") + (sheetObj.textItalic ? "italic " : "") + screenFontSize + "px " + font;

          const lastLine = lines && lines.length > 0 ? lines[lines.length - 1] : "";
          const metrics = ctx.measureText(lastLine);

          let cursorX = p1.x;
          if (align === "center") cursorX = (p1.x + p2.x) / 2 + metrics.width / 2;
          else if (align === "right") cursorX = p2.x;
          else cursorX = p1.x + metrics.width;

          const cursorY = p1.y + (lines ? lines.length - 1 : 0) * screenFontSize * 1.4;

          ctx.fillStyle = "#34c759";
          ctx.fillRect(cursorX, cursorY, Math.max(2, 2 * zoom), screenFontSize);
          ctx.restore();
        }

        // Рамка вокруг листа
        ctx.save();
        ctx.strokeStyle = "#34c759";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(p1.x - 10, p1.y - 10, p2.x - p1.x + 20, p2.y - p1.y + 20);
        ctx.setLineDash([]);
        ctx.restore();
      }

      function wrapText(ctx, text, maxWidth) {
        const paragraphs = text.split("\n");
        const result = [];

        paragraphs.forEach((paragraph) => {
          if (paragraph === "") {
            result.push("");
            return;
          }

          const words = paragraph.split(" ");
          let currentLine = "";

          words.forEach((word) => {
            // ===== ЕСЛИ СЛОВО САМО ДЛИННЕЕ maxWidth — РЕЖЕМ ПО СИМВОЛАМ =====
            if (ctx.measureText(word).width > maxWidth) {
              // Сначала выталкиваем то, что уже накопилось
              if (currentLine) {
                result.push(currentLine);
                currentLine = "";
              }

              // Режем слово на куски
              let chunk = "";
              for (let i = 0; i < word.length; i++) {
                const testChunk = chunk + word[i];
                if (ctx.measureText(testChunk).width > maxWidth && chunk) {
                  result.push(chunk);
                  chunk = word[i];
                } else {
                  chunk = testChunk;
                }
              }
              currentLine = chunk;
              return;
            }

            // ===== ОБЫЧНОЕ СЛОВО =====
            const testLine = currentLine ? currentLine + " " + word : word;
            if (ctx.measureText(testLine).width > maxWidth && currentLine) {
              result.push(currentLine);
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          });

          if (currentLine) result.push(currentLine);
        });

        return result;
      }

      function updateSelectionBox() {
        const box = document.getElementById("selection-box");
        if (!box) return;
        if (!isSelecting) {
          box.style.display = "none";
          return;
        }
        const p1 = worldToScreen(selectionStart.x, selectionStart.y);
        const p2 = worldToScreen(selectionEnd.x, selectionEnd.y);
        const w = Math.abs(p2.x - p1.x);
        const h = Math.abs(p2.y - p1.y);
        if (w < 3 || h < 3) {
          box.style.display = "none";
          return;
        }
        box.style.left = Math.min(p1.x, p2.x) + "px";
        box.style.top = Math.min(p1.y, p2.y) + "px";
        box.style.width = w + "px";
        box.style.height = h + "px";
        box.style.display = "block";
      }

      function updateStatus() {
        const el = document.getElementById("obj-count");
        if (el) el.textContent = objects.length;
      }

      // ============================================================
      // УПРАВЛЕНИЕ РЕЖИМАМИ
      // ============================================================
      function setMode(newMode) {
        forceHideSheetEditButton();
        if (isSheetTextMode) {
          stopSheetTextEditing();
        }
        const shape = SHAPE_LIST.find((s) => s.id === newMode);
        const sheet = SHEET_LIST.find((s) => s.id === newMode);

        if (shape) {
          mode = newMode;
          currentShapeType = newMode;
          saveToolSettings();
        } else if (sheet) {
          mode = "sheet";
          currentSheetType = newMode;
          saveToolSettings();
        } else if (newMode === "segment" || newMode === "ray" || newMode === "line") {
          mode = newMode;
          currentLineType = newMode;
          saveToolSettings();
        } else if (newMode === "sheet") {
          mode = "sheet";
        } else if (newMode === "text") {
          mode = "text";
        } else if (newMode === "image") {
          mode = "image";
        } else {
          mode = newMode;
        }

        // Устанавливаем курсор
        if (canvas) {
          switch (mode) {
            case "pan":
              canvas.style.cursor = "grab";
              break;
            case "select":
              canvas.style.cursor = "default";
              break;
            case "draw":
              canvas.style.cursor = "crosshair";
              break;
            case "eraser":
              canvas.style.cursor = "pointer";
              break;
            case "text":
              canvas.style.cursor = "text";
              break;
            default:
              canvas.style.cursor = "crosshair";
          }
        }

        const thickness = document.getElementById("thickness-control");
        if (mode === "segment" || mode === "ray" || mode === "line" || shape || mode === "draw" || mode === "sheet") {
          thickness.classList.add("show");
        } else {
          thickness.classList.remove("show");
        }

        // Скрываем панель текста при переключении с режима "text"
        if (newMode !== "text") {
          const textToolbar = document.getElementById("text-toolbar");
          if (textToolbar) textToolbar.classList.remove("show");
        }

        if (mode !== "select" && mode !== "text") {
          selected = [];
          render();
        }

        updateActiveButtons();
      }

      // ============================================================
      // ОПЕРАЦИИ С ОБЪЕКТАМИ
      // ============================================================
      function copySelected() {
        if (selected.length === 0) {
          showHint("Нет объектов для копирования");
          return;
        }
        clipboard = [];
        selected.forEach((id) => {
          const obj = objects.find((o) => o.id === id);
          if (obj) clipboard.push(JSON.parse(JSON.stringify(obj)));
        });
        showHint(`Скопировано: ${clipboard.length} объектов`);
      }

      function pasteObjects() {
        if (clipboard.length === 0) {
          showHint("Буфер обмена пуст");
          return;
        }
        const newIds = [];
        clipboard.forEach((obj) => {
          if (obj.type === "coords") return;
          const newObj = JSON.parse(JSON.stringify(obj));
          newObj.id = nextId++;

          // ===== УБИРАЕМ ПРИВЯЗКУ К ЛИСТУ =====
          delete newObj.parentSheetId;
          delete newObj.offsetX;
          delete newObj.offsetY;
          delete newObj._sheetOffsetX;
          delete newObj._sheetOffsetY;

          const offsetX = 30,
            offsetY = 30;
          if (newObj.type === "text" || newObj.type === "image") {
            newObj.x += offsetX;
            newObj.y += offsetY;
          } else if (
            newObj.type === "segment" ||
            newObj.type === "ray" ||
            newObj.type === "line" ||
            newObj.type !== "free-line"
          ) {
            newObj.x1 += offsetX;
            newObj.y1 += offsetY;
            newObj.x2 += offsetX;
            newObj.y2 += offsetY;
          } else if (newObj.type === "free-line" && newObj.points) {
            newObj.points.forEach((p) => {
              p.x += offsetX;
              p.y += offsetY;
            });
          }
          objects.push(newObj);
          newIds.push(newObj.id);
        });
        selected = newIds;
        saveBoardHistory();
        requestRender();
        showHint(`Вставлено: ${newIds.length} объектов`);
        saveBoardToServer();
      }

      function deleteSelected() {
        if (selected.length === 0) return;

        // ===== ПРИНУДИТЕЛЬНО ВЫХОДИМ ИЗ РЕЖИМА РЕДАКТИРОВАНИЯ ЛИСТА =====
        // Всегда, независимо от того, что удаляем
        if (isSheetTextMode) {
          stopSheetTextEditing();
        }

        const ids = new Set(selected);
        for (let i = objects.length - 1; i >= 0; i--) {
          if (ids.has(objects[i].id)) {
            delete imageCache[objects[i].id];
            objects.splice(i, 1);
          }
        }
        selected = [];

        // ===== ПРИНУДИТЕЛЬНО СКРЫВАЕМ КНОПКУ =====
        forceHideSheetEditButton();

        // ===== НЕ ДАЁМ updateSelectionFrame СНОВА ПОКАЗАТЬ КНОПКУ =====
        // Явно обнуляем всё, что может её вернуть
        editingSheet = null;
        isSheetTextMode = false;

        saveBoardHistory();
        render(); // синхронный render вместо requestRender
        showHint("🗑️ Удалено");
        saveBoardToServer();
      }

      // ============================================================
      // РЕСАЙЗ И ПЕРЕМЕЩЕНИЕ
      // ============================================================
      function updateTextDimensions(obj) {
        if (!obj || obj.type !== "text") return;
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        const fontSize = obj.size || 24;
        const font = obj.font || "Arial";
        const style = (obj.bold ? "bold " : "") + (obj.italic ? "italic " : "") + fontSize + "px " + font;
        tempCtx.font = style;
        const lines = (obj.text || "").split("\n");
        let maxWidth = 0;
        lines.forEach((line) => {
          const w = tempCtx.measureText(line).width;
          if (w > maxWidth) maxWidth = w;
        });
        const lineHeight = fontSize * 1.4;
        obj.width = maxWidth;
        obj.height = lines.length * lineHeight;
      }

      function applyResize(handle, dx, dy, bounds, ids) {
        const isTriangleEq = ids.length === 1 && objects.find((o) => o.id === ids[0])?.type === "triangle_eq";
        const isSheet = ids.length === 1 && objects.find((o) => o.id === ids[0])?.type === "sheet";
        if (isTriangleEq && (handle === "t" || handle === "b" || handle === "l" || handle === "r")) return;
        let { minX, maxX, minY, maxY } = bounds;
        const SENS = CONFIG.RESIZE_SENSITIVITY;
        const stepX = dx * SENS;
        const stepY = dy * SENS;
        if (isSheet) {
          let newMinX = minX,
            newMaxX = maxX,
            newMinY = minY,
            newMaxY = maxY;
          switch (handle) {
            case "tl":
              newMinX = minX + stepX;
              newMinY = minY + stepY;
              break;
            case "tr":
              newMaxX = maxX + stepX;
              newMinY = minY + stepY;
              break;
            case "bl":
              newMinX = minX + stepX;
              newMaxY = maxY + stepY;
              break;
            case "br":
              newMaxX = maxX + stepX;
              newMaxY = maxY + stepY;
              break;
            case "t":
              newMinY = minY + stepY;
              break;
            case "b":
              newMaxY = maxY + stepY;
              break;
            case "l":
              newMinX = minX + stepX;
              break;
            case "r":
              newMaxX = maxX + stepX;
              break;
            default:
              return;
          }
          const MIN = CONFIG.MIN_SIZE;
          if (newMaxX - newMinX < MIN) {
            if (handle === "l" || handle === "tl" || handle === "bl") newMaxX = newMinX + MIN;
            else newMinX = newMaxX - MIN;
          }
          if (newMaxY - newMinY < MIN) {
            if (handle === "t" || handle === "tl" || handle === "tr") newMaxY = newMinY + MIN;
            else newMinY = newMaxY - MIN;
          }
          ids.forEach((id) => {
            const obj = objects.find((o) => o.id === id);
            if (!obj) return;
            obj.x1 = newMinX;
            obj.y1 = newMinY;
            obj.x2 = newMaxX;
            obj.y2 = newMaxY;
          });
          resizeBounds = { minX: newMinX, maxX: newMaxX, minY: newMinY, maxY: newMaxY };
          return;
        }
        const isText = ids.length === 1 && objects.find((o) => o.id === ids[0])?.type === "text";
        if (isText) {
          const obj = objects.find((o) => o.id === ids[0]);
          if (!obj) return;
          // Плавное изменение размера шрифта: на каждые 10 пикселей мыши — ±1pt
          const delta = (dx + dy) * 0.15;
          obj.size = Math.max(8, Math.min(200, obj.size + delta));
          updateTextDimensions(obj);
          return;
        }
        const isImage = ids.length === 1 && objects.find((o) => o.id === ids[0])?.type === "image";
        if (isImage) {
          const obj = objects.find((o) => o.id === ids[0]);
          if (!obj) return;

          const SENS = CONFIG.RESIZE_SENSITIVITY;
          const stepX = dx * SENS;
          const stepY = dy * SENS;

          const MIN = 20;

          // ===== ГОРИЗОНТАЛЬНО =====
          if (handle === "r" || handle === "tr" || handle === "br") {
            // Правый маркер: x НЕ меняется, width меняется
            obj.width = Math.max(MIN, obj.width + stepX);
          } else if (handle === "l" || handle === "tl" || handle === "bl") {
            // Левый маркер: считаем новую ширину, ограничиваем её, и сдвигаем x на РЕАЛЬНУЮ разницу
            const oldW = obj.width;
            let newW = oldW - stepX;

            // Ограничиваем ширину
            if (newW < MIN) newW = MIN;

            // Реальная разница (учитывая ограничение MIN)
            const realDiff = oldW - newW;

            // Сдвигаем x на реальную разницу
            obj.x = obj.x + realDiff;
            obj.width = newW;
          }

          // ===== ВЕРТИКАЛЬНО =====
          if (handle === "b" || handle === "bl" || handle === "br") {
            // Нижний маркер: y НЕ меняется, height меняется
            obj.height = Math.max(MIN, obj.height + stepY);
          } else if (handle === "t" || handle === "tl" || handle === "tr") {
            // Верхний маркер: считаем новую высоту, ограничиваем её, и сдвигаем y на РЕАЛЬНУЮ разницу
            const oldH = obj.height;
            let newH = oldH - stepY;

            // Ограничиваем высоту
            if (newH < MIN) newH = MIN;

            // Реальная разница (учитывая ограничение MIN)
            const realDiff = oldH - newH;

            // Сдвигаем y на реальную разницу
            obj.y = obj.y + realDiff;
            obj.height = newH;
          }

          return;
        }
        switch (handle) {
          case "tl":
            minX += stepX;
            minY += stepY;
            break;
          case "tr":
            maxX += stepX;
            minY += stepY;
            break;
          case "bl":
            minX += stepX;
            maxY += stepY;
            break;
          case "br":
            maxX += stepX;
            maxY += stepY;
            break;
          case "t":
            if (isTriangleEq) return;
            minY += stepY;
            break;
          case "b":
            if (isTriangleEq) return;
            maxY += stepY;
            break;
          case "l":
            if (isTriangleEq) return;
            minX += stepX;
            break;
          case "r":
            if (isTriangleEq) return;
            maxX += stepX;
            break;
          default:
            return;
        }
        const MIN = CONFIG.MIN_SIZE;
        if (maxX - minX < MIN) {
          if (handle === "l" || handle === "tl" || handle === "bl") maxX = minX + MIN;
          else minX = maxX - MIN;
        }
        if (maxY - minY < MIN) {
          if (handle === "t" || handle === "tl" || handle === "tr") maxY = minY + MIN;
          else minY = maxY - MIN;
        }
        const oldW = bounds.maxX - bounds.minX;
        const oldH = bounds.maxY - bounds.minY;
        const newW = maxX - minX;
        const newH = maxY - minY;
        const scaleX = oldW !== 0 ? newW / oldW : 1;
        const scaleY = oldH !== 0 ? newH / oldH : 1;
        const finalScaleX = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, scaleX));
        const finalScaleY = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, scaleY));
        let ax, ay;
        switch (handle) {
          case "tl":
            ax = bounds.maxX;
            ay = bounds.maxY;
            break;
          case "tr":
            ax = bounds.minX;
            ay = bounds.maxY;
            break;
          case "bl":
            ax = bounds.maxX;
            ay = bounds.minY;
            break;
          case "br":
            ax = bounds.minX;
            ay = bounds.minY;
            break;
          case "t":
            ax = (bounds.minX + bounds.maxX) / 2;
            ay = bounds.maxY;
            break;
          case "b":
            ax = (bounds.minX + bounds.maxX) / 2;
            ay = bounds.minY;
            break;
          case "l":
            ax = bounds.maxX;
            ay = (bounds.minY + bounds.maxY) / 2;
            break;
          case "r":
            ax = bounds.minX;
            ay = (bounds.minY + bounds.maxY) / 2;
            break;
          default:
            ax = 0;
            ay = 0;
        }
        ids.forEach((id) => {
          const obj = objects.find((o) => o.id === id);
          if (!obj) return;
          if (obj.type === "coords" || obj.type === "sheet" || obj.type === "text" || obj.type === "image") return;
          if (obj.type === "segment" || obj.type === "ray" || obj.type === "line" || obj.type !== "free-line") {
            obj.x1 = ax + (obj.x1 - ax) * finalScaleX;
            obj.y1 = ay + (obj.y1 - ay) * finalScaleY;
            obj.x2 = ax + (obj.x2 - ax) * finalScaleX;
            obj.y2 = ay + (obj.y2 - ay) * finalScaleY;
          } else if (obj.type === "free-line" && obj.points) {
            obj.points.forEach((p) => {
              p.x = ax + (p.x - ax) * finalScaleX;
              p.y = ay + (p.y - ay) * finalScaleY;
            });
          }
        });
        resizeBounds = { minX, maxX, minY, maxY };
      }

      function startDragGroup(e) {
        const coords = getCoords(e);
        const bounds = getSelectedBounds();
        if (!bounds || !isPointInSelectionBounds(coords.x, coords.y)) return;
        isDraggingGroup = true;
        groupDragOffset = { x: coords.x, y: coords.y };
        groupBasePositions = [];
        selected.forEach((id) => {
          const obj = objects.find((o) => o.id === id);
          if (!obj || obj.type === "coords") return;
          const base = { id: obj.id };
          if (obj.type === "text" || obj.type === "image") {
            base.x = obj.x;
            base.y = obj.y;
          } else if (obj.type === "segment" || obj.type === "ray" || obj.type === "line" || obj.type !== "free-line") {
            base.x1 = obj.x1;
            base.y1 = obj.y1;
            base.x2 = obj.x2;
            base.y2 = obj.y2;
          } else if (obj.type === "free-line" && obj.points) {
            base.points = obj.points.map((p) => ({ x: p.x, y: p.y }));
          }
          groupBasePositions.push(base);
        });
        if (canvas) canvas.style.cursor = "grabbing";
      }

      function applyDragGroup(coords) {
        if (!isDraggingGroup || groupBasePositions.length === 0) return;
        const dx = coords.x - groupDragOffset.x;
        const dy = coords.y - groupDragOffset.y;
        groupBasePositions.forEach((base) => {
          const obj = objects.find((o) => o.id === base.id);
          if (!obj || obj.type === "coords") return;
          if (obj.type === "text" || obj.type === "image") {
            obj.x = base.x + dx;
            obj.y = base.y + dy;
          } else if (obj.type === "segment" || obj.type === "ray" || obj.type === "line" || obj.type !== "free-line") {
            obj.x1 = base.x1 + dx;
            obj.y1 = base.y1 + dy;
            obj.x2 = base.x2 + dx;
            obj.y2 = base.y2 + dy;
          } else if (obj.type === "free-line" && base.points) {
            obj.points.forEach((p, i) => {
              p.x = base.points[i].x + dx;
              p.y = base.points[i].y + dy;
            });
          }
        });
        requestRender();
      }

      function endDragGroup() {
        if (isDraggingGroup) {
          saveBoardHistory();
          isDraggingGroup = false;
          groupBasePositions = [];
          if (canvas) canvas.style.cursor = "default";
          requestRender();
          saveBoardToServer();
        }
      }

      // ============================================================
      // ТЕКСТОВЫЙ РЕДАКТОР
      // ============================================================
      function openTextEditor(obj) {
        if (!obj || obj.type !== "text") return;
        editingTextObj = obj;
        isTextEditorOpen = true;

        // ===== ЗАПОМИНАЕМ ИСХОДНОЕ СОСТОЯНИЕ =====
        window._textEditorOriginal = {
          text: obj.text || "",
          size: obj.size,
          width: obj.width,
          height: obj.height,
          wasNew: !obj.text || obj.text.trim() === "", // был ли объект только что создан
        };

        let cleanText = obj.text || "";
        if (obj.bullet)
          cleanText = cleanText
            .split("\n")
            .map((line) => line.replace(/^•\s*/, ""))
            .join("\n");
        else if (obj.numbered)
          cleanText = cleanText
            .split("\n")
            .map((line) => line.replace(/^\d+\.\s*/, ""))
            .join("\n");

        const input = document.getElementById("text-editor-input");
        if (input) {
          input.value = cleanText;
          setTimeout(() => {
            input.focus();
            input.select();
          }, 50);
        }
        updateTextPanelFromObject(obj);
        const pos = worldToScreen(obj.x, obj.y);
        const rect = canvas.getBoundingClientRect();
        const textEditor = document.getElementById("text-editor");
        if (textEditor) {
          // Позиционируем окно рядом с текстом, но не вылезаем за экран
          let left = rect.left + pos.x - 10;
          let top = rect.top + pos.y - 10;
          const editorWidth = 320;
          const editorHeight = 300;
          if (left + editorWidth > window.innerWidth - 10) {
            left = window.innerWidth - editorWidth - 10;
          }
          if (top + editorHeight > window.innerHeight - 10) {
            top = window.innerHeight - editorHeight - 10;
          }
          if (left < 10) left = 10;
          if (top < 10) top = 10;

          textEditor.style.left = left + "px";
          textEditor.style.top = top + "px";
          textEditor.style.display = "flex"; // <-- показываем
        }
      }

      function closeTextEditor(save) {
        const input = document.getElementById("text-editor-input");

        if (editingTextObj && save) {
          // ===== СОХРАНЯЕМ =====
          editingTextObj.text = input ? input.value : "";
          applyTextSettingsToSelected();
          updateTextDimensions(editingTextObj);
          saveBoardHistory();
          requestRender();
          saveBoardToServer();
          showStatus("📝 Текст обновлён");
        } else if (editingTextObj && !save) {
          // ===== ОТМЕНА =====
          const original = window._textEditorOriginal;

          if (original && original.wasNew) {
            // Объект был только что создан — удаляем его
            const idx = objects.indexOf(editingTextObj);
            if (idx >= 0) objects.splice(idx, 1);
            selected = [];
            saveBoardToServer();
            requestRender();
          } else if (original) {
            // Объект существовал — восстанавливаем исходный текст
            editingTextObj.text = original.text;
            editingTextObj.size = original.size;
            editingTextObj.width = original.width;
            editingTextObj.height = original.height;
            requestRender();
          }
        }

        // Скрываем редактор
        const textEditor = document.getElementById("text-editor");
        if (textEditor) textEditor.style.display = "none";

        editingTextObj = null;
        isTextEditorOpen = false;
        window._textEditorOriginal = null;
      }

      function updateTextPanelFromObject(obj) {
        if (!obj || obj.type !== "text") return;
        document.getElementById("text-font").value = obj.font || "Arial";
        document.getElementById("text-size").value = obj.size || 24;
        document.getElementById("text-color-picker").value = obj.color || "#000000";
        document.getElementById("text-bg-color-picker").value = obj.bgColor || "#ffffff";
        document.getElementById("text-bold").classList.toggle("active", obj.bold || false);
        document.getElementById("text-italic").classList.toggle("active", obj.italic || false);
        document.getElementById("text-underline").classList.toggle("active", obj.underline || false);
        document.getElementById("text-strike").classList.toggle("active", obj.strike || false);
        document.getElementById("text-bg-toggle").classList.toggle("active", obj.hasBg || false);
        ["text-left", "text-center", "text-right"].forEach((id) =>
          document.getElementById(id).classList.remove("active"),
        );
        if (obj.align === "center") document.getElementById("text-center").classList.add("active");
        else if (obj.align === "right") document.getElementById("text-right").classList.add("active");
        else document.getElementById("text-left").classList.add("active");
        document.getElementById("text-bullet").classList.toggle("active", obj.bullet || false);
        document.getElementById("text-numbered").classList.toggle("active", obj.numbered || false);
      }

      function applyTextSettingsToSelected() {
        if (selected.length === 0) return;
        selected.forEach((id) => {
          const obj = objects.find((o) => o.id === id);
          if (obj && obj.type === "text") {
            obj.font = document.getElementById("text-font").value;
            obj.size = parseInt(document.getElementById("text-size").value) || 24;
            obj.color = document.getElementById("text-color-picker").value;
            obj.bgColor = document.getElementById("text-bg-color-picker").value;
            obj.bold = document.getElementById("text-bold").classList.contains("active");
            obj.italic = document.getElementById("text-italic").classList.contains("active");
            obj.underline = document.getElementById("text-underline").classList.contains("active");
            obj.strike = document.getElementById("text-strike").classList.contains("active");
            obj.hasBg = document.getElementById("text-bg-toggle").classList.contains("active");
            if (document.getElementById("text-center").classList.contains("active")) obj.align = "center";
            else if (document.getElementById("text-right").classList.contains("active")) obj.align = "right";
            else obj.align = "left";
            obj.bullet = document.getElementById("text-bullet").classList.contains("active");
            obj.numbered = document.getElementById("text-numbered").classList.contains("active");
            updateTextDimensions(obj);
          }
        });
        requestRender();
      }

      // ============================================================
      // САЙДБАРЫ
      // ============================================================
      function toggleBoardSidebar() {
        const sidebar = document.getElementById("board-sidebar");
        if (sidebar) sidebar.classList.toggle("hidden");
      }

      function hideToolSidebar() {
        const sidebar = document.getElementById("tool-sidebar");
        if (sidebar) {
          sidebar.style.display = "none";
          sidebar.classList.remove("show");
        }
      }
      function showToolSidebar(type) {
        const sidebar = document.getElementById("tool-sidebar");
        const content = document.getElementById("tool-sidebar-content");
        if (!sidebar || !content) return;
        sidebar.style.display = "block";
        sidebar.classList.add("show");

        if (type === "lines") {
          content.innerHTML = `
            <div class="sidebar-title">📏 Линии</div>
            <div style="font-size:10px;color:#999;padding:2px 10px 8px;">👆 Клик по кнопке — быстрый выбор</div>
            <button class="sidebar-item ${currentLineType === "line" ? "active" : ""}" onclick="selectLineType('line')">
                <span class="icon">↔</span> Прямая <span class="shortcut">L</span>
            </button>
            <button class="sidebar-item ${currentLineType === "segment" ? "active" : ""}" onclick="selectLineType('segment')">

      function loadBoardSidebarContent() {
        const container = document.getElementById("board-sidebar-content");
        if (!container) return;
        const token = localStorage.getItem("token");
        if (!token) {
          container.innerHTML = `<div style="color:#999;padding:8px;">Авторизуйтесь</div>`;
          return;
        }
        fetch("/api/classes/my", { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((classes) => {
            // ===== ЗАЩИТА =====
            if (!Array.isArray(classes)) {
              console.error("❌ classes не массив:", classes);
              const c = document.getElementById("board-sidebar-content");
              if (c)
                c.innerHTML = `<div style="color:#e53e3e;padding:8px;font-size:12px;">Ошибка загрузки классов</div>`;
              return;
            }

            const container = document.getElementById("board-sidebar-content");
            if (!container || !document.body.contains(container)) {
              console.warn("⚠️ container удалён из DOM");
              return;
            }

            const currentType = getBoardType();
            let html = `
                <div class="sidebar-title">📚 Мои доски</div>
                <div class="sidebar-item ${currentType === "personal" ? "active" : ""}" onclick="selectBoard('personal', null, null)">
                    📝 Личная доска <span class="count">👤</span>
                </div>
                <div class="sidebar-divider"></div>
                <div class="sidebar-title">📚 Классы</div>
            `;

            if (classes.length === 0) {
              html += `<div style="color:#999;font-size:12px;padding:8px 4px;">Нет классов</div>`;
              if (currentUser && currentUser.role === "teacher") {
                html += `<button class="sidebar-btn" onclick="showCreateClass()">+ Создать класс</button>`;
              } else if (currentUser) {
                html += `<button class="sidebar-btn" onclick="showJoinByLink()">+ Присоединиться</button>`;
              }
            } else {
              classes.forEach((c) => {
                const isClassActive = currentType === "class" && selectedClassId === c.id;
                const isExpanded = isClassActive || (currentType === "shared" && selectedClassId === c.id);

                html += `
                        <div class="sidebar-item ${isClassActive ? "active" : ""}" onclick="toggleClass(${c.id})" style="cursor:pointer;">
                            📚 ${c.name}
                            ${c.student_count ? `<span class="count">👥${c.student_count}</span>` : ""}
                            ${currentUser?.role === "teacher" ? `<span class="count" style="cursor:pointer;color:#e53e3e;" onclick="event.stopPropagation();confirmDeleteClass(${c.id}, '${c.name}')">🗑️</span>` : ""}
                        </div>
                        <div id="class-details-${c.id}" style="${isExpanded ? "display:block;" : "display:none;"}padding-left:12px;margin-top:4px;">
                            ${c.description ? `<div style="font-size:12px;color:#666;padding:4px 8px;">${c.description}</div>` : ""}
                            
                            ${
                              currentUser?.role === "teacher"
                                ? `
                                <div style="padding:4px 8px;margin:6px 0;background:#f0f4ff;border-radius:6px;border:1px solid #e0e8ff;">
                                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
                                        <span style="font-size:11px;color:#667eea;font-weight:600;">🔗 Пригласительные ссылки</span>
                                        <button onclick="generateInviteLink(${c.id})" style="padding:2px 12px;background:#667eea;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;">
                                            + Создать ссылку
                                        </button>
                                    </div>
                                    <div id="invites-list-${c.id}" style="margin-top:4px;font-size:10px;color:#666;">
                                        <div style="color:#999;font-size:10px;padding:2px 0;">Загрузка...</div>
                                    </div>
                                </div>
                            `
                                : ""
                            }
                            
                            <div style="font-size:11px;color:#999;padding:4px 8px;border-bottom:1px solid #eee;margin-bottom:4px;">👨‍🎓 Ученики (${c.student_count || 0}):</div>
                            <div id="students-${c.id}" style="padding-left:8px;">
                                <div style="color:#999;font-size:12px;padding:4px;">Загрузка...</div>
                            </div>
                        </div>
                    `;
              });

              if (currentUser && currentUser.role === "teacher") {
                html += `<button class="sidebar-btn green" onclick="showCreateClass()" style="margin-top:6px;">+ Создать класс</button>`;
              } else if (currentUser && currentUser.role === "student") {
                html += `<button class="sidebar-btn" onclick="showJoinByLink()" style="margin-top:6px; background:#667eea; display:flex; align-items:center; gap:6px; justify-content:center;">
                        🔗 Присоединиться по ссылке
                    </button>`;
              }
            }
            container.innerHTML = html;

            // Загружаем учеников для каждого класса
            classes.forEach((c) => {
              const token2 = localStorage.getItem("token");
              fetch(`/api/classes/${c.id}/students`, { headers: { Authorization: `Bearer ${token2}` } })
                .then((res) => {
                  if (!res.ok) throw new Error("HTTP " + res.status);
                  return res.json();
                })
                .then((students) => {
                  const containerEl = document.getElementById(`students-${c.id}`);
                  if (!containerEl) return;

                  if (!Array.isArray(students) || students.length === 0) {
                    containerEl.innerHTML = `<div style="color:#999;font-size:12px;padding:4px 8px;">Нет учеников</div>`;
                    return;
                  }

                  const currentType2 = getBoardType();
                  containerEl.innerHTML = students
                    .map((s) => {
                      const isStudentActive =
                        currentType2 === "shared" && currentStudentId === s.id && selectedClassId === c.id;
                      return `
                                <div class="sidebar-item ${isStudentActive ? "active" : ""}" style="padding:4px 12px;font-size:13px;cursor:pointer;" onclick="selectBoard('shared', ${c.id}, ${s.id})">
                                    👤 ${s.full_name || s.username}
                                    <span style="font-size:10px;color:#999;margin-left:auto;">${s.username}</span>
                                </div>
                            `;
                    })
                    .join("");
                })
                .catch((e) => {
                  console.error("❌ students error:", e);
                  const containerEl = document.getElementById(`students-${c.id}`);
                  if (containerEl) {
                    containerEl.innerHTML = `<div style="color:#999;font-size:12px;padding:4px 8px;">Ошибка загрузки</div>`;
                  }
                });

              // Загружаем приглашения для учителя
              if (currentUser?.role === "teacher") {
                fetch(`/api/classes/${c.id}/invites`, {
                  headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
                })
                  .then((res) => {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.json();
                  })
                  .then((invites) => {
                    const containerEl = document.getElementById(`invites-list-${c.id}`);
                    if (!containerEl) return;

                    if (!Array.isArray(invites) || invites.length === 0) {
                      containerEl.innerHTML = `<div style="color:#999;font-size:10px;padding:2px 0;">Нет активных приглашений</div>`;
                      return;
                    }

                    const activeInvites = invites.filter((inv) => inv.is_active);
                    if (activeInvites.length === 0) {
                      containerEl.innerHTML = `<div style="color:#999;font-size:10px;padding:2px 0;">Нет активных приглашений</div>`;
                    } else {
                      containerEl.innerHTML = activeInvites
                        .map(
                          (inv) => `
                                    <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px;border-bottom:1px solid #f0f0f0;font-size:10px;">
                                        <span style="color:#34c759;">🟢</span>
                                        <span>${inv.used_count}/${inv.max_uses}</span>
                                        <span style="font-size:9px;color:#999;">до ${new Date(inv.expires_at).toLocaleDateString()}</span>
                                        <button onclick="deactivateInvite('${inv.token}', ${c.id})" style="background:none;border:none;color:#e53e3e;cursor:pointer;font-size:10px;padding:0 4px;">✕</button>
                                    </div>
                                `,
                        )
                        .join("");
                    }
                  })
                  .catch((e) => {
                    console.error("❌ invites error:", e);
                    const containerEl = document.getElementById(`invites-list-${c.id}`);
                    if (containerEl) {
                      containerEl.innerHTML = `<div style="color:#999;font-size:10px;padding:2px 0;">Ошибка загрузки</div>`;
                    }
                  });
              }
            });
          })
          .catch((e) => {
            console.error("❌ loadBoardSidebarContent error:", e);
            const c = document.getElementById("board-sidebar-content");
            if (c)
              c.innerHTML = `<div style="color:#e53e3e;padding:8px;font-size:11px;word-break:break-all;">
                ❌ ${e.message}<br>
                <span style="color:#999;font-size:10px;">${e.stack ? e.stack.split("\n")[0] : ""}</span>
            </div>`;
          });
      }
      // ============================================================
      // УПРАВЛЕНИЕ КЛАССАМИ В САЙДБАРЕ
      // ============================================================
      function toggleClass(classId) {
        const details = document.getElementById(`class-details-${classId}`);
        if (!details) return;

        // Если класс уже выбран - просто сворачиваем/разворачиваем
        if (selectedClassId === classId) {
          // Переключаем видимость
          if (details.style.display === "none") {
            details.style.display = "block";
          } else {
            details.style.display = "none";
          }
          return;
        }

        // Закрываем все остальные классы
        document.querySelectorAll('[id^="class-details-"]').forEach((el) => {
          if (el.id !== `class-details-${classId}`) {
            el.style.display = "none";
          }
        });

        // Открываем выбранный класс
        details.style.display = "block";

        // Выбираем класс
        selectBoard("class", classId, null);

        // Обновляем активные элементы в сайдбаре
        document.querySelectorAll("#board-sidebar-content .sidebar-item").forEach((el) => {
          el.classList.remove("active");
        });

        // Находим и активируем элемент класса
        const classItem = document.querySelector(
          `#board-sidebar-content .sidebar-item[onclick*="toggleClass(${classId})"]`,
        );
        if (classItem) {
          classItem.classList.add("active");
        }

        // Обновляем заголовок
        showHint(`📚 Переключено на класс`);
      }

      function confirmDeleteClass(classId, className) {
        if (
          confirm(
            `Вы уверены, что хотите удалить класс "${className}"?\nЭто действие нельзя отменить. Все задания и работы учеников будут удалены.`,
          )
        ) {
          deleteClass(classId);
        }
      }

      async function deleteClass(classId) {
        try {
          const response = await fetch(`/api/classes/${classId}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка удаления");
          }

          alert("✅ Класс удалён");

          // Если текущий класс удалён — переключаемся на личную доску
          if (selectedClassId === classId) {
            selectedClassId = null;
            currentStudentId = null;
            loadPage("board");
          }

          loadBoardSidebarContent();
          if (currentPage === "classes") loadClassesPage();
          if (currentPage === "assignments") loadAssignmentsPage();

          alert("❌ Ошибка: " + error.message);
        }
      }

      async function joinByLink() {

      // Новая функция для создания ссылки с параметрами
      async function createInviteWithSettings(classId) {
        const maxUses = parseInt(document.getElementById("invite-max-uses").value);
        const expiresInHours = parseInt(document.getElementById("invite-expires").value);

        try {
          const response = await fetch(`/api/classes/${classId}/invite`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: JSON.stringify({
              maxUses: maxUses,
              expiresInHours: expiresInHours,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Ошибка создания ссылки");
          }

          closeModal();

          // Форматируем текст для отображения
          const usesText = maxUses === 999 ? "♾️ безлимитно" : `${maxUses} учеников`;
          const hoursText =
            expiresInHours < 24
              ? `${expiresInHours} часов`
              : expiresInHours === 24
                ? "1 день"
                : expiresInHours === 48
                  ? "2 дня"
                  : expiresInHours === 72
                    ? "3 дня"
                    : expiresInHours === 168
                      ? "7 дней"
                      : expiresInHours === 720
                        ? "30 дней"
                        : `${expiresInHours} часов`;

          // Копируем ссылку в буфер обмена
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(data.url);
            showHint("✅ Ссылка скопирована в буфер обмена!");
          } else {
            const input = document.createElement("input");
            input.value = data.url;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
            showHint("✅ Ссылка скопирована!");
          }

          // Показываем ссылку в модалке
          openModal(`
            <h2>🔗 Пригласительная ссылка создана!</h2>
            <div style="background:#d1fae5;padding:12px;border-radius:8px;margin-bottom:12px;">
                <div style="font-size:13px;color:#065f46;">
                    ✅ Ссылка скопирована в буфер обмена
                </div>
                <div style="font-size:12px;color:#065f46;margin-top:4px;">
                    👥 ${usesText} • ⏰ ${hoursText}
                </div>
            </div>
            <div style="background:#f0f4ff;padding:12px;border-radius:8px;word-break:break-all;font-size:13px;margin-bottom:12px;border:1px solid #e0e8ff;">
                <a href="${data.url}" target="_blank" style="color:#667eea;">${data.url}</a>
            </div>
            <div style="font-size:12px;color:#999;margin-bottom:12px;">
                ⏰ Действительна до: ${new Date(data.expires_at).toLocaleString()}
                ${maxUses === 999 ? " • ♾️ Безлимитное количество" : ` • Осталось ${maxUses} использований`}
            </div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="copyInviteLink('${data.url}')" style="padding:8px 20px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;">📋 Копировать ещё раз</button>
                <button class="btn-secondary" onclick="closeModal()">✕ Закрыть</button>
            </div>
        `);

          // Обновляем список приглашений
          loadInvitesList(classId);
        } catch (error) {
          alert("❌ Ошибка: " + error.message);
        }
      }

      // Копирование ссылки
      function copyInviteLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            showHint("✅ Ссылка скопирована!");
          });
        } else {
          const input = document.createElement("input");
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          document.body.removeChild(input);
          showHint("✅ Ссылка скопирована!");
        }
      }

      // Загрузка списка приглашений для класса
      async function loadInvitesList(classId) {
        try {
          const response = await fetch(`/api/classes/${classId}/invites`, {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) return;

          const invites = await response.json();
          const container = document.getElementById(`invites-list-${classId}`);
          if (!container) return;

          const activeInvites = invites.filter((inv) => inv.is_active);
          if (activeInvites.length === 0) {
            container.innerHTML = `<div style="color:#999;font-size:10px;padding:2px 0;">Нет активных приглашений</div>`;
            return;
          }

          container.innerHTML = activeInvites
            .map(
              (inv) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px;border-bottom:1px solid #f0f0f0;font-size:10px;">
                <span style="color:#34c759;">🟢</span>
                <span>${inv.used_count}/${inv.max_uses}</span>
                <span style="font-size:9px;color:#999;">до ${new Date(inv.expires_at).toLocaleDateString()}</span>
                <button onclick="deactivateInvite('${inv.token}', ${classId})" style="background:none;border:none;color:#e53e3e;cursor:pointer;font-size:10px;padding:0 4px;">✕</button>
            </div>
        `,
            )
            .join("");
        } catch (error) {
          console.error("Ошибка загрузки приглашений:", error);
        }
      }

      // Деактивация приглашения
      async function deactivateInvite(token, classId) {
        if (!confirm("Отключить это приглашение?")) return;

        try {
          const response = await fetch(`/api/invite/${token}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка");
          }

          showHint("✅ Приглашение отключено");
          if (classId) loadInvitesList(classId);
        } catch (error) {
          alert("❌ " + error.message);
        }
      }

      // ============================================================
      // ПЛАТФОРМА - КЛАССЫ
      // ============================================================
      function loadClassesPage() {
        const area = document.getElementById("content-area");
        if (!area) return;
        const token = localStorage.getItem("token");
        if (!token) {
          area.innerHTML = `<div class="content-page"><div class="card"><div class="empty">Авторизуйтесь</div></div></div>`;
          return;
        }

        fetch("/api/classes/my", { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((classes) => {
            // ===== ЗАЩИТА =====
            if (!Array.isArray(classes)) {
              console.error("❌ classes не массив:", classes);
              area.innerHTML = `<div class="content-page"><div class="card"><div class="empty">Ошибка загрузки классов</div></div></div>`;
              return;

            const isTeacher = currentUser && currentUser.role === "teacher";
            const isStudent = currentUser && currentUser.role === "student";

            let html = `
                <div class="content-page">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">

                            background:white;
                            border-radius:12px;
                            padding:20px;
                            box-shadow:0 2px 8px rgba(0,0,0,0.08);

                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">

          document.getElementById("btn-image").classList.add("active");

          document.getElementById("btn-pan").classList.add("active");
        } else if (mode === "select") {
          document.getElementById("btn-select").classList.add("active");

          document.getElementById("btn-draw").classList.add("active");
        } else if (mode === "eraser") {
          document.getElementById("btn-eraser").classList.add("active");
        }

        setTimeout(() => {

        openModal(`

      async function createClass() {
        const name = document.getElementById("class-name").value.trim();
        const description = document.getElementById("class-desc").value.trim();
        if (!name) {
          alert("Введите название");
          return;
        }
        try {
          const response = await fetch("/api/classes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: JSON.stringify({ name, description }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          closeModal();
          alert("✅ Класс создан! Код: " + data.invite_code);
          loadBoardSidebarContent();
          loadClassesPage();
        } catch (error) {
          alert(error.message);
        }
      }

                if (isNaN(idx)) return;

                // Текстовые комментарии
                const textComments = textCommentsBySubtask[idx] || [];
                

                if (textComments.length > 0) {
                  const textEl = container.querySelector(".student-answer-text");
                  if (textEl) {
                    // Сохраняем оригинальный текст
                    if (!textEl.dataset.originalText) {
                      textEl.dataset.originalText = textEl.textContent;
                    }

                    // Применяем подсветку для каждого комментария
                    textComments.forEach((c) => {
                      highlightText(textEl, c.selected_text);
                    });
                  }
                }

                // Голосовые комментарии - тоже подсвечиваем
                const voiceComments = voiceCommentsBySubtask[idx] || [];
                if (voiceComments.length > 0) {
                  const textEl = container.querySelector(".student-answer-text");
                  if (textEl) {
                    if (!textEl.dataset.originalText) {
                      textEl.dataset.originalText = textEl.textContent;
                    }
                    voiceComments.forEach((vc) => {
                      if (vc.selected_text && vc.selected_text.trim()) {
                        highlightText(textEl, vc.selected_text);
                      }
                    });
                  }
                }
              });

                const img = wrapper.querySelector("img");
                if (!img) {

                const assignmentId = this.dataset.assignment || a.id;
                clearTimeout(this._saveTimeout);
                this._saveTimeout = setTimeout(() => {
                  autoSave(assignmentId);
                }, 500);
              };

              textareas.forEach((textarea) => {

              const intervalId = setInterval(() => {
                autoSave(a.id);

      async function saveTextCommentFromModal(submissionId, subtaskIndex, selectedText, btn) {
        const input = document.getElementById("text-comment-input");
        const comment = input?.value?.trim();

        if (!comment) {
          alert("Введите текст комментария");
          input?.focus();
          return;
        }

        try {
          btn.textContent = "⏳ Сохранение...";
          btn.disabled = true;

          const response = await fetch("/api/text-comments", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: JSON.stringify({
              submissionId: submissionId,
              subtaskIndex: subtaskIndex,
              selectedText: selectedText,
              comment: comment,
            }),
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка сохранения");
          }

          // Закрываем модалку
          const overlay = btn.closest("div[style*='fixed']");
          if (overlay) overlay.remove();

          showHint("✅ Текстовый комментарий сохранён!");

          // ===== ПЕРЕЗАГРУЖАЕМ КОММЕНТАРИИ =====
          const container = document.querySelector(`.student-answer-container[data-subtask="${subtaskIndex}"]`);
          if (container) {
            // Перезагружаем текстовые комментарии
            loadTextComments(submissionId, subtaskIndex, container);
          }
        } catch (error) {
          console.error("❌ Ошибка:", error);
          alert("❌ Ошибка: " + error.message);
          btn.textContent = "💾 Сохранить";
          btn.disabled = false;
        }
      }

        }

        // Показываем индикатор записи
        const overlay = document.createElement("div");
        overlay.style.cssText = `

        top: 0;
        left: 0;
        width: 100%;

        z-index: 99999;

        backdrop-filter: blur(4px);
    `;

        overlay.innerHTML = `

            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;

        ">
            <div style="font-size:60px;margin-bottom:12px;">🎙️</div>
            <h3 style="margin:0 0 8px 0;font-size:20px;color:#333;">Запись голосового комментария</h3>

                background:#e53e3e;
                display:flex;
                align-items:center;
                justify-content:center;
                animation: pulse-record 1s infinite;
            ">
                <span style="font-size:30px;color:white;">●</span>
            </div>
            <div id="recording-time" style="font-size:24px;font-weight:bold;color:#333;margin:8px 0;">0:00</div>
            <div style="font-size:13px;color:#999;margin-bottom:16px;">Говорите в микрофон...</div>
            <button id="stop-recording-btn" 
                    style="
                        padding:12px 40px;
                        background:#e53e3e;
                        color:white;
                        border:none;
                        border-radius:50px;
                        cursor:pointer;
                        font-size:16px;
                        font-weight:500;
                        transition:all 0.3s;
                    "
                    onmouseover="this.style.background='#c0392b'"
                    onmouseout="this.style.background='#e53e3e'">
                ⏹ Остановить запись
            </button>
            <div style="margin-top:12px;">
                <button onclick="this.closest('div[style*=\\'fixed\\']').remove()" 
                        style="background:transparent;border:none;color:#999;cursor:pointer;font-size:13px;">
                    Отмена
                </button>
            </div>
        </div>
    `;

        document.body.appendChild(overlay);

        // Добавляем стиль для анимации
        const style = document.createElement("style");
        style.textContent = `
        @keyframes pulse-record {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229,62,62,0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(229,62,62,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229,62,62,0); }
        }
    `;
        document.head.appendChild(style);

        // Начинаем запись
        let mediaRecorderLocal = null;
        let audioChunksLocal = [];
        let startTime = Date.now();
        let timerInterval = null;

        navigator.mediaDevices
          .getUserMedia({ audio: true })
          .then((stream) => {
            mediaRecorderLocal = new MediaRecorder(stream);
            audioChunksLocal = [];

            mediaRecorderLocal.ondataavailable = (event) => {
              if (event.data.size > 0) {
                audioChunksLocal.push(event.data);
              }
            };

            mediaRecorderLocal.onstop = function () {
              const audioBlob = new Blob(audioChunksLocal, { type: "audio/webm" });
              const duration = Math.round((Date.now() - startTime) / 1000);

              // Закрываем оверлей
              overlay.remove();
              style.remove();

              // Отправляем на сервер
              uploadVoiceCommentWithText(submissionId, subtaskIndex, selectedText, audioBlob, duration);

              // Освобождаем ресурсы
              stream.getTracks().forEach((track) => track.stop());
            };

            mediaRecorderLocal.start();

            // Таймер
            timerInterval = setInterval(() => {
              const elapsed = Math.round((Date.now() - startTime) / 1000);
              const timeEl = document.getElementById("recording-time");
              if (timeEl) {
                timeEl.textContent = formatDuration(elapsed);
              }
            }, 500);

            // Кнопка остановки
            document.getElementById("stop-recording-btn").addEventListener("click", function () {
              if (mediaRecorderLocal && mediaRecorderLocal.state === "recording") {
                mediaRecorderLocal.stop();
                clearInterval(timerInterval);
              }
            });
          })
          .catch((err) => {
            console.error("❌ Ошибка доступа к микрофону:", err);
            alert("❌ Нет доступа к микрофону. Разрешите доступ в настройках браузера.");
            overlay.remove();
            style.remove();
          });
      }

      async function uploadVoiceCommentWithText(submissionId, subtaskIndex, selectedText, audioBlob, duration) {
        const formData = new FormData();
        formData.append("audio", audioBlob, "voice.webm");
        formData.append("submissionId", submissionId);
        formData.append("subtaskIndex", subtaskIndex);
        formData.append("duration", duration);
        formData.append("selectedText", selectedText);

          const response = await fetch("/api/voice-comments", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: formData,
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка сохранения");
          }

          showHint("✅ Голосовой комментарий сохранён!");

            loadVoiceComments(submissionId, subtaskIndex, container);

            // Перезагружаем текстовые комментарии (для обновления подсветки)
            loadTextComments(submissionId, subtaskIndex, container);
          }
        } catch (error) {
          console.error("❌ Ошибка загрузки:", error);
          alert("❌ Ошибка: " + error.message);
        }
      }

      /**
       * Обработчик нажатия на кнопку комментария
       */
      function handleTextSelection(btn, subtaskIndex, submissionId) {
        const container = btn.closest(".student-answer-container");
        if (!container) {
          alert("Ошибка: контейнер не найден");
          return;
        }

        const textEl = container.querySelector(".student-answer-text");
        if (!textEl) {
          alert("Ошибка: текст не найден");
          return;
        }

        // Получаем выделенный текст
        const selection = window.getSelection();
        const selectedText = selection.toString().trim();

        if (!selectedText) {
          alert("Пожалуйста, выделите текст, который хотите прокомментировать");
          return;
        }

        // Проверяем, что выделение внутри этого элемента
        if (!textEl.contains(selection.anchorNode) || !textEl.contains(selection.focusNode)) {
          alert("Пожалуйста, выделите текст внутри ответа ученика");
          return;
        }

        // Запрашиваем комментарий
        const comment = prompt(
          `💬 Комментарий к выделенному тексту:\n\n"${selectedText.substring(0, 150)}${selectedText.length > 150 ? "..." : ""}"\n\nВведите комментарий:`,
        );

        if (!comment || !comment.trim()) return;

        // Сохраняем комментарий
        saveTextComment(submissionId, subtaskIndex, selectedText, comment.trim())
          .then(() => {
            showHint("✅ Комментарий сохранён");
            // Перезагружаем комментарии
            loadTextComments(submissionId, subtaskIndex, container);
            // Подсвечиваем текст
            highlightText(textEl, selectedText);
          })
          .catch((err) => {
            alert("❌ Ошибка: " + err.message);
          });
      }

      /**
       * Сохранение комментария к тексту на сервере
       */
      async function saveTextComment(submissionId, subtaskIndex, selectedText, comment) {
        const response = await fetch("/api/text-comments", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${localStorage.getItem("token")}`,
          },
          body: JSON.stringify({
            submissionId: submissionId,
            subtaskIndex: subtaskIndex,
            selectedText: selectedText,
            comment: comment,
          }),
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Ошибка сохранения");
        }

        return await response.json();
      }

      /**
       * Загрузка комментариев к тексту для конкретного подзадания
       */
      async function loadTextComments(submissionId, subtaskIndex, container) {
        try {
          const response = await fetch(`/api/text-comments/${submissionId}`, {
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
          });

          if (!response.ok) return;

          const allComments = await response.json();
          const comments = allComments.filter((c) => c.subtask_index === subtaskIndex);

          const listEl = container.querySelector(".text-comments-list");
          if (!listEl) return;

          // Очищаем список
          listEl.innerHTML = "";

          if (comments.length === 0) {
            listEl.style.display = "none";
            listEl.innerHTML =
              '<div style="color:#999;font-size:12px;text-align:center;padding:4px 0;">Нет комментариев</div>';
            // Убираем все подсветки
            const textEl = container.querySelector(".student-answer-text");
            if (textEl && textEl.dataset.originalText) {
              textEl.innerHTML = textEl.dataset.originalText;
              delete textEl.dataset.originalText;
            }
            return;
          }

          listEl.style.display = "block";
          listEl.innerHTML = `
            <div style="font-size:12px;color:#667eea;font-weight:600;margin-bottom:6px;">
                💬 Комментарии учителя (${comments.length}):
            </div>
            ${comments
              .map(
                (c, index) => `
                <div class="comment-item" data-comment-id="${c.id}" data-text="${c.selected_text}" data-comment="${c.comment}"
                     style="display:flex;justify-content:space-between;align-items:flex-start;padding:4px 8px;margin-bottom:3px;background:white;border-radius:4px;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer;transition:background 0.2s;"
                     onmouseover="this.style.background='#e8f0fe'"
                     onmouseout="this.style.background='white'"
                     onclick="scrollToTextComment(this, '${escapeHtml(c.selected_text)}', '${escapeHtml(c.comment)}')">
                    <div style="flex:1;margin-right:8px;">
                        <span style="background:#ffeb3b;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:500;">"${escapeHtml(c.selected_text.substring(0, 60))}${c.selected_text.length > 60 ? "..." : ""}"</span>

                    </div>
                    ${
                      currentUser?.role === "teacher"
                        ? `
                        <button onclick="event.stopPropagation();deleteTextComment(${c.id}, ${submissionId}, ${subtaskIndex}, this)" 
                                style="background:none;border:none;color:#999;cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;"
                                title="Удалить комментарий">
                            ✕
                        </button>
                    `
                        : ""
                    }
                </div>
            `,
              )
              .join("")}
        `;

          // ===== ПРИМЕНЯЕМ ПОДСВЕТКУ ДЛЯ ВСЕХ КОММЕНТАРИЕВ =====
          const textEl = container.querySelector(".student-answer-text");
          // ===== ПОДСВЕЧИВАЕМ ТЕКСТ (ДОБАВЛЯЕМ, НЕ СТИРАЯ СТАРЫЕ ПОДСВЕТКИ) =====
          if (textEl) {
            

            // Не стираем существующие подсветки!
            // Просто добавляем новые поверх старых
            for (const vc of comments) {
              if (vc.selected_text && vc.selected_text.trim()) {
                
                highlightText(textEl, vc.selected_text);
              }
            }
          }
        } catch (error) {
          console.error("❌ Ошибка загрузки комментариев:", error);
        }

      function showCommentForText(element) {
        // Находим контейнер
        const container = element.closest(".student-answer-container");
        if (!container) return;

        // Получаем текст
        const text = element.dataset.originalText || element.textContent.replace("💬", "").trim();

        // Показываем все комментарии для этого текста
        const commentsList = container.querySelector(".voice-comments-container");
        if (commentsList) {
          const commentItems = commentsList.querySelectorAll(".voice-comment");
          let foundComments = [];

          commentItems.forEach((item) => {
            const label = item.querySelector('span[style*="background:#ffeb3b"]');
            if (label) {
              const labelText = label.textContent.replace(/^"|"$/g, "").trim();
              if (text.includes(labelText) || labelText.includes(text)) {
                const playBtn = item.querySelector(".play-btn");
                if (playBtn) {
                  foundComments.push('🎙️ Голосовой комментарий к "' + labelText + '"');
                }
              }
            }
          });

          if (foundComments.length > 0) {
            // Подсвечиваем текст
            element.style.transition = "box-shadow 0.3s";
            element.style.boxShadow = "0 0 0 3px #8e44ad";
            setTimeout(() => {
              element.style.boxShadow = "none";
            }, 1500);

            alert('💬 Комментарии к тексту:\n\n"' + text + '"\n\n' + foundComments.join("\n"));
          }
        }
      }

      function scrollToTextComment(element, text, comment) {
        // Находим контейнер
        const container = element.closest(".student-answer-container");
        if (!container) return;

        // Находим подсвеченный текст
        const highlights = container.querySelectorAll(".text-highlight");
        let found = false;

        highlights.forEach((el) => {
          if (el.dataset.originalText === text || el.textContent.replace("💬", "").trim() === text) {
            found = true;
            // Прокручиваем к элементу
            el.scrollIntoView({ behavior: "smooth", block: "center" });

            // Подсвечиваем анимацией
            el.style.transition = "box-shadow 0.3s, background 0.3s";
            el.style.boxShadow = "0 0 0 4px #667eea";
            el.style.background = "#ffd700";

            setTimeout(() => {
              el.style.boxShadow = "none";
              el.style.background = "#ffeb3b";
            }, 1500);

            // Показываем комментарий
            alert(`💬 ${comment}`);
          }
        });

        if (!found) {
          // Если подсветка не найдена, пробуем найти текст напрямую
          const textEl = container.querySelector(".student-answer-text");
          if (textEl) {
            const fullText = textEl.dataset.originalText || textEl.textContent;
            const index = fullText.indexOf(text);
            if (index !== -1) {
              // Создаём временную подсветку
              textEl.innerHTML = fullText.replace(
                text,
                `<span style="background:#ffd700;padding:2px 4px;border-radius:2px;border-bottom:2px solid #667eea;">${text}</span>`,
              );
              setTimeout(() => {
                if (textEl.dataset.originalText) {
                  textEl.innerHTML = textEl.dataset.originalText;
                  // Переприменяем все подсветки
                  const comments = container.querySelectorAll(".comment-item");
                  comments.forEach((c) => {
                    highlightText(textEl, c.dataset.text);
                  });
                }
              }, 2000);
              showHint(`💬 ${comment}`);
            }
          }
        }
      }

      /**
       * Удаление комментария к тексту
       */
      async function deleteTextComment(commentId, submissionId, subtaskIndex, btn) {
        

        // Проверка ID
        if (!commentId) {
          alert("❌ Ошибка: ID комментария не указан");
          return;
        }

        if (!submissionId || submissionId === 0 || submissionId === "0") {
          alert("❌ Ошибка: ID работы не указан. Пожалуйста, обновите страницу и попробуйте снова.");
          return;
        }

        if (!confirm("Удалить этот комментарий?")) return;

        try {
          const token = localStorage.getItem("token");
          if (!token) {
            alert("❌ Ошибка: вы не авторизованы");
            return;
          }

          const response = await fetch(`/api/text-comments/${commentId}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.status === 403) {
            alert("❌ Ошибка: у вас нет прав на удаление этого комментария");
            return;
          }

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка удаления (статус: " + response.status + ")");
          }

          showHint("🗑️ Комментарий удалён");

          // Удаляем элемент из DOM сразу
          if (btn) {
            const item = btn.closest('.comment-item, div[style*="border-left"]');
            if (item) {
              item.style.display = "none";
              item.remove();
            }
          }

          // Обновляем списки комментариев
          setTimeout(() => {
            const modalContent = document.getElementById("modal-content");
            if (modalContent) {
              const containers = modalContent.querySelectorAll(".student-answer-container");
              containers.forEach((c) => {
                const idx = parseInt(c.dataset.subtask);
                if (!isNaN(idx)) {
                  loadTextComments(submissionId, idx, c);
                }
              });
            }
          }, 300);
        } catch (error) {
          console.error("❌ Ошибка удаления:", error);
          alert("❌ Ошибка: " + error.message);
        }
      }

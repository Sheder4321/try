        canvas.addEventListener("mousemove", function (e) {
          if (mode === "pan") return;
          e.preventDefault();
          const coords = getCoords(e);
          if (isSheetSelecting && editingSheet) {
            const idx = hitTestSheetText(coords.x, coords.y, editingSheet);
            sheetSelection.focus = idx;

            updateSheetToolbarFromSelection();
            render();
            return;
          }

          if (isDraggingGroup) {
            applyDragGroup(coords);
            return;
          }

          if (isResizing) {
            // ===== ДЕЛЬТА ОТ НАЧАЛЬНОЙ ТОЧКИ НАЖАТИЯ (не от предыдущего кадра!) =====
            const totalDx = coords.x - resizeStart.x;
            const totalDy = coords.y - resizeStart.y;

            // ===== ЗАМЕДЛЕНИЕ =====
            const SLOW = 0.3;
            const slowDx = totalDx * SLOW;
            const slowDy = totalDy * SLOW;

            // ===== ПРИМЕНЯЕМ К СОХРАНЁННОМУ СОСТОЯНИЮ =====
            if (window._resizeStartState && window._resizeStartState.length > 0) {
              window._resizeStartState.forEach((state) => {
                const obj = objects.find((o) => o.id === state.id);
                if (!obj) return;

                // ===== ИЗОБРАЖЕНИЕ =====
                if (state.type === "image") {
                  const MIN = 20;

                  if (resizeHandle === "r" || resizeHandle === "tr" || resizeHandle === "br") {
                    obj.width = Math.max(MIN, state.width + slowDx);
                  } else if (resizeHandle === "l" || resizeHandle === "tl" || resizeHandle === "bl") {
                    const newW = Math.max(MIN, state.width - slowDx);
                    obj.x = state.x + (state.width - newW);
                    obj.width = newW;
                  }

                  if (resizeHandle === "b" || resizeHandle === "bl" || resizeHandle === "br") {
                    obj.height = Math.max(MIN, state.height + slowDy);
                  } else if (resizeHandle === "t" || resizeHandle === "tl" || resizeHandle === "tr") {
                    const newH = Math.max(MIN, state.height - slowDy);
                    obj.y = state.y + (state.height - newH);
                    obj.height = newH;
                  }
                  return;
                }

                // ===== ТЕКСТ =====
                if (state.type === "text") {
                  const totalDelta = (slowDx + slowDy) / 2;
                  obj.size = Math.max(8, Math.min(200, state.size + totalDelta));
                  updateTextDimensions(obj);
                  return;
                }

                // ===== FREE-LINE =====
                if (state.type === "free-line" && state.points) {
                  // Исходные границы
                  let minX = Infinity,
                    maxX = -Infinity,
                    minY = Infinity,
                    maxY = -Infinity;
                  state.points.forEach((p) => {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                  });

                  const oldW = maxX - minX;
                  const oldH = maxY - minY;

                  // Считаем новые границы (что сдвинулось)
                  let newMinX = minX,
                    newMaxX = maxX,
                    newMinY = minY,
                    newMaxY = maxY;
                  if (resizeHandle === "tl" || resizeHandle === "l" || resizeHandle === "bl") newMinX += slowDx;
                  if (resizeHandle === "tr" || resizeHandle === "r" || resizeHandle === "br") newMaxX += slowDx;
                  if (resizeHandle === "tl" || resizeHandle === "t" || resizeHandle === "tr") newMinY += slowDy;
                  if (resizeHandle === "bl" || resizeHandle === "b" || resizeHandle === "br") newMaxY += slowDy;

                  const newW = Math.max(5, newMaxX - newMinX);
                  const newH = Math.max(5, newMaxY - newMinY);
                  const scaleX = oldW > 0 ? newW / oldW : 1;
                  const scaleY = oldH > 0 ? newH / oldH : 1;

                  // ===== ОПОРНАЯ ТОЧКА — та, которая НЕ двигалась =====
                  let ax, ay;
                  if (resizeHandle === "tl") {
                    ax = maxX;
                    ay = maxY;
                  } // тянем за левый верх — опора правый низ
                  if (resizeHandle === "tr") {
                    ax = minX;
                    ay = maxY;
                  } // тянем за правый верх — опора левый низ
                  if (resizeHandle === "bl") {
                    ax = maxX;
                    ay = minY;
                  } // тянем за левый низ — опора правый верх
                  if (resizeHandle === "br") {
                    ax = minX;
                    ay = minY;
                  } // тянем за правый низ — опора левый верх
                  if (resizeHandle === "t") {
                    ax = (minX + maxX) / 2;
                    ay = maxY;
                  } // тянем за верх — опора низ
                  if (resizeHandle === "b") {
                    ax = (minX + maxX) / 2;
                    ay = minY;
                  } // тянем за низ — опора верх
                  if (resizeHandle === "l") {
                    ax = maxX;
                    ay = (minY + maxY) / 2;
                  } // тянем за лево — опора право
                  if (resizeHandle === "r") {
                    ax = minX;
                    ay = (minY + maxY) / 2;
                  } // тянем за право — опора лево

                  // Масштабируем точки относительно опорной точки
                  obj.points = state.points.map((p) => ({
                    x: ax + (p.x - ax) * scaleX,
                    y: ay + (p.y - ay) * scaleY,
                  }));
                  return;
                }

                // ===== ЛИНИИ (сегмент, луч, прямая) =====
                if (state.type === "segment" || state.type === "ray" || state.type === "line") {
                  // Определяем, какая точка (x1,y1) или (x2,y2) ближе к маркеру
                  // Маркер находится в bounds-координатах

                  const bounds = {
                    minX: Math.min(state.x1, state.x2),
                    maxX: Math.max(state.x1, state.x2),
                    minY: Math.min(state.y1, state.y2),
                    maxY: Math.max(state.y1, state.y2),
                  };

                  // Позиция маркера в bounds
                  let handleX, handleY;
                  switch (resizeHandle) {
                    case "tl":
                      handleX = bounds.minX;
                      handleY = bounds.minY;
                      break;
                    case "tr":
                      handleX = bounds.maxX;
                      handleY = bounds.minY;
                      break;
                    case "bl":
                      handleX = bounds.minX;
                      handleY = bounds.maxY;
                      break;
                    case "br":
                      handleX = bounds.maxX;
                      handleY = bounds.maxY;
                      break;
                    case "t":
                      handleX = (bounds.minX + bounds.maxX) / 2;
                      handleY = bounds.minY;
                      break;
                    case "b":
                      handleX = (bounds.minX + bounds.maxX) / 2;
                      handleY = bounds.maxY;
                      break;
                    case "l":
                      handleX = bounds.minX;
                      handleY = (bounds.minY + bounds.maxY) / 2;
                      break;
                    case "r":
                      handleX = bounds.maxX;
                      handleY = (bounds.minY + bounds.maxY) / 2;
                      break;
                  }

                  // Расстояние от каждой точки линии до маркера
                  const dist1 = Math.hypot(state.x1 - handleX, state.y1 - handleY);
                  const dist2 = Math.hypot(state.x2 - handleX, state.y2 - handleY);

                  // Двигаем ту точку, которая ближе к маркеру
                  if (dist1 < dist2) {
                    // Двигаем первую точку
                    if (
                      resizeHandle === "l" ||
                      resizeHandle === "tl" ||
                      resizeHandle === "bl" ||
                      resizeHandle === "r" ||
                      resizeHandle === "tr" ||
                      resizeHandle === "br"
                    ) {
                      obj.x1 = state.x1 + slowDx;
                    }
                    if (
                      resizeHandle === "t" ||
                      resizeHandle === "tl" ||
                      resizeHandle === "tr" ||
                      resizeHandle === "b" ||
                      resizeHandle === "bl" ||
                      resizeHandle === "br"
                    ) {
                      obj.y1 = state.y1 + slowDy;
                    }
                  } else {
                    // Двигаем вторую точку
                    if (
                      resizeHandle === "l" ||
                      resizeHandle === "tl" ||
                      resizeHandle === "bl" ||
                      resizeHandle === "r" ||
                      resizeHandle === "tr" ||
                      resizeHandle === "br"
                    ) {
                      obj.x2 = state.x2 + slowDx;
                    }
                    if (
                      resizeHandle === "t" ||
                      resizeHandle === "tl" ||
                      resizeHandle === "tr" ||
                      resizeHandle === "b" ||
                      resizeHandle === "bl" ||
                      resizeHandle === "br"
                    ) {
                      obj.y2 = state.y2 + slowDy;
                    }
                  }

                  return;
                }

                // ===== ОСТАЛЬНЫЕ ФИГУРЫ (прямоугольники, круги, треугольники, листы) =====
                const oldMinX = Math.min(state.x1, state.x2);
                const oldMaxX = Math.max(state.x1, state.x2);
                const oldMinY = Math.min(state.y1, state.y2);
                const oldMaxY = Math.max(state.y1, state.y2);

                let newMinX = oldMinX,
                  newMaxX = oldMaxX,
                  newMinY = oldMinY,
                  newMaxY = oldMaxY;

                if (resizeHandle === "tl" || resizeHandle === "l" || resizeHandle === "bl") newMinX += slowDx;
                if (resizeHandle === "tr" || resizeHandle === "r" || resizeHandle === "br") newMaxX += slowDx;
                if (resizeHandle === "tl" || resizeHandle === "t" || resizeHandle === "tr") newMinY += slowDy;
                if (resizeHandle === "bl" || resizeHandle === "b" || resizeHandle === "br") newMaxY += slowDy;

                const MIN = 5;
                if (newMaxX - newMinX < MIN) {
                  if (resizeHandle === "l" || resizeHandle === "tl" || resizeHandle === "bl") newMaxX = newMinX + MIN;
                  else newMinX = newMaxX - MIN;
                }
                if (newMaxY - newMinY < MIN) {
                  if (resizeHandle === "t" || resizeHandle === "tl" || resizeHandle === "tr") newMaxY = newMinY + MIN;
                  else newMinY = newMaxY - MIN;
                }

                // ===== ДЛЯ ЛИСТА НЕ ЦЕНТРИРУЕМ — растягивается свободно =====
                // (просто устанавливаем новые границы)

                obj.x1 = newMinX;
                obj.y1 = newMinY;
                obj.x2 = newMaxX;
                obj.y2 = newMaxY;
              });
            }

            render();
            return;
          }

          if (isSelecting) {
            selectionEnd = { x: coords.x, y: coords.y };
            render();
            return;
          }

          if (isDrawing && currentDrawObj) {
            const last = drawPoints[drawPoints.length - 1];
            const dx = coords.x - last.x;
            const dy = coords.y - last.y;
            if (dx * dx + dy * dy > 4) {
              drawPoints.push({ x: coords.x, y: coords.y });
              currentDrawObj.points = [...drawPoints];
              render();

              // ===== WEBSOCKET: продолжение линии =====
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(
                  JSON.stringify({
                    type: "draw",
                    data: {
                      objId: currentDrawObj.id,
                      point: { x: coords.x, y: coords.y },
                      color: currentDrawObj.color,
                      thickness: currentDrawObj.thickness,
                      isStart: false,
                    },
                  }),
                );
              }
            }
            return;
          }

          if (mode === "eraser" && isErasing) {
            if (!eraserCooldown) {
              eraseAt(coords);
            }
            return;
          }

          const shape = SHAPE_LIST.find((s) => s.id === mode);
          if (shapeStart && (mode === "segment" || mode === "ray" || mode === "line" || shape || mode === "sheet")) {
            shapeEnd = { x: coords.x, y: coords.y };
            render();
          }
        });

        canvas.addEventListener("mouseup", function (e) {
          
          if (isPanning) {
            isPanning = false;
            canvas.style.cursor = mode === "pan" ? "grab" : "default";
          }
          if (mode === "pan") return;
          e.preventDefault();

          if (isDraggingGroup) {
            endDragGroup();
            return;
          }

          if (isSheetSelecting) {
            isSheetSelecting = false;
            render();
            return;
          }

          if (isResizing) {
            isResizing = false;
            window._resizeStartState = null;
            canvas.style.cursor = "default";
            saveBoardHistory();
            render();
            saveBoardToServer();
            return;
          }

          if (isSelecting) {
            isSelecting = false;
            document.getElementById("selection-box").style.display = "none";
            const x1 = Math.min(selectionStart.x, selectionEnd.x);
            const x2 = Math.max(selectionStart.x, selectionEnd.x);
            const y1 = Math.min(selectionStart.y, selectionEnd.y);
            const y2 = Math.max(selectionStart.y, selectionEnd.y);
            if (Math.abs(x2 - x1) > 5 && Math.abs(y2 - y1) > 5) {
              const newSelected = [];
              objects.forEach((obj) => {
                const b = getObjectBounds(obj);
                if (!b) return;
                if (b.minX <= x2 && b.maxX >= x1 && b.minY <= y2 && b.maxY >= y1) {
                  if (obj.type !== "coords") newSelected.push(obj.id);
                }
              });
              if (newSelected.length > 0) {
                selected = newSelected;
                // Если среди выделенных нет листа — скрываем кнопку
                const hasSheet = selected.some((id) => {
                  const o = objects.find((obj) => obj.id === id);
                  return o && o.type === "sheet";
                });
                if (!hasSheet) {
                  forceHideSheetEditButton();
                }
              }
            }
            render();
            return;
          }

          if (isDrawing) {
            isDrawing = false;

            // ===== WEBSOCKET: конец линии =====
            if (ws && ws.readyState === WebSocket.OPEN && currentDrawObj) {
              ws.send(
                JSON.stringify({
                  type: "draw",
                  data: {
                    objId: currentDrawObj.id,
                    point: { x: 0, y: 0 },
                    isEnd: true,
                  },
                }),
              );
            }

            if (drawPoints.length < 2 && currentDrawObj) {
              const idx = objects.indexOf(currentDrawObj);
              if (idx >= 0) objects.splice(idx, 1);
            } else if (currentDrawObj) {
              saveBoardHistory();
              saveBoardToServer();
            }
            drawPoints = [];
            currentDrawObj = null;
            render();
            return;
          }

          if (mode === "eraser") {
            isErasing = false;
            eraserCooldown = false;
            lastErasedId = null;
            eraserLastTime = 0;
            return;
          }

          const shape = SHAPE_LIST.find((s) => s.id === mode);
          if (
            shapeStart &&
            shapeEnd &&
            (mode === "segment" || mode === "ray" || mode === "line" || shape || mode === "sheet")
          ) {
            if (Math.abs(shapeEnd.x - shapeStart.x) > 2 || Math.abs(shapeEnd.y - shapeStart.y) > 2) {
              let obj;
              if (mode === "sheet") {
                const sheet = SHEET_LIST.find((s) => s.id === currentSheetType);
                const ratio = sheet ? sheet.ratio : 1;
                let w = Math.abs(shapeEnd.x - shapeStart.x);
                let h = Math.abs(shapeEnd.y - shapeStart.y);
                if (w / h > ratio) h = w / ratio;
                else w = h * ratio;
                const cx = (shapeStart.x + shapeEnd.x) / 2;
                const cy = (shapeStart.y + shapeEnd.y) / 2;
                obj = {
                  id: nextId++,
                  type: "sheet",
                  x1: cx - w / 2,
                  y1: cy - h / 2,
                  x2: cx + w / 2,
                  y2: cy + h / 2,
                  sheetType: currentSheetType,
                  color: "#333",
                  thickness: 1.5,
                  dashed: false,
                  userId: getCurrentUserId(),
                };
              } else if (mode === "segment" || mode === "ray" || mode === "line") {
                // Линии — НЕ нормализуем, порядок точек важен (стрелка луча на конце)
                obj = {
                  id: nextId++,
                  type: mode,
                  x1: shapeStart.x,
                  y1: shapeStart.y,
                  x2: shapeEnd.x,
                  y2: shapeEnd.y,
                  color: currentColor,
                  thickness: currentThickness,
                  dash: isDashed ? [6, 6] : [],
                  dashed: isDashed,
                  userId: getCurrentUserId(),
                };
              } else {
                // Фигуры — нормализуем: x1<=x2, y1<=y2
                obj = {
                  id: nextId++,
                  type: mode,
                  x1: Math.min(shapeStart.x, shapeEnd.x),
                  y1: Math.min(shapeStart.y, shapeEnd.y),
                  x2: Math.max(shapeStart.x, shapeEnd.x),
                  y2: Math.max(shapeStart.y, shapeEnd.y),
                  color: currentColor,
                  thickness: currentThickness,
                  dash: isDashed ? [6, 6] : [],
                  dashed: false,
                  userId: getCurrentUserId(),
                };
              }
              objects.push(obj);
              saveBoardHistory();
              render();
              saveBoardToServer();
            }
            shapeStart = null;
            shapeEnd = null;
            render();
            return;
          }
        });

        // ============================================================
        // КОЛЕСО МЫШИ
        // ============================================================
        canvas.addEventListener(
          "wheel",
          function (e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 1 : -1;
            const factor = delta > 0 ? 1 / CONFIG.ZOOM_WHEEL : CONFIG.ZOOM_WHEEL;
            const newZoom = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, zoom * factor));
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const before = screenToWorld(mx, my);
            zoom = newZoom;
            const after = screenToWorld(mx, my);
            camera.x += before.x - after.x;
            camera.y += before.y - after.y;
            document.getElementById("zoom-display").textContent = Math.round(zoom * 100) + "%";
            render();
          },
          { passive: false },
        );

        // ============================================================
        // ДВОЙНОЙ КЛИК ПО ТЕКСТУ
        // ============================================================
        canvas.addEventListener("dblclick", function (e) {
          const coords = getCoords(e);
          const found = findObjectAt(coords.x, coords.y);
          if (found && found.type === "text") {
            openTextEditor(found);
            e.preventDefault();
          }
        });

        // ============================================================
        // КНОПКА РЕДАКТИРОВАНИЯ ЛИСТА
        // ============================================================
        const sheetEditBtn = document.getElementById("sheet-edit-btn");
        if (sheetEditBtn) {
          // ===== БЛОКИРУЕМ ВСПЛЫТИЕ НА CANVAS =====
          sheetEditBtn.addEventListener("mousedown", function (e) {
            e.stopPropagation();
            e.preventDefault();
          });
          sheetEditBtn.addEventListener("mouseup", function (e) {
            e.stopPropagation();
          });
          sheetEditBtn.addEventListener("touchstart", function (e) {
            e.stopPropagation();
          });
          sheetEditBtn.addEventListener("touchend", function (e) {
            e.stopPropagation();
          });
          sheetEditBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            e.preventDefault();
            if (isSheetTextMode) {
              stopSheetTextEditing();
            } else {
              startSheetTextEditing();
            }
          });
        }

        (function initSheetTextToolbar() {
          const boldBtn = document.getElementById("sheet-text-bold");
          const italicBtn = document.getElementById("sheet-text-italic");
          const underlineBtn = document.getElementById("sheet-text-underline");
          const colorInput = document.getElementById("sheet-text-color");
          const sizeInput = document.getElementById("sheet-text-size");
          const fontSelect = document.getElementById("sheet-text-font");

          if (!boldBtn) return;

          // ===== B / I / U =====
          boldBtn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
          boldBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!editingSheet) return;
            toggleSheetStyle(editingSheet, "bold");
          });

          italicBtn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
          italicBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!editingSheet) return;
            toggleSheetStyle(editingSheet, "italic");
          });

          underlineBtn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
          underlineBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!editingSheet) return;
            toggleSheetStyle(editingSheet, "underline");
          });

          // ===== ЦВЕТ =====
          if (colorInput) {
            colorInput.addEventListener("mousedown", (e) => e.stopPropagation());
            colorInput.addEventListener("input", function (e) {
              e.stopPropagation();
              if (!editingSheet) return;
              const range = getSheetSelectionRange();
              if (range.start === range.end) {
                // Нет выделения — в текущий стиль
                getSheetCurrentStyle(editingSheet).color = this.value;
                editingSheet.textColor = this.value;
              } else {
                // Есть выделение — применяем
                const chars = flattenSegments(editingSheet.richText);
                for (let i = range.start; i < range.end; i++) {
                  if (chars[i]) chars[i].color = this.value;
                }
                editingSheet.richText = charsToSegments(chars);
                editingSheet.text = segmentsToText(editingSheet.richText);
              }
              render();
              saveBoardHistory();
              saveBoardToServer();
            });
          }

          if (sizeInput) {
            sizeInput.addEventListener("mousedown", (e) => e.stopPropagation());
            sizeInput.addEventListener("keydown", (e) => {
              if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
                e.stopPropagation();
              }
              if (e.key === "Enter") {
                e.preventDefault();
                applySizeFromInput();
                sizeInput.blur();
              }
            });
            sizeInput.addEventListener("blur", function () {
              applySizeFromInput();
            });
            sizeInput.addEventListener("change", function () {
              applySizeFromInput();
            });
          }

          function applySizeFromInput() {
            if (!editingSheet) return;
            const el = document.getElementById("sheet-text-size");
            if (!el) return;
            const size = parseInt(el.value);
            if (!size || size < 4 || size > 200) return;

            const range = getSheetSelectionRange();
            const chars = flattenSegments(editingSheet.richText);

            if (range.start === range.end) {
              if (!editingSheet._currentStyle) {
                editingSheet._currentStyle = {
                  bold: false,
                  italic: false,
                  underline: false,
                  strike: false,
                  color: editingSheet.textColor || "#000000",
                  size: editingSheet.textSize || 18,
                  font: editingSheet.textFont || "Arial",
                };
              }
              editingSheet._currentStyle.size = size;
              editingSheet.textSize = size;
            } else {
              for (let i = range.start; i < range.end; i++) {
                if (chars[i]) chars[i].size = size;
              }
              editingSheet.richText = charsToSegments(chars);
              editingSheet.text = segmentsToText(editingSheet.richText);
              autoExpandSheet(editingSheet);
            }

            el.value = size;
            render();
            saveBoardHistory();
            saveBoardToServer();
          }

          // ===== ШРИФТ =====
          if (fontSelect) {
            fontSelect.addEventListener("mousedown", (e) => e.stopPropagation());
            fontSelect.addEventListener("change", function (e) {
              e.stopPropagation();
              if (!editingSheet) return;
              const font = this.value;
              const range = getSheetSelectionRange();
              if (range.start === range.end) {
                getSheetCurrentStyle(editingSheet).font = font;
                editingSheet.textFont = font;
              } else {
                const chars = flattenSegments(editingSheet.richText);
                for (let i = range.start; i < range.end; i++) {
                  if (chars[i]) chars[i].font = font;
                }
                editingSheet.richText = charsToSegments(chars);
                editingSheet.text = segmentsToText(editingSheet.richText);
              }
              render();
              saveBoardHistory();
              saveBoardToServer();
            });
          }

          ["left", "center", "right"].forEach((align) => {
            const btn = document.getElementById("sheet-text-" + align);
            if (!btn) return;
            btn.addEventListener("mousedown", (e) => {
              e.preventDefault();
              e.stopPropagation();
            });
            btn.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              if (!editingSheet) return;
              ["sheet-text-left", "sheet-text-center", "sheet-text-right"].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.classList.remove("active");
              });
              this.classList.add("active");
              editingSheet.textAlign = align;
              render();
              saveBoardHistory();
              saveBoardToServer();
            });
          });

          // ===== ГОТОВО =====
          const doneBtn = document.getElementById("sheet-text-done");
          if (doneBtn) {
            doneBtn.addEventListener("mousedown", (e) => {
              e.preventDefault();
              e.stopPropagation();
            });
            doneBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              stopSheetTextEditing();
            });
          }
        })();

        // ============================================================
        // СОХРАНЕНИЕ
        // ============================================================
        document.getElementById("save-board-btn").addEventListener("click", function () {
          saveBoardToServer();
          showHint("💾 Сохранено!");
        });
      }

      // ============================================================
      // ЛАСТИК - ИСПРАВЛЕННАЯ ВЕРСИЯ
      // ============================================================

      let eraserCooldown = false;
      let lastErasedId = null;
      let eraserLastTime = 0;

      function eraseAt(coords) {
        const now = Date.now();
        eraserLastTime = now;

        const found = findObjectAt(coords.x, coords.y);
        if (found && found.type !== "coords") {
          if (lastErasedId === found.id) return;

          const idx = objects.indexOf(found);
          if (idx >= 0) {
            lastErasedId = found.id;

            // ===== ЕСЛИ СТИРАЕМ ЛИСТ В РЕЖИМЕ РЕДАКТИРОВАНИЯ — ВЫХОДИМ =====
            if (found.type === "sheet" && isSheetTextMode && editingSheet === found) {
              stopSheetTextEditing();
            }

            if (found.type === "image") {
              delete imageCache[found.id];
            }
            objects.splice(idx, 1);
            selected = [];

            // ===== ПРИНУДИТЕЛЬНО СКРЫВАЕМ КНОПКУ =====
            forceHideSheetEditButton();

            const boardId = getBoardId();
            if (!boardHistories[boardId]) {
              boardHistories[boardId] = { history: [], index: -1 };
            }
            const myHistory = boardHistories[boardId];

            if (myHistory.index < myHistory.history.length - 1) {
              myHistory.history = myHistory.history.slice(0, myHistory.index + 1);
            }

            myHistory.history.push(JSON.parse(JSON.stringify(objects)));
            myHistory.index = myHistory.history.length - 1;

            if (myHistory.history.length > 50) {
              myHistory.history.shift();
              myHistory.index--;
            }

            render();
            saveBoardToServer();
            showHint("🧹 Стерто!");

            setTimeout(() => {
              lastErasedId = null;
            }, 300);
          }
        }
      }

      // ============================================================
      // ВСТАВКА ИЗ БУФЕРА ОБМЕНА (Ctrl+V) - ИСПРАВЛЕННАЯ
      // ============================================================

      // Функция для вставки изображения из data URL
      function insertImageFromDataUrl(dataUrl) {
        if (!canvas) {
          console.warn("⚠️ Canvas не инициализирован");
          return;
        }

        

        const centerX = camera.x + canvas.width / (2 * zoom);
        const centerY = camera.y + canvas.height / (2 * zoom);

        const img = new Image();
        img.onload = function () {
          

          const maxSize = 600;
          let w = img.width,
            h = img.height;
          if (w > maxSize) {
            h = (h * maxSize) / w;
            w = maxSize;
          }
          if (h > maxSize) {
            w = (w * maxSize) / h;
            h = maxSize;
          }

          const offset = Math.random() * 30;

          const obj = {
            id: nextId++,
            type: "image",
            x: centerX - w / 2 + offset,
            y: centerY - h / 2 + offset,
            width: w,
            height: h,
            imgData: dataUrl,
            userId: getCurrentUserId(),
          };
          objects.push(obj);
          selected = [obj.id];

          saveBoardHistory();
          render();
          showHint("🖼️ Изображение вставлено из буфера обмена");
          saveBoardToServer();
        };
        img.onerror = function () {
          console.error("❌ Ошибка загрузки изображения");
          showHint("❌ Не удалось вставить изображение");
        };
        img.src = dataUrl;
      }

      function insertTextOnBoard(text) {
        if (!canvas) {
          console.warn("⚠️ Canvas не инициализирован");
          return;
        }

        

        const centerX = camera.x + canvas.width / (2 * zoom);
        const centerY = camera.y + canvas.height / (2 * zoom);

        const textObj = {
          id: nextId++,
          type: "text",
          x: centerX,
          y: centerY,
          width: 300,
          height: 40,
          text: text,
          font: "Arial",
          size: 24,
          color: "#000000",
          userId: getCurrentUserId(),
          // parentSheetId, offsetX, offsetY — НЕТ
        };
        updateTextDimensions(textObj);
        objects.push(textObj);
        selected = [textObj.id];

        saveBoardHistory();
        render();
        showHint("📝 Текст вставлен из буфера обмена");
        saveBoardToServer();
      }

      // ============================================================
      // ЕДИНЫЙ ОБРАБОТЧИК ВСТАВКИ (Ctrl+V)
      // Приоритет: 1) внутренний буфер доски → 2) глобальный буфер
      // ============================================================
      document.addEventListener(
        "paste",
        function (e) {
          

          // ===== 1. НЕ МЕШАЕМ ПОЛЯМ ВВОДА =====
          const target = e.target;
          if (
            target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target.closest("#text-editor") ||
            target.closest(".subtask-answer-input") ||
            target.closest(".modal-content")
          ) {
            
            return;
          }

          if (isSheetTextMode && editingSheet) {
            e.preventDefault();
            e.stopPropagation();

            const text = e.clipboardData.getData("text/plain");
            if (!text || text.length === 0) return;

            const range = getSheetSelectionRange();
            const chars = flattenSegments(editingSheet.richText);

            let baseStyle = editingSheet._currentStyle || {
              bold: false,
              italic: false,
              underline: false,
              strike: false,
              color: editingSheet.textColor || "#000000",
              size: editingSheet.textSize || 18,
              font: editingSheet.textFont || "Arial",
            };
            if (range.start > 0 && chars[range.start - 1]) {
              const left = chars[range.start - 1];
              baseStyle = {
                bold: left.bold,
                italic: left.italic,
                underline: left.underline,
                strike: left.strike,
                color: left.color,
                size: left.size,
                font: left.font,
              };
            }

            const before = chars.slice(0, range.start);
            const after = chars.slice(range.end);
            const inserted = [];
            for (const ch of text) {
              inserted.push({ ...baseStyle, char: ch });
            }
            const newChars = [...before, ...inserted, ...after];

            editingSheet.richText = charsToSegments(newChars);
            editingSheet.text = segmentsToText(editingSheet.richText);
            sheetSelection.anchor = sheetSelection.focus = range.start + text.length;

            autoExpandSheet(editingSheet);
            render();
            updateSheetToolbarFromSelection();
            saveBoardHistory();
            saveBoardToServer();
            showHint("📋 Текст вставлен в лист");
            return;
          }

          // ===== 3. ВСТАВКА НА ДОСКУ =====
          if (!canvas) return;
          e.preventDefault();
          

          // ============================================================
          // ПРИОРИТЕТ 1: ВНУТРЕННИЙ БУФЕР ДОСКИ (то, что скопировали кнопкой)
          // ============================================================
          if (clipboard.length > 0) {
            
            pasteObjects();
            showHint(`📋 Вставлено из буфера доски: ${clipboard.length} объектов`);
            return;
          }

          

          // ============================================================
          // ПРИОРИТЕТ 2: ГЛОБАЛЬНЫЙ БУФЕР — ИЗОБРАЖЕНИЯ
          // ============================================================
          const items = e.clipboardData.items;
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.type.indexOf("image") !== -1) {
              const file = item.getAsFile();
              if (file) {
                
                const reader = new FileReader();
                reader.onload = function (event) {
                  insertImageFromDataUrl(event.target.result);
                };
                reader.readAsDataURL(file);
                showStatus("⏳ Вставка изображения...");
                return;
              }
            }
          }

          // ============================================================
          // ПРИОРИТЕТ 3: ГЛОБАЛЬНЫЙ БУФЕР — ТЕКСТ / JSON ДОСКИ
          // ============================================================
          const text = e.clipboardData.getData("text/plain");
          if (text && text.trim().length > 0) {
            // Проверяем, не JSON ли это с объектами доски
            try {
              const parsed = JSON.parse(text);
              if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].type) {
                
                clipboard = parsed;
                pasteObjects();
                showHint("📋 Объекты вставлены из глобального буфера");
                return;
              }
            } catch (err) {}

            // Обычный текст
            
            insertTextOnBoard(text.trim());
            return;
          }

          showHint("❌ Нет данных для вставки");
        },
        true,
      );

      copySelected = async function () {
        // ============================================================
        // ПРИОРИТЕТ 1: РЕЖИМ РЕДАКТИРОВАНИЯ ЛИСТА — КОПИРУЕМ ТЕКСТ
        // ============================================================
        if (isSheetTextMode && editingSheet) {
          const range = getSheetSelectionRange();
          const chars = flattenSegments(editingSheet.richText);

          // Есть выделение → копируем только фрагмент
          let textToCopy = "";
          if (range.start !== range.end) {
            textToCopy = chars
              .slice(range.start, range.end)
              .map((c) => c.char)
              .join("");
          } else {
            // Нет выделения → копируем весь текст листа
            textToCopy = segmentsToText(editingSheet.richText);
          }

          if (!textToCopy || textToCopy.length === 0) {
            showHint("❌ На листе нет текста");
            return;
          }

          try {
            await navigator.clipboard.writeText(textToCopy);
            if (range.start !== range.end) {
              showHint(`📝 Скопирован фрагмент (${textToCopy.length} симв.)`);
            } else {
              showHint(`📝 Скопирован весь текст листа (${textToCopy.length} симв.)`);
            }
          } catch (e) {
            // Fallback для старых браузеров
            const ta = document.createElement("textarea");
            ta.value = textToCopy;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showHint(`📝 Скопирован текст (${textToCopy.length} симв.)`);
          }
          return;
        }

        // ============================================================
        // ПРИОРИТЕТ 2: ВЫДЕЛЕНЫ ОБЪЕКТЫ
        // ============================================================
        if (selected.length === 0) {
          showHint("Нет объектов для копирования");
          return;
        }

        // ===== Сохраняем во внутренний буфер для Ctrl+V внутри доски =====
        clipboard = [];
        const selectedObjects = [];
        selected.forEach((id) => {
          const obj = objects.find((o) => o.id === id);
          if (obj) {
            selectedObjects.push(obj);
            clipboard.push(JSON.parse(JSON.stringify(obj)));
          }
        });

        // Проверяем типы
        let allText = true;
        let allImages = true;
        let hasText = false;
        let hasImages = false;
        let textContent = "";

        selectedObjects.forEach((obj) => {
          if (obj.type === "text" && obj.text) {
            hasText = true;
            textContent += (textContent ? "\n" : "") + obj.text;
          } else {
            allText = false;
          }
          if (obj.type === "image") {
            hasImages = true;
          } else {
            allImages = false;
          }
        });

        // ============================================================
        // СЛУЧАЙ A: ТОЛЬКО ТЕКСТОВЫЕ ОБЪЕКТЫ → копируем текст
        // ============================================================
        if (allText && hasText && selectedObjects.length > 0) {
          try {
            await navigator.clipboard.writeText(textContent);
            showHint(`📝 Текст скопирован (${selectedObjects.length} блок.)`);
            return;
          } catch (e) {
            const ta = document.createElement("textarea");
            ta.value = textContent;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showHint("📝 Текст скопирован");
            return;
          }
        }

        // ============================================================
        // СЛУЧАЙ B: ТОЛЬКО КАРТИНКИ → копируем PNG
        // ============================================================
        if (allImages && hasImages && selectedObjects.length > 0) {
          try {
            const img = selectedObjects[0];
            if (img && img.imgData) {
              const response = await fetch(img.imgData);
              const blob = await response.blob();
              await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
              showHint("🖼️ Изображение скопировано");
              return;
            }
          } catch (e) {
            
            // Падаем в общий случай C — рендерим PNG
          }
        }

        // ============================================================
        // СЛУЧАЙ C: СМЕШАННОЕ / ФИГУРЫ / ЛИСТ → рендерим всё в PNG
        // ============================================================
        try {
          // Определяем границы всех выделенных объектов
          let minX = Infinity,
            maxX = -Infinity,
            minY = Infinity,
            maxY = -Infinity;
          let hasValidBounds = false;

          selectedObjects.forEach((obj) => {
            let bounds = null;

            if (obj.type === "text") {
              const tempCanvas = document.createElement("canvas");
              const tempCtx = tempCanvas.getContext("2d");
              const fontSize = obj.size || 24;
              const font = obj.font || "Arial";
              tempCtx.font = (obj.bold ? "bold " : "") + (obj.italic ? "italic " : "") + fontSize + "px " + font;
              const lines = (obj.text || "").split("\n");
              let maxWidth = 0;
              lines.forEach((line) => {
                const w = tempCtx.measureText(line).width;
                if (w > maxWidth) maxWidth = w;
              });
              const lineHeight = fontSize * 1.4;
              bounds = {
                minX: obj.x,
                maxX: obj.x + maxWidth,
                minY: obj.y,
                maxY: obj.y + lines.length * lineHeight,
              };
            } else if (obj.type === "image") {
              bounds = { minX: obj.x, maxX: obj.x + obj.width, minY: obj.y, maxY: obj.y + obj.height };
            } else if (obj.type === "free-line" && obj.points && obj.points.length > 0) {
              const xs = obj.points.map((p) => p.x);
              const ys = obj.points.map((p) => p.y);
              bounds = { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
            } else if (obj.type === "circle" || obj.type === "sphere") {
              const cx = (obj.x1 + obj.x2) / 2;
              const cy = (obj.y1 + obj.y2) / 2;
              const r = Math.sqrt((obj.x2 - obj.x1) ** 2 + (obj.y2 - obj.y1) ** 2) / 2;
              bounds = { minX: cx - r, maxX: cx + r, minY: cy - r, maxY: cy + r };
            } else if (obj.type === "coords") {
              bounds = { minX: -500, maxX: 500, minY: -500, maxY: 500 };
            } else if (obj.type === "sheet") {
              const minX2 = Math.min(obj.x1, obj.x2);
              const maxX2 = Math.max(obj.x1, obj.x2);
              const minY2 = Math.min(obj.y1, obj.y2);
              const maxY2 = Math.max(obj.y1, obj.y2);
              bounds = { minX: minX2, maxX: maxX2, minY: minY2, maxY: maxY2 };

              // Учитываем richText — если текст длиннее листа
              if (obj.richText) {
                const layout = getSheetTextLayout(obj);
                if (layout.lines.length > 0) {
                  const textBottom = layout.textTop + layout.lines.length * layout.lineHeight;
                  if (textBottom > bounds.maxY) bounds.maxY = textBottom;
                }
              }
            } else {
              bounds = {
                minX: Math.min(obj.x1, obj.x2),
                maxX: Math.max(obj.x1, obj.x2),
                minY: Math.min(obj.y1, obj.y2),
                maxY: Math.max(obj.y1, obj.y2),
              };
            }

            if (bounds) {
              if (bounds.minX < minX) minX = bounds.minX;
              if (bounds.maxX > maxX) maxX = bounds.maxX;
              if (bounds.minY < minY) minY = bounds.minY;
              if (bounds.maxY > maxY) maxY = bounds.maxY;
              hasValidBounds = true;
            }
          });

          if (!hasValidBounds) {
            showHint("❌ Не удалось определить область");
            return;
          }

          const pad = 20;
          minX -= pad;
          minY -= pad;
          maxX += pad;
          maxY += pad;
          const width = maxX - minX;
          const height = maxY - minY;

          if (width < 1 || height < 1) {
            showHint("❌ Область слишком маленькая");
            return;
          }

          // Создаём временный canvas
          const scale = 2;
          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = Math.round(width * scale);
          tempCanvas.height = Math.round(height * scale);
          const tempCtx = tempCanvas.getContext("2d");

          // Белый фон
          tempCtx.fillStyle = "#ffffff";
          tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

          const toScreen = (wx, wy) => ({
            x: (wx - minX) * scale,
            y: (wy - minY) * scale,
          });

          // Рисуем объекты
          const imagePromises = [];

          selectedObjects.forEach((obj) => {
            const color = obj.color || currentColor || "#000000";
            const thickness = obj.thickness || currentThickness || 2;

            // ----- ЛИСТ -----
            if (obj.type === "sheet") {
              const p1 = toScreen(Math.min(obj.x1, obj.x2), Math.min(obj.y1, obj.y2));
              const p2 = toScreen(Math.max(obj.x1, obj.x2), Math.max(obj.y1, obj.y2));
              const w = p2.x - p1.x;
              const h = p2.y - p1.y;

              // Белый фон листа
              tempCtx.fillStyle = "#ffffff";
              tempCtx.fillRect(p1.x, p1.y, w, h);

              // Рамка
              tempCtx.strokeStyle = obj.color || "#333";
              tempCtx.lineWidth = 1.5 * scale;
              tempCtx.strokeRect(p1.x, p1.y, w, h);

              // Текст на листе (richText)
              if (obj.richText && obj.richText.length > 0) {
                const layout = getSheetTextLayout(obj);
                if (layout.lines.length > 0) {
                  let yScreen = toScreen(layout.textLeft, layout.textTop).y;
                  const lineHeightScreen = layout.lineHeight * scale;

                  layout.lines.forEach((lineInfo) => {
                    const lineStartX = toScreen(layout.textLeft + lineInfo.startX, 0).x;
                    let xCursor = lineStartX;

                    lineInfo.line.forEach((c) => {
                      const fontSize = (c.size || 18) * scale;
                      const style =
                        (c.bold ? "bold " : "") + (c.italic ? "italic " : "") + fontSize + "px " + (c.font || "Arial");
                      tempCtx.font = style;
                      tempCtx.fillStyle = c.color || "#000000";
                      tempCtx.textBaseline = "top";
                      tempCtx.fillText(c.char, xCursor, yScreen);

                      const charW = tempCtx.measureText(c.char).width;

                      // Подчёркивание
                      if (c.underline) {
                        tempCtx.strokeStyle = c.color || "#000000";
                        tempCtx.lineWidth = Math.max(1, 1.5 * scale);
                        tempCtx.beginPath();
                        tempCtx.moveTo(xCursor, yScreen + fontSize + 2 * scale);
                        tempCtx.lineTo(xCursor + charW, yScreen + fontSize + 2 * scale);
                        tempCtx.stroke();
                      }
                      // Зачёркивание
                      if (c.strike) {
                        tempCtx.strokeStyle = c.color || "#000000";
                        tempCtx.lineWidth = Math.max(1, 1.5 * scale);
                        tempCtx.beginPath();
                        tempCtx.moveTo(xCursor, yScreen + fontSize / 2);
                        tempCtx.lineTo(xCursor + charW, yScreen + fontSize / 2);
                        tempCtx.stroke();
                      }

                      xCursor += charW;
                    });

                    yScreen += lineHeightScreen;
                  });
                }
              }
              return;
            }

            // ----- ТЕКСТ -----
            if (obj.type === "text") {
              const p = toScreen(obj.x, obj.y);
              const fontSize = (obj.size || 24) * scale;
              const style =
                (obj.bold ? "bold " : "") + (obj.italic ? "italic " : "") + fontSize + "px " + (obj.font || "Arial");

              tempCtx.font = style;
              tempCtx.textBaseline = "top";
              tempCtx.fillStyle = obj.color || "#000000";
              tempCtx.textAlign = obj.align || "left";

              const lines = (obj.text || "").split("\n");
              const lineHeight = fontSize * 1.4;
              let yOffset = 0;
              lines.forEach((line) => {
                tempCtx.fillText(line, p.x, p.y + yOffset);
                yOffset += lineHeight;
              });
              return;
            }

            // ----- ИЗОБРАЖЕНИЕ -----
            if (obj.type === "image" && obj.imgData) {
              const p1 = toScreen(obj.x, obj.y);
              const w = obj.width * scale;
              const h = obj.height * scale;

              const promise = new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                  tempCtx.drawImage(img, p1.x, p1.y, w, h);
                  resolve();
                };
                img.onerror = () => resolve();
                img.src = obj.imgData;
              });
              imagePromises.push(promise);
              return;
            }

            // ----- FREE-LINE -----
            if (obj.type === "free-line" && obj.points && obj.points.length > 1) {
              tempCtx.strokeStyle = color;
              tempCtx.lineWidth = Math.max(1, thickness * scale);
              tempCtx.lineCap = "round";
              tempCtx.lineJoin = "round";
              tempCtx.beginPath();
              const first = toScreen(obj.points[0].x, obj.points[0].y);
              tempCtx.moveTo(first.x, first.y);
              for (let i = 1; i < obj.points.length; i++) {
                const p = toScreen(obj.points[i].x, obj.points[i].y);
                tempCtx.lineTo(p.x, p.y);
              }
              tempCtx.stroke();
              return;
            }

            // ----- ЛИНИИ -----
            if (obj.type === "segment" || obj.type === "ray" || obj.type === "line") {
              const p1 = toScreen(obj.x1, obj.y1);
              const p2 = toScreen(obj.x2, obj.y2);

              tempCtx.strokeStyle = color;
              tempCtx.lineWidth = Math.max(1, thickness * scale);
              if (obj.dash) tempCtx.setLineDash(obj.dash.map((d) => d * scale));

              tempCtx.beginPath();
              tempCtx.moveTo(p1.x, p1.y);
              tempCtx.lineTo(p2.x, p2.y);
              tempCtx.stroke();
              tempCtx.setLineDash([]);

              if (obj.type === "ray") {
                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const len = 15 * scale;
                tempCtx.fillStyle = color;
                tempCtx.beginPath();
                tempCtx.moveTo(p2.x, p2.y);
                tempCtx.lineTo(p2.x - len * Math.cos(angle - 0.4), p2.y - len * Math.sin(angle - 0.4));
                tempCtx.lineTo(p2.x - len * Math.cos(angle + 0.4), p2.y - len * Math.sin(angle + 0.4));
                tempCtx.closePath();
                tempCtx.fill();
              }
              return;
            }

            // ----- ФИГУРЫ (все остальные) -----
            if (obj.type !== "coords") {
              const p1 = toScreen(obj.x1, obj.y1);
              const p2 = toScreen(obj.x2, obj.y2);
              const cx = (p1.x + p2.x) / 2;
              const cy = (p1.y + p2.y) / 2;
              const w = p2.x - p1.x;
              const h = p2.y - p1.y;
              const r = Math.sqrt(w * w + h * h) / 2;

              tempCtx.strokeStyle = color;
              tempCtx.lineWidth = Math.max(1, thickness * scale);
              tempCtx.beginPath();

              switch (obj.type) {
                case "circle":
                  tempCtx.arc(cx, cy, r, 0, Math.PI * 2);
                  break;
                case "square": {
                  const s = Math.min(Math.abs(w), Math.abs(h));
                  tempCtx.rect(cx - s / 2, cy - s / 2, s, s);
                  break;
                }
                case "rect":
                  tempCtx.rect(Math.min(p1.x, p2.x), Math.min(p1.y, p2.y), Math.abs(w), Math.abs(h));
                  break;
                case "triangle":
                  tempCtx.moveTo(cx, p1.y);
                  tempCtx.lineTo(p1.x, p2.y);
                  tempCtx.lineTo(p2.x, p2.y);
                  tempCtx.closePath();
                  break;
                case "triangle_eq": {
                  const side = Math.min(Math.abs(w), Math.abs(h));
                  const h3 = (side * Math.sqrt(3)) / 2;
                  tempCtx.moveTo(cx, p1.y);
                  tempCtx.lineTo(cx - side / 2, p1.y + h3);
                  tempCtx.lineTo(cx + side / 2, p1.y + h3);
                  tempCtx.closePath();
                  break;
                }
                case "triangle_right":
                  tempCtx.moveTo(p1.x, p1.y);
                  tempCtx.lineTo(p1.x, p2.y);
                  tempCtx.lineTo(p2.x, p2.y);
                  tempCtx.closePath();
                  break;
                case "rhombus":
                  tempCtx.moveTo(cx, p1.y);
                  tempCtx.lineTo(p2.x, cy);
                  tempCtx.lineTo(cx, p2.y);
                  tempCtx.lineTo(p1.x, cy);
                  tempCtx.closePath();
                  break;
                case "parallelogram": {
                  const shift = w * 0.3;
                  tempCtx.moveTo(p1.x + shift, p1.y);
                  tempCtx.lineTo(p2.x, p1.y);
                  tempCtx.lineTo(p2.x - shift, p2.y);
                  tempCtx.lineTo(p1.x, p2.y);
                  tempCtx.closePath();
                  break;
                }
                case "trapezoid": {
                  const topW = w * 0.5;
                  tempCtx.moveTo(cx - topW / 2, p1.y);
                  tempCtx.lineTo(cx + topW / 2, p1.y);
                  tempCtx.lineTo(p2.x, p2.y);
                  tempCtx.lineTo(p1.x, p2.y);
                  tempCtx.closePath();
                  break;
                }
                case "hexagon": {
                  for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 6 + (i * Math.PI) / 3;
                    const px = cx + r * Math.cos(angle);
                    const py = cy + r * Math.sin(angle);
                    if (i === 0) tempCtx.moveTo(px, py);
                    else tempCtx.lineTo(px, py);
                  }
                  tempCtx.closePath();
                  break;
                }
                default:
                  tempCtx.rect(Math.min(p1.x, p2.x), Math.min(p1.y, p2.y), Math.abs(w), Math.abs(h));
              }
              tempCtx.stroke();
              return;
            }
          });

          // Ждём загрузки картинок
          if (imagePromises.length > 0) {
            await Promise.all(imagePromises);
          }

          // Конвертируем в PNG blob
          const pngBlob = await new Promise((resolve) => tempCanvas.toBlob(resolve, "image/png"));

          // Копируем в глобальный буфер
          try {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]);
            showHint("🖼️ Изображение скопировано в буфер обмена");
          } catch (e) {
            console.error("❌ Clipboard API error:", e);
            // Fallback — скачивание
            const url = URL.createObjectURL(pngBlob);
            const link = document.createElement("a");
            link.download = "копия.png";
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showHint("⚠️ Clipboard API недоступен, файл скачан");
          }
        } catch (error) {
          console.error("❌ Ошибка копирования:", error);
          showHint("❌ Ошибка: " + error.message);
        }
      };

      // ============================================================
      // ОПРЕДЕЛЕНИЕ: попал ли клик в маркер ресайза
      // ============================================================
      function checkResizeHandleHit(e) {
        if (selected.length === 0) return null;

        const bounds = getSelectedBounds();
        if (!bounds) return null;

        const pad = CONFIG.SELECTION_PAD;
        const p1 = worldToScreen(bounds.minX - pad, bounds.minY - pad);
        const p2 = worldToScreen(bounds.maxX + pad, bounds.maxY + pad);

        // Координаты клика в пикселях canvas
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        // Радиус попадания (в пикселях canvas)
        const R = 18;

        // Позиции маркеров
        const handles = {
          tl: { x: p1.x, y: p1.y },
          tr: { x: p2.x, y: p1.y },
          bl: { x: p1.x, y: p2.y },
          br: { x: p2.x, y: p2.y },
          t: { x: p1.x + (p2.x - p1.x) / 2, y: p1.y },
          b: { x: p1.x + (p2.x - p1.x) / 2, y: p2.y },
          l: { x: p1.x, y: p1.y + (p2.y - p1.y) / 2 },
          r: { x: p2.x, y: p1.y + (p2.y - p1.y) / 2 },
        };

        for (const [id, pos] of Object.entries(handles)) {
          const dx = mx - pos.x;
          const dy = my - pos.y;
          if (dx * dx + dy * dy < R * R) {
            return id;
          }
        }

        return null;
      }

      // ============================================================
      // ВСТАВКА ИЗОБРАЖЕНИЯ ИЗ DATA URL
      // ============================================================

      function insertImageFromDataUrl(dataUrl) {
        if (!canvas) {
          console.warn("⚠️ Canvas не инициализирован");
          return;
        }

        

        const centerX = camera.x + canvas.width / (2 * zoom);
        const centerY = camera.y + canvas.height / (2 * zoom);

        const img = new Image();
        img.onload = function () {
          

          const maxSize = 600;
          let w = img.width,
            h = img.height;
          if (w > maxSize) {
            h = (h * maxSize) / w;
            w = maxSize;
          }
          if (h > maxSize) {
            w = (w * maxSize) / h;
            h = maxSize;
          }

          const offset = Math.random() * 30;

          const obj = {
            id: nextId++,
            type: "image",
            x: centerX - w / 2 + offset,
            y: centerY - h / 2 + offset,
            width: w,
            height: h,
            imgData: dataUrl,
            userId: getCurrentUserId(),
          };
          objects.push(obj);
          selected = [obj.id];

          saveBoardHistory();
          render();
          showHint("🖼️ Изображение вставлено из буфера обмена");
          saveBoardToServer();
        };
        img.onerror = function () {
          console.error("❌ Ошибка загрузки изображения");
          showHint("❌ Не удалось вставить изображение");
        };
        img.src = dataUrl;
      }

      // ============================================================
      // ВСТАВКА ТЕКСТА
      // ============================================================

      function insertTextOnBoard(text) {
        if (!canvas) {
          console.warn("⚠️ Canvas не инициализирован");
          return;
        }

        

        const centerX = camera.x + canvas.width / (2 * zoom);
        const centerY = camera.y + canvas.height / (2 * zoom);

        const textObj = {
          id: nextId++,
          type: "text",
          x: centerX,
          y: centerY,
          width: 300,
          height: 40,
          text: text,
          font: "Arial",
          size: 24,
          color: "#000000",
          userId: getCurrentUserId(),
        };
        updateTextDimensions(textObj);
        objects.push(textObj);
        selected = [textObj.id];

        saveBoardHistory();
        render();
        showHint("📝 Текст вставлен из буфера обмена");
        saveBoardToServer();
      }

      // ===== ВВОД С МОБИЛЬНОЙ КЛАВИАТУРЫ =====
      document.addEventListener(
        "input",
        function (e) {
          if (e.target.id !== "mobile-sheet-input") return;
          if (!isSheetTextMode || !editingSheet) return;

          const text = e.target.value;
          if (!text) return;

          // Вставляем каждый символ в лист
          const range = getSheetSelectionRange();
          const chars = flattenSegments(editingSheet.richText);

          let baseStyle = editingSheet._currentStyle || {
            bold: false,
            italic: false,
            underline: false,
            strike: false,
            color: editingSheet.textColor || "#000000",
            size: editingSheet.textSize || 18,
            font: editingSheet.textFont || "Arial",
          };

          const before = chars.slice(0, range.start);
          const after = chars.slice(range.end);
          const inserted = [];
          for (const ch of text) {
            inserted.push({ ...baseStyle, char: ch });
          }
          const newChars = [...before, ...inserted, ...after];

          editingSheet.richText = charsToSegments(newChars);
          editingSheet.text = segmentsToText(editingSheet.richText);
          sheetSelection.anchor = sheetSelection.focus = range.start + text.length;

          autoExpandSheet(editingSheet);
          render();
          updateSheetToolbarFromSelection();

          // Очищаем поле, чтобы можно было вводить дальше
          e.target.value = "";

          clearTimeout(window._sheetSaveTimeout);
          window._sheetSaveTimeout = setTimeout(() => {
            saveBoardHistory();
            saveBoardToServer();
          }, 800);
        },
        true,
      );

      

      

      checkAuth();

      
      
    </script>
  </body>
</html>

                <textarea id="assignment-desc" placeholder="Описание задания" rows="2" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:6px;font-size:14px;resize:vertical;margin-bottom:10px;"></textarea>
                
                <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:100px;">
                        <label style="font-size:12px;color:#666;">Макс. балл:</label>
                        <input type="number" id="assignment-max-score" value="100" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;">
                    </div>
                    <div style="flex:1;min-width:150px;">
                        <label style="font-size:12px;color:#666;">Срок сдачи:</label>
                        <input type="datetime-local" id="assignment-due-date" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;">
                    </div>
                </div>
                
                <!-- Общая подсказка для всего задания -->
                <div style="margin:10px 0;padding:10px;background:#f0f4ff;border-radius:6px;">
                    <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" id="assignment-has-hint" onchange="toggleAssignmentHint()"> 
                        <span style="font-weight:500;">💡 Добавить общую подсказку для всего задания</span>
                    </label>
                    <div id="assignment-hint-block" style="display:none;margin-top:8px;">
                        <textarea id="assignment-hint-text" placeholder="Текст общей подсказки..." rows="2" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:13px;resize:vertical;"></textarea>
                        <div style="margin-top:4px;">
                            <input type="file" id="assignment-hint-file" accept="image/*" style="font-size:12px;">
                            <div id="assignment-hint-preview" style="margin-top:4px;"></div>
                        </div>
                    </div>
                </div>
                
                <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0;">
                    <h4 style="margin:0;">📋 Подзадания</h4>
                    <button onclick="addSubtask()" style="padding:4px 16px;background:#34c759;color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;">+ Добавить</button>
                </div>
                <div id="subtasks-container"></div>
                
                <div class="modal-actions" style="margin-top:16px;">
                    <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="btn-primary" onclick="createAssignment()" style="background:#34c759;padding:10px 30px;font-size:16px;">✅ Создать задание</button>
                </div>
            </div>
        `);

            // Добавляем первое подзадание
            setTimeout(() => {
              addSubtask();
            }, 100);
          })
          .catch((err) => {
            alert("Ошибка загрузки учеников: " + err.message);
          });
      }

      // ============================================================
      // ОБНОВЛЯЕМ loadAssignmentsPage ДЛЯ ПОДДЕРЖКИ ПОДЗАДАНИЙ
      // ============================================================

      let nowPage = 1;
      const ITEMS_PER_PAGE = 20;

      // Переменные для сортировки
      let sortType = "date_desc"; // date_desc, date_asc, status_pending, status_done

      function loadAssignmentsPage() {
        const area = document.getElementById("content-area");
        if (!area) return;
        const classId = selectedClassId;
        if (!classId) {
          area.innerHTML = `<div class="content-page"><div class="card"><h3>📝 Задания</h3><div class="empty"><p>Выберите класс в правой панели</p></div></div></div>`;
          return;
        }
        const token = localStorage.getItem("token");
        if (!token) {
          area.innerHTML = `<div class="content-page"><div class="card"><div class="empty">Авторизуйтесь</div></div></div>`;
          return;
        }

        fetch(`/api/assignments/class/${classId}`, { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => {
            if (!res.ok) throw new Error("Ошибка загрузки");
            return res.json();
          })
          .then((allAssignments) => {
            

            const isTeacher = currentUser?.role === "teacher";

            // ===== СОРТИРОВКА =====
            let assignments = [...allAssignments];

            // Для ученика статус
            const getStatusOrder = (a) => {
              const status = a.submission?.status || "pending";
              return { pending: 0, submitted: 1, graded: 2 }[status] || 0;
            };

            // Для учителя: сначала те, где есть несдавшие
            const getTeacherStatusOrder = (a) => {
              const stats = a._stats || { submitted: 0, graded: 0, totalStudents: 0 };
              const notSubmitted = stats.totalStudents - stats.submitted; // Не сдали
              if (notSubmitted > 0) return 0; // Есть несдавшие — в начало
              if (stats.submitted === 0) return 0; // Никто не сдал — тоже в начало (по сути все не сдали)
              const pendingGrading = stats.submitted - stats.graded;
              if (pendingGrading > 0) return 1; // Есть на проверке — в середину
              return 2; // Все проверены — в конец
            };

            switch (sortType) {
              case "date_desc":
                assignments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                break;
              case "date_asc":
                assignments.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                break;
              case "status_pending":
                if (!isTeacher) {
                  assignments.sort((a, b) => getStatusOrder(a) - getStatusOrder(b));
                } else {
                  assignments.sort((a, b) => getTeacherStatusOrder(a) - getTeacherStatusOrder(b));
                }
                break;
              case "status_done":
                if (!isTeacher) {
                  assignments.sort((a, b) => getStatusOrder(b) - getStatusOrder(a));
                } else {
                  assignments.sort((a, b) => getTeacherStatusOrder(b) - getTeacherStatusOrder(a));
                }
                break;
              default:
                assignments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }

            // ===== ПАГИНАЦИЯ =====
            const totalItems = assignments.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

            if (nowPage > totalPages) nowPage = totalPages;
            if (nowPage < 1) nowPage = 1;

            const startIndex = (nowPage - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
            const pageItems = assignments.slice(startIndex, endIndex);

            // ===== ВЫБОР СОРТИРОВКИ =====
            const sortOptions = isTeacher
              ? {
                  date_desc: "📅 Новые сначала",
                  date_asc: "📅 Старые сначала",
                  status_pending: "⏳ Несданные сначала",
                  status_done: "✅ Все проверены сначала",
                }
              : {
                  date_desc: "📅 Новые сначала",
                  date_asc: "📅 Старые сначала",
                  status_pending: "⏳ Невыполненные сначала",
                  status_done: "✅ Выполненные сначала",
                };

            let html = `<div class="content-page">
                <div class="flex-between">
                    <h2>📝 Задания (${totalItems})</h2>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                        <select id="sort-select" onchange="changeSort(this.value)" style="padding:6px 12px;border-radius:6px;border:1px solid #ddd;font-size:13px;background:white;cursor:pointer;">
                            ${Object.entries(sortOptions)
                              .map(
                                ([value, label]) =>
                                  `<option value="${value}" ${value === sortType ? "selected" : ""}>${label}</option>`,
                              )
                              .join("")}
                        </select>
                        ${isTeacher ? `<button class="btn-primary" onclick="showCreateAssignment()">+ Создать задание</button>` : ""}
                    </div>
                </div>
            `;

            if (totalItems === 0) {
              html += `<div class="card"><div class="empty">Нет заданий</div></div>`;
            } else {
              html += pageItems
                .map((a) => {
                  const status = a.submission?.status || "pending";
                  const statusLabels = {
                    pending: "⏳ Не сдано",
                    submitted: "📤 На проверке",
                    graded: "✅ Проверено",
                  };
                  const statusColors = {
                    pending: "#fef3c7",
                    submitted: "#dbeafe",
                    graded: "#d1fae5",
                  };
                  const statusTextColors = {
                    pending: "#d97706",
                    submitted: "#2563eb",
                    graded: "#059669",
                  };
                  const subtaskCount = a.subtasks?.length || a.items?.length || 0;

                  const hasSubmission = status !== "pending";
                  const hasScore = a.submission?.score !== undefined && a.submission?.score !== null;

                  let statsHtml = "";
                  let teacherStatusHtml = "";
                  let borderColor = statusColors[status];

                  if (isTeacher && a._stats) {
                    const stats = a._stats;
                    const submittedPercent =
                      stats.totalStudents > 0 ? Math.round((stats.submitted / stats.totalStudents) * 100) : 0;
                    const gradedPercent =
                      stats.totalStudents > 0 ? Math.round((stats.graded / stats.totalStudents) * 100) : 0;
                    const notSubmitted = stats.totalStudents - stats.submitted;

                    let teacherStatusText = "";
                    let teacherStatusColor = "";
                    let teacherStatusBg = "";

                    // Приоритет: сначала показываем несдавших
                    if (notSubmitted > 0) {
                      teacherStatusText = `⏳ ${notSubmitted} не сдали`;
                      teacherStatusColor = "#d97706";
                      teacherStatusBg = "#fef3c7";
                      borderColor = "#fef3c7";
                    } else if (stats.submitted === 0) {
                      teacherStatusText = "⏳ Ожидает сдачи";
                      teacherStatusColor = "#d97706";
                      teacherStatusBg = "#fef3c7";
                      borderColor = "#fef3c7";
                    } else if (stats.submitted === stats.graded) {
                      teacherStatusText = "✅ Все проверены";
                      teacherStatusColor = "#059669";
                      teacherStatusBg = "#d1fae5";
                      borderColor = "#059669";
                    } else {
                      const pendingGrading = stats.submitted - stats.graded;
                      teacherStatusText = `📤 ${pendingGrading} на проверке`;
                      teacherStatusColor = "#2563eb";
                      teacherStatusBg = "#dbeafe";
                      borderColor = "#2563eb";
                    }

                    teacherStatusHtml = `
                            <span style="padding:2px 10px;border-radius:10px;font-size:10px;font-weight:500;background:${teacherStatusBg};color:${teacherStatusColor};">
                                ${teacherStatusText}
                            </span>
                        `;

                    statsHtml = `
                            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:#666;">
                                <span title="Всего учеников">👥 ${stats.totalStudents}</span>
                                <span title="Сдано" style="color:#2563eb;">📤 ${stats.submitted} (${submittedPercent}%)</span>
                                <span title="Проверено" style="color:#059669;">✅ ${stats.graded} (${gradedPercent}%)</span>
                                ${notSubmitted > 0 ? `<span title="Не сдано" style="color:#d97706;">⏳ ${notSubmitted}</span>` : ""}
                            </div>
                        `;
                  }

                  const studentStatusHtml = !isTeacher
                    ? `
                        <span style="padding:2px 10px;border-radius:10px;font-size:10px;font-weight:500;background:${statusColors[status]};color:${statusTextColors[status]};">
                            ${statusLabels[status] || "⏳ Не сдано"}
                        </span>
                    `
                    : "";

                  return `<div class="assignment" onclick="showAssignment(${a.id})" style="border-left: 4px solid ${borderColor};">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px;">
                            <div>
                                <div class="title">${a.title}</div>
                                <div class="desc">${a.description || ""}</div>
                            </div>
                            <div style="text-align:right;">
                                ${isTeacher ? teacherStatusHtml : studentStatusHtml}
                            </div>
                        </div>
                        <div class="meta">
                            <span>👤 ${a.teacher_name}</span>
                            <span>📅 ${new Date(a.created_at).toLocaleDateString()}</span>
                            ${subtaskCount > 0 ? `<span>📋 ${subtaskCount} подзаданий</span>` : ""}
                            ${hasScore ? `<span class="score">⭐ ${a.submission.score}/${a.maxScore || 100}</span>` : ""}
                            ${!isTeacher ? (hasSubmission ? `<span style="font-size:11px;color:#059669;">✅ Сдано</span>` : `<span style="font-size:11px;color:#d97706;">⏳ Ожидает</span>`) : ""}
                        </div>
                        ${statsHtml}
                    </div>`;
                })
                .join("");

              // ===== ПАГИНАЦИЯ =====
              if (totalPages > 1) {
                html += `
                        <div class="pagination">
                            <button onclick="goToPage(${nowPage - 1})" ${nowPage <= 1 ? "disabled" : ""}>◀ Назад</button>
                            ${Array.from({ length: Math.min(totalPages, 7) }, (_, i) => {
                              let pageNum;
                              if (totalPages <= 7) {
                                pageNum = i + 1;
                              } else if (nowPage <= 4) {
                                pageNum = i + 1;
                              } else if (nowPage >= totalPages - 3) {
                                pageNum = totalPages - 6 + i;
                              } else {
                                pageNum = nowPage - 3 + i;
                              }
                              if (pageNum < 1 || pageNum > totalPages) return "";
                              return `<button class="page-btn ${pageNum === nowPage ? "active" : ""}" onclick="goToPage(${pageNum})">${pageNum}</button>`;
                            }).join("")}
                            <button onclick="goToPage(${nowPage + 1})" ${nowPage >= totalPages ? "disabled" : ""}>Вперед ▶</button>
                            <span class="page-info">${nowPage} / ${totalPages}</span>
                        </div>
                    `;
              }
            }
            html += `</div>`;
            area.innerHTML = html;
          })
          .catch((e) => {
            console.error("❌ Ошибка загрузки заданий:", e);
            area.innerHTML = `<div class="content-page"><div class="card"><div class="empty">Ошибка загрузки: ${e.message}</div></div></div>`;
          });
      }

      function changeSort(value) {
        sortType = value;
        nowPage = 1;
        loadAssignmentsPage();
      }

      function goToPage(page) {
        nowPage = page;
        loadAssignmentsPage();
      }

      // ============================================================
      // ЗАГРУЗКА ВСЕХ РАБОТ ПО ЗАДАНИЮ (ДЛЯ УЧИТЕЛЯ)
      // ============================================================
      async function loadAllSubmissions(assignmentId) {
        const container = document.getElementById("submissions-list");
        if (!container) return;

        container.innerHTML = `<div style="text-align:center;padding:20px;color:#999;">⏳ Загрузка работ...</div>`;

        try {
          const response = await fetch(`/api/assignments/${assignmentId}/submissions`, {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка загрузки");
          }

          const submissions = await response.json();
          

          if (submissions.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:30px;background:#f8f9fa;border-radius:8px;color:#999;">
                    📭 Нет сданных работ
                </div>
            `;
            return;
          }

          let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 style="font-size:16px;">📋 Сданные работы (${submissions.length})</h3>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
        `;

          submissions.forEach((sub, index) => {
            const statusColors = {
              pending: "#fef3c7",
              submitted: "#dbeafe",
              graded: "#d1fae5",
            };
            const statusTexts = {
              pending: "⏳ Ожидает",
              submitted: "📤 На проверке",
              graded: "✅ Проверено",
            };

            html += `
                <div style="border:1px solid #e0e0e0;border-radius:8px;padding:12px;background:white;cursor:pointer;" 
                     onclick="viewSubmission(${sub.id}, ${assignmentId})">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                        <div>
                            <strong style="font-size:14px;">${index + 1}. ${sub.full_name || sub.username}</strong>
                            <span style="font-size:12px;color:#999;margin-left:8px;">@${sub.username}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:12px;color:#999;">
                                ${sub.submitted_at ? "📅 " + new Date(sub.submitted_at).toLocaleDateString() : "—"}
                            </span>
                            ${
                              sub.score !== null && sub.score !== undefined
                                ? `<span style="font-weight:600;color:#667eea;font-size:14px;">⭐ ${sub.score}</span>`
                                : `<span style="color:#999;font-size:12px;">Не оценено</span>`
                            }
                            <span style="padding:2px 10px;border-radius:10px;font-size:10px;font-weight:500;background:${statusColors[sub.status] || "#f0f0f0"};color:#666;">
                                ${statusTexts[sub.status] || sub.status}
                            </span>
                        </div>
                    </div>
                    ${sub.teacher_comment ? `<div style="font-size:12px;color:#666;margin-top:4px;">💬 ${sub.teacher_comment}</div>` : ""}
                    ${sub.files && sub.files.length > 0 ? `<div style="font-size:11px;color:#999;margin-top:4px;">📎 ${sub.files.length} файлов</div>` : ""}
                </div>
            `;
          });

          html += `</div>`;
          container.innerHTML = html;
        } catch (error) {
          console.error("Ошибка:", error);
          container.innerHTML = `
            <div style="text-align:center;padding:20px;color:#e53e3e;">
                ❌ ${error.message || "Ошибка загрузки работ"}
            </div>
        `;
        }
      }

      // ============================================================
      // ЗАГРУЗКА СПИСКА КЛАССА
      // ============================================================
      async function loadAssignmentStudents(assignmentId) {
        const container = document.getElementById("submissions-list");
        if (!container) return;

        container.innerHTML = `<div style="text-align:center;padding:20px;color:#999;">⏳ Загрузка...</div>`;

        try {
          const response = await fetch(`/api/assignments/${assignmentId}/students`, {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка загрузки");
          }

          const students = await response.json();
          

          let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 style="font-size:16px;">👨‍🎓 Список класса (${students.length})</h3>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
        `;

          if (students.length === 0) {
            html += `<div style="color:#999;padding:12px;">В классе нет учеников</div>`;
          } else {
            students.forEach((student) => {
              const statusColors = {
                pending: "#fef3c7",
                submitted: "#dbeafe",
                graded: "#d1fae5",
              };
              const statusTexts = {
                pending: "⏳ Не сдано",
                submitted: "📤 На проверке",
                graded: "✅ Проверено",
              };

              html += `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f0f0;">
                        <div>
                            <span style="font-weight:500;font-size:13px;">${student.full_name || student.username}</span>
                            <span style="font-size:11px;color:#999;margin-left:6px;">@${student.username}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            ${
                              student.submission_id
                                ? `<button class="btn-primary" onclick="viewSubmission(${student.submission_id}, ${assignmentId})" style="padding:2px 10px;font-size:11px;">📄 Просмотр</button>`
                                : `<span style="color:#999;font-size:11px;">Не сдано</span>`
                            }
                            ${
                              student.score !== null && student.score !== undefined
                                ? `<span style="font-weight:600;color:#667eea;font-size:13px;">⭐ ${student.score}</span>`
                                : ""
                            }
                            <span style="padding:1px 8px;border-radius:8px;font-size:9px;font-weight:500;background:${statusColors[student.status] || "#f0f0f0"};color:#666;">
                                ${statusTexts[student.status] || "—"}
                            </span>
                        </div>
                    </div>
                `;
            });
          }

          html += `</div>`;
          container.innerHTML = html;
        } catch (error) {
          console.error("Ошибка:", error);
          container.innerHTML = `
            <div style="text-align:center;padding:20px;color:#e53e3e;">
                ❌ ${error.message || "Ошибка загрузки"}
            </div>
        `;
        }
      }

      // ============================================================
      // ПРОСМОТР КОНКРЕТНОЙ РАБОТЫ (ДЛЯ УЧИТЕЛЯ) - С ВЫДЕЛЕНИЕМ ТЕКСТА
      // ============================================================

      async function viewSubmission(submissionId, assignmentId) {
        try {
          // ===== ОДИН ЗАПРОС НА ВСЕ ДАННЫЕ =====
          const response = await fetch(`/api/submissions/${submissionId}/full`, {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Ошибка загрузки");
          }

          const submission = await response.json();
          const assignment = submission.assignment;
          const isTeacher = currentUser?.role === "teacher";
          const submissionIdValue = submission.id;

          

          // Группируем текстовые комментарии по подзаданиям
          let textCommentsBySubtask = {};
          if (submission.textComments && submission.textComments.length > 0) {
            submission.textComments.forEach((comment) => {
              const idx = comment.subtask_index || 0;
              if (!textCommentsBySubtask[idx]) {
                textCommentsBySubtask[idx] = [];
              }
              textCommentsBySubtask[idx].push(comment);
            });
          }

          // Группируем аннотации по подзаданиям
          let annotationsBySubtask = {};
          if (submission.annotations && submission.annotations.length > 0) {
            submission.annotations.forEach((ann) => {
              const idx = ann.subtask_index || 0;
              if (!annotationsBySubtask[idx]) {
                annotationsBySubtask[idx] = [];
              }
              annotationsBySubtask[idx].push(ann);
            });
          }

          // Группируем голосовые комментарии по подзаданиям
          let voiceCommentsBySubtask = {};
          if (submission.voiceComments && submission.voiceComments.length > 0) {
            submission.voiceComments.forEach((vc) => {
              const idx = vc.subtask_index || 0;
              if (!voiceCommentsBySubtask[idx]) {
                voiceCommentsBySubtask[idx] = [];
              }
              voiceCommentsBySubtask[idx].push(vc);
            });
            
          }

          // Сохраняем в глобальные переменные
          window._studentAnnotations = annotationsBySubtask;
          window._textComments = textCommentsBySubtask;

          const subtasks = assignment?.content?.items || assignment?.items || [];

          // ===== СТРОИМ HTML =====

          } else {

                        ${task.question ? `<div style="margin:6px 0;font-size:14px;">${task.question}</div>` : ""}
                        ${
                          task.image
                            ? `
                            <div style="margin:8px 0;">
                                <img src="${getFullImagePath(task.image)}" style="max-width:300px;max-height:200px;border-radius:6px;cursor:pointer;border:1px solid #ddd;" onclick="event.stopPropagation();openImageViewer('${task.image}')">

                        <!-- ===== ОТВЕТ УЧЕНИКА ===== -->

                            <!-- ===== ТЕКСТОВЫЕ КОММЕНТАРИИ ===== -->
                            <div class="text-comments-list" style="margin-top:8px;padding:8px 12px;background:#f8f9fa;border-radius:6px;border-left:3px solid #667eea;display:${hasTextComments ? "block" : "none"};">

                                        🎙️ Голосовые комментарии (${subtaskVoiceComments.length}):
                                    </div>
                                    ${subtaskVoiceComments
                                      .map(
                                        (vc) => `
                                        <div class="voice-comment" data-voice-id="${vc.id}" style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f0f4ff;border-radius:8px;margin-bottom:4px;border-left:3px solid #8e44ad;">
                                            ${

                                                ? `
                                                <span style="background:#ffeb3b;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;flex-shrink:0;cursor:pointer;" 
                                                      title="Комментарий к тексту"
                                                      onclick="scrollToTextByContent(this, '${escapeHtml(vc.selected_text)}', ${idx})">
                                                    "${escapeHtml(vc.selected_text.substring(0, 25))}${vc.selected_text.length > 25 ? "..." : ""}"
                                                </span>

                                                : ""
                                            }
                                            <button class="play-btn" onclick="toggleVoicePlayback(this, '${vc.audio_path || vc.audio_url}')" 
                                                    style="width:30px;height:30px;border-radius:50%;border:none;background:#8e44ad;color:white;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;">
                                                ▶
                                            </button>
                                            <div class="voice-timeline" onclick="seekVoice(this, event)" 
                                                 style="flex:1;height:4px;background:#ddd;border-radius:2px;cursor:pointer;position:relative;min-width:60px;">
                                                <div class="progress" style="height:100%;background:#8e44ad;border-radius:2px;width:0%;transition:width 0.1s;"></div>
                                            </div>
                                            <span class="voice-duration" style="font-size:11px;color:#999;min-width:35px;font-variant-numeric:tabular-nums;">${formatDuration(vc.duration || 0)}</span>

                                                ? `
                                                <button class="voice-delete" onclick="deleteVoiceComment(${vc.id}, ${submissionIdValue}, ${idx}, this)" 
                                                        style="background:none;border:none;color:#999;cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;">

                                                </button>

                        ${

                                    <img src="${getFullImagePath(answerImage)}" 
                                        style="max-width:100%;max-height:400px;display:block;position:relative;z-index:1;" 
                                        id="student-image-${idx}"
                                        onclick="event.stopPropagation();openImageViewer('${answerImage}')">
                                </div>
                                <div id="ann-container-${idx}" style="margin-top:8px;width:100%;max-width:500px;"></div>
                            </div>
                        `
                            : `
                            <div style="color:#999;font-size:12px;margin-top:4px;">📎 Фото не прикреплено</div>

          }

          html += `</div>`;
          openModal(html);

          // ===== ИНИЦИАЛИЗАЦИЯ ПОСЛЕ ОТКРЫТИЯ =====
          setTimeout(() => {
            const modalContent = document.getElementById("modal-content");
            if (!modalContent) return;

            // 1. Инициализация выделения текста (для учителя)
            if (isTeacher) {
              initTextHighlighting(modalContent, submissionIdValue);
            }

            // 2. Инициализация аннотаций на фото
            const imageWrappers = modalContent.querySelectorAll('[id^="student-image-wrapper-"]');
            imageWrappers.forEach((wrapper) => {
              const img = wrapper.querySelector("img");
              if (!img) return;

              const idMatch = wrapper.id.match(/student-image-wrapper-(\d+)/);
              const idx = idMatch ? parseInt(idMatch[1]) : 0;
              const container = document.getElementById(`ann-container-${idx}`);
              if (!container) return;

              const subtaskAnnotations = annotationsBySubtask[idx] || [];
              initAnnotationSystemForImage(img, container, submissionIdValue, isTeacher, subtaskAnnotations);
            });

            // 3. Применяем существующие выделения текста (из текстовых комментариев)
            if (textCommentsBySubtask) {
              Object.keys(textCommentsBySubtask).forEach((idx) => {
                const comments = textCommentsBySubtask[idx];
                const container = modalContent.querySelector(`.student-answer-container[data-subtask="${idx}"]`);
                if (container) {
                  const textEl = container.querySelector(".student-answer-text");
                  if (textEl) {
                    if (!textEl.dataset.originalText) {
                      textEl.dataset.originalText = textEl.textContent;
                    }
                    comments.forEach((c) => {
                      highlightText(textEl, c.selected_text);
                    });
                  }
                }
              });
            }

            // ===== ПОДСВЕТКА ГОЛОСОВЫХ КОММЕНТАРИЕВ =====
            if (voiceCommentsBySubtask) {
              Object.keys(voiceCommentsBySubtask).forEach((idx) => {
                const comments = voiceCommentsBySubtask[idx];
                const container = modalContent.querySelector(`.student-answer-container[data-subtask="${idx}"]`);
                if (container) {
                  const textEl = container.querySelector(".student-answer-text");
                  if (textEl) {
                    if (!textEl.dataset.originalText) {
                      textEl.dataset.originalText = textEl.textContent;
                    }
                    comments.forEach((vc) => {
                      if (vc.selected_text && vc.selected_text.trim()) {
                        highlightText(textEl, vc.selected_text);
                      }
                    });
                  }
                }
              });
            }
          }, 400);
        } catch (error) {
          console.error("❌ Ошибка в viewSubmission:", error);
          alert("Ошибка: " + error.message);
        }
      }

      function scrollToTextByContent(element, text, subtaskIndex) {
        const container = element.closest(".student-answer-container");
        if (!container) {
          // Если не нашли контейнер, ищем по подзаданию
          const modalContent = document.getElementById("modal-content");
          if (modalContent) {
            const foundContainer = modalContent.querySelector(
              `.student-answer-container[data-subtask="${subtaskIndex}"]`,
            );
            if (foundContainer) {
              const textEl = foundContainer.querySelector(".student-answer-text");
              if (textEl) {
                // Находим подсвеченный текст
                const highlights = textEl.querySelectorAll(".text-highlight");
                for (const hl of highlights) {
                  if (hl.dataset.originalText === text || hl.textContent.includes(text)) {
                    hl.scrollIntoView({ behavior: "smooth", block: "center" });
                    hl.style.boxShadow = "0 0 0 4px #667eea";
                    hl.style.background = "#ffd700";
                    setTimeout(() => {
                      hl.style.boxShadow = "none";
                      hl.style.background = "#ffeb3b";
                    }, 2000);
                    return;
                  }
                }
                // Если не нашли подсветку, подсвечиваем временно
                const fullText = textEl.dataset.originalText || textEl.textContent;
                const index = fullText.indexOf(text);
                if (index !== -1) {
                  textEl.innerHTML = fullText.replace(
                    text,
                    `<span style="background:#ffd700;padding:2px 4px;border-radius:2px;border-bottom:2px solid #667eea;">${text}</span>`,
                  );
                  setTimeout(() => {
                    if (textEl.dataset.originalText) {
                      textEl.innerHTML = textEl.dataset.originalText;
                      // Переприменяем подсветки
                      const comments = container.querySelectorAll(".comment-item");
                      comments.forEach((c) => {
                        highlightText(textEl, c.dataset.text);
                      });
                    }
                  }, 3000);
                }
              }
            }
          }
          return;
        }

        const textEl = container.querySelector(".student-answer-text");
        if (!textEl) return;

        // Ищем подсвеченный текст
        const highlights = textEl.querySelectorAll(".text-highlight");
        for (const hl of highlights) {
          if (hl.dataset.originalText === text || hl.textContent.includes(text)) {
            hl.scrollIntoView({ behavior: "smooth", block: "center" });
            hl.style.boxShadow = "0 0 0 4px #667eea";
            hl.style.background = "#ffd700";
            setTimeout(() => {
              hl.style.boxShadow = "none";
              hl.style.background = "#ffeb3b";
            }, 2000);
            return;
          }
        }
      }

      function getFullAudioPath(path) {
        if (!path) return "";

        // Если уже полный URL
        if (path.startsWith("http://") || path.startsWith("https://")) {
          return path;
        }

        // Нормализуем путь
        let normalized = path.replace(/\\/g, "/");

        // ===== УБИРАЕМ ДУБЛИРОВАНИЕ =====
        // Если путь содержит "uploadsaudio" (без слеша)
        if (normalized.includes("uploadsaudio")) {
          normalized = normalized.replace(/uploadsaudio/g, "uploads/audio/");
        }

        // Если путь содержит "uploads/audio/uploads/audio"
        if (normalized.includes("uploads/audio/uploads/audio")) {
          normalized = normalized.replace(/uploads\/audio\/uploads\/audio/g, "uploads/audio");
        }

        // Если путь уже начинается с uploads/audio/
        if (normalized.startsWith("uploads/audio/")) {
          return window.location.origin + "/" + normalized;
        }

        // Если путь начинается с audio/
        if (normalized.startsWith("audio/")) {
          return window.location.origin + "/uploads/" + normalized;
        }

        // Если путь начинается с uploads/
        if (normalized.startsWith("uploads/")) {
          return window.location.origin + "/" + normalized;
        }

        // Если путь просто имя файла
        return window.location.origin + "/uploads/audio/" + normalized;
      }

      function initAnnotationForImage(imgElement, wrapper, submissionId, isTeacher) {
        const idx = parseInt(wrapper.id.replace("student-image-wrapper-", ""));
        const container = document.getElementById(`ann-container-${idx}`);
        if (!container) {
          console.warn(`⚠️ Контейнер ann-container-${idx} не найден`);
          return;
        }

        // Получаем аннотации из глобальной переменной
        const annotations = window._studentAnnotations?.[idx] || [];
        

        // Вызываем основную функцию инициализации
        initAnnotationSystemForImage(imgElement, container, submissionId, isTeacher, annotations);
      }

      // ============================================================
      // RICH-TEXT ДЛЯ ЛИСТА — ЛОГИКА КАК В WORD
      // ============================================================

      // Получить текущий стиль (для ввода без выделения)
      function getSheetCurrentStyle(sheetObj) {
        if (!sheetObj) return null;
        if (!sheetObj._currentStyle) {
          sheetObj._currentStyle = {
            bold: false,
            italic: false,
            underline: false,
            strike: false,
            color: sheetObj.textColor || "#000000",
            size: sheetObj.textSize || 18,
            font: sheetObj.textFont || "Arial",
          };
        }
        return sheetObj._currentStyle;
      }

      // Получить стиль символа под курсором (слева от курсора, иначе справа)
      function getSheetStyleAtCursor(sheetObj) {
        const chars = flattenSegments(sheetObj.richText || []);
        const pos = sheetSelection.focus;

        // Символ слева
        if (pos > 0 && chars[pos - 1]) {
          return {
            bold: chars[pos - 1].bold,
            italic: chars[pos - 1].italic,
            underline: chars[pos - 1].underline,
            strike: chars[pos - 1].strike,
            color: chars[pos - 1].color,
            size: chars[pos - 1].size,
            font: chars[pos - 1].font,
          };
        }
        // Символ справа
        if (pos < chars.length && chars[pos]) {
          return {
            bold: chars[pos].bold,
            italic: chars[pos].italic,
            underline: chars[pos].underline,
            strike: chars[pos].strike,
            color: chars[pos].color,
            size: chars[pos].size,
            font: chars[pos].font,
          };
        }
        // Пусто — текущий стиль
        return { ...getSheetCurrentStyle(sheetObj) };
      }

      // Проверить: все ли символы в выделении имеют свойство = true
      function isSheetSelectionAll(sheetObj, prop) {
        const range = getSheetSelectionRange();
        if (range.start === range.end) return false;

        const chars = flattenSegments(sheetObj.richText || []);
        for (let i = range.start; i < range.end; i++) {
          if (!chars[i] || !chars[i][prop]) return false;
        }
        return true;
      }

      // Проверить: все ли символы в выделении имеют одинаковое значение свойства
      function getSheetSelectionValue(sheetObj, prop) {
        const range = getSheetSelectionRange();
        if (range.start === range.end) return null;

        const chars = flattenSegments(sheetObj.richText || []);
        if (range.start >= chars.length) return null;

        const first = chars[range.start][prop];
        for (let i = range.start + 1; i < range.end; i++) {
          if (chars[i] && chars[i][prop] !== first) return null; // разные значения
        }
        return first;
      }

      // Применить свойство к выделению ИЛИ к текущему стилю
      function applySheetStyle(sheetObj, prop, value) {
        if (!sheetObj) return;

        const range = getSheetSelectionRange();
        const chars = flattenSegments(sheetObj.richText || []);

        if (range.start === range.end) {
          // Нет выделения — меняем текущий стиль
          const style = getSheetCurrentStyle(sheetObj);
          style[prop] = value;
          // Синхронизируем с полями листа
          if (prop === "color") sheetObj.textColor = value;
          if (prop === "size") sheetObj.textSize = value;
          if (prop === "font") sheetObj.textFont = value;
          render();
          return;
        }

        // Есть выделение — применяем к символам
        for (let i = range.start; i < range.end; i++) {
          if (chars[i]) chars[i][prop] = value;
        }

        sheetObj.richText = charsToSegments(chars);
        sheetObj.text = segmentsToText(sheetObj.richText);
        autoExpandSheet(sheetObj);
        render();
        saveBoardHistory();
        saveBoardToServer();
      }

      // Переключить булево свойство (B/I/U) для выделения или текущего стиля
      function toggleSheetStyle(sheetObj, prop) {
        if (!sheetObj) return;

        const range = getSheetSelectionRange();

        if (range.start === range.end) {
          // Нет выделения — переключаем текущий стиль
          const style = getSheetCurrentStyle(sheetObj);
          style[prop] = !style[prop];
          render();
          updateSheetToolbarFromSelection();
          return;
        }

        // Есть выделение — проверяем, все ли уже с этим свойством
        const allSet = isSheetSelectionAll(sheetObj, prop);
        const newValue = !allSet;

        applySheetStyle(sheetObj, prop, newValue);
        updateSheetToolbarFromSelection();
      }

      function updateSheetToolbarFromSelection() {
        if (!editingSheet) return;

        const range = getSheetSelectionRange();
        const chars = flattenSegments(editingSheet.richText || []);
        let c;

        if (range.start === range.end) {
          c = getSheetStyleAtCursor(editingSheet);
        } else {
          c = chars[range.start] || getSheetCurrentStyle(editingSheet);
        }

        if (!c) c = getSheetCurrentStyle(editingSheet);

        document.getElementById("sheet-text-bold").classList.toggle("active", !!c.bold);
        document.getElementById("sheet-text-italic").classList.toggle("active", !!c.italic);
        document.getElementById("sheet-text-underline").classList.toggle("active", !!c.underline);

        const colorEl = document.getElementById("sheet-text-color");
        const sizeEl = document.getElementById("sheet-text-size");
        const fontEl = document.getElementById("sheet-text-font");

        if (document.activeElement !== colorEl) {
          colorEl.value = c.color || "#000000";
        }
        if (document.activeElement !== sizeEl) {
          if (range.start === range.end) {
            sizeEl.value = getSheetCurrentStyle(editingSheet).size || 18;
          } else {
            const sz = getSheetSelectionValue(editingSheet, "size");
            sizeEl.value = sz !== null ? sz : c.size || 18;
          }
        }
        if (document.activeElement !== fontEl) {
          if (range.start === range.end) {
            fontEl.value = getSheetCurrentStyle(editingSheet).font || "Arial";
          } else {
            const f = getSheetSelectionValue(editingSheet, "font");
            fontEl.value = f !== null ? f : c.font || "Arial";
          }
        }

      // ============================================================
      // СИСТЕМА АННОТАЦИЙ НА ФОТО УЧЕНИКА
      // ============================================================

      function renderStudentAnnotations(subtaskIndex, annotations) {
        const canvas = document.getElementById(`ann-canvas-${subtaskIndex}`);
        if (!canvas) {
          const canvases = document.querySelectorAll("canvas");
          for (const c of canvases) {
            if (c.id && c.id.includes("_canvas")) {
              for (const [id, data] of Object.entries(window._annotationInstances)) {
                if (data.canvas === c) {
                  drawAnnotationsForInstance(id);
                  return;
                }
              }
            }
          }
          return;
        }

        for (const [id, data] of Object.entries(window._annotationInstances)) {
          if (data.canvas === canvas) {
            data.annotations = annotations.map((a) => ({
              id: a.id,
              x: a.x || 0,
              y: a.y || 0,
              w: a.width || a.w || 20,
              h: a.height || a.h || 20,
              comment: a.comment || "",
              color: a.color || "#ff3b30",
            }));

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const wrapper = canvas.parentElement;
            if (!wrapper) return;

            const img = wrapper.querySelector("img");
            if (!img || !img.complete || img.naturalWidth === 0) return;

            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;
            const rect = img.getBoundingClientRect();
            const displayWidth = rect.width;
            const displayHeight = rect.height;
            const wrapperRect = wrapper.getBoundingClientRect();

            const scaleX = displayWidth / naturalWidth;
            const scaleY = displayHeight / naturalHeight;
            const offsetX = (wrapperRect.width - displayWidth) / 2;
            const offsetY = (wrapperRect.height - displayHeight) / 2;

            data.annotations.forEach((ann, index) => {
              const x = ann.x * scaleX + offsetX;
              const y = ann.y * scaleY + offsetY;
              const w = ann.w * scaleX;
              const h = ann.h * scaleY;

              ctx.save();
              ctx.fillStyle = (ann.color || "#ff3b30") + "30";
              ctx.fillRect(x, y, w, h);
              ctx.strokeStyle = ann.color || "#ff3b30";
              ctx.lineWidth = 2.5;
              ctx.strokeRect(x, y, w, h);

              ctx.fillStyle = ann.color || "#ff3b30";
              const fontSize = Math.max(10, 14 * Math.min(scaleX, scaleY));
              ctx.font = `bold ${fontSize}px Arial`;
              ctx.textAlign = "left";
              ctx.textBaseline = "top";
              ctx.fillText("#" + (index + 1), x + 4, y + 4);
              ctx.restore();
            });

            const container = data.commentsContainer;
            if (container) {
              const listEl = container.querySelector(".ann-list");
              if (listEl) {
                if (data.annotations.length === 0) {
                  listEl.innerHTML = `<div style="color:#999;font-size:12px;text-align:center;padding:10px 0;">Нет комментариев</div>`;
                } else {
                  listEl.innerHTML = data.annotations
                    .map(
                      (ann, index) => `
                            <div style="padding:4px 8px;border-left:3px solid ${ann.color || "#ff3b30"};margin-bottom:3px;background:white;border-radius:3px;cursor:pointer;font-size:12px;transition:background 0.2s;display:flex;justify-content:space-between;align-items:center;"
                                 onmouseover="this.style.background='#e8f0fe'"
                                 onmouseout="this.style.background='white'"
                                 onclick="highlightAnnotation('${id}', ${index})">
                                <span>#${index + 1} ${ann.comment}</span>
                            </div>
                        `,
                    )
                    .join("");
                }
              }
            }
            return;
          }
        }
      }

      // ============================================================

      // ============================================================
      function addGlobalKeyListeners() {
        if (_globalListenersAdded) return;
        _globalListenersAdded = true;

        document.addEventListener("keydown", function (e) {
          if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
          const ctrl = e.ctrlKey || e.metaKey;
          if (ctrl && (e.key === "c" || e.key === "с")) {
            e.preventDefault();
            copySelected();
            return;
          }
          if (ctrl && (e.key === "z" || e.key === "я") && !e.shiftKey) {
            e.preventDefault();
            undo();
            return;
          }
          if (ctrl && e.shiftKey && (e.key === "z" || e.key === "я")) {
            e.preventDefault();
            redo();
            return;
          }
          if (e.key === "Delete" || e.key === "Backspace") {
            e.preventDefault();
            deleteSelected();
            return;
          }
          if (e.key === " " && !ctrl) {
            e.preventDefault();
            document.getElementById("btn-pan").click();
            return;
          }
          if ((e.key === "v" || e.key === "V") && !ctrl) {
            e.preventDefault();
            document.getElementById("btn-select").click();
            return;
          }
          if (ctrl && (e.key === "v" || e.key === "м")) {
            // НЕ перехватываем — пусть сработает событие 'paste'
            // Если есть что вставить из внутреннего буфера — вставим вручную
            if (clipboard.length > 0) {
              e.preventDefault();
              pasteObjects();
            }
            // Иначе не мешаем — сработает обработчик 'paste'
            return;
          }
          if (e.key === "Escape") {
            selected = [];
            requestRender();
            return;
          }
        });
      }

      async function handleGlobalPaste() {
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const imageTypes = item.types.filter((t) => t.startsWith("image/"));
            if (imageTypes.length > 0) {
              const blob = await item.getType(imageTypes[0]);
              const reader = new FileReader();
              reader.onload = function (event) {
                insertImageFromDataUrl(event.target.result);
              };
              reader.readAsDataURL(blob);
              return;
            }
            if (item.types.includes("text/plain")) {
              const blob = await item.getType("text/plain");
              const text = await blob.text();
              if (text && text.trim().length > 0) {
                insertTextOnBoard(text.trim());
                return;
              }
            }
          }
        } catch (e) {
          
        }
      }

      function pasteObjects() {
        if (clipboard.length === 0) {
          showHint("Буфер обмена пуст");
          return;
        }
        const newIds = [];
        clipboard.forEach((obj) => {
          if (obj.type === "coords") return;
          const newObj = JSON.parse(JSON.stringify(obj));
          newObj.id = nextId++;
          const offsetX = 30,
            offsetY = 30;
          if (newObj.type === "text" || newObj.type === "image") {
            newObj.x += offsetX;
            newObj.y += offsetY;
          } else if (
            newObj.type === "segment" ||
            newObj.type === "ray" ||
            newObj.type === "line" ||
            newObj.type !== "free-line"
          ) {
            newObj.x1 += offsetX;
            newObj.y1 += offsetY;
            newObj.x2 += offsetX;
            newObj.y2 += offsetY;
          } else if (newObj.type === "free-line" && newObj.points) {
            newObj.points.forEach((p) => {
              p.x += offsetX;
              p.y += offsetY;
            });
          }
          objects.push(newObj);
          newIds.push(newObj.id);
        });
        selected = newIds;
        saveBoardHistory();
        requestRender();
        showHint(`Вставлено: ${newIds.length} объектов`);
        saveBoardToServer();
      }

      function deleteSelected() {
        if (selected.length === 0) return;
        const ids = new Set(selected);
        for (let i = objects.length - 1; i >= 0; i--) {

        }
        selected = [];
        saveBoardHistory();
        requestRender();
        showHint("🗑️ Удалено");
        saveBoardToServer();
      }

      function hitTestSheetText(worldX, worldY, sheetObj) {
        const layoutInfo = getSheetTextLayout(sheetObj);
        const { lines, textLeft, textTop, lineYs, lineHeights, lineToFlatStart } = layoutInfo;

        if (!lines || lines.length === 0) return 0;

        const localX = worldX - textLeft;
        const localY = worldY - textTop;

        if (localY < 0) return 0;

        // Находим строку по Y
        let lineIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (localY >= lineYs[i] && localY < lineYs[i] + lineHeights[i]) {
            lineIdx = i;
            break;
          }
        }

        if (lineIdx === -1) {
          // Клик ниже текста
          const chars = flattenSegments(sheetObj.richText);
          return chars.length;
        }

        const lineInfo = lines[lineIdx];
        const lineLocalX = localX - lineInfo.startX;

        const startFlat = lineToFlatStart[lineIdx] !== undefined ? lineToFlatStart[lineIdx] : 0;

        if (lineLocalX < 0) {
          return startFlat;
        }

        const measureCanvas = document.createElement("canvas");
        const measureCtx = measureCanvas.getContext("2d");

        let xCursor = 0;
        let charInLine = 0;
        for (const c of lineInfo.line) {
          measureCtx.font = buildFont(c, 1);
          const charW = measureCtx.measureText(c.char).width;
          if (lineLocalX < xCursor + charW / 2) break;
          xCursor += charW;
          charInLine++;
        }

        return startFlat + charInLine;
      }

      function countCharsBeforeLine(lines, lineIdx) {
        let total = 0;
        for (let i = 0; i < lineIdx; i++) {
          lines[i].line.forEach(() => total++);
          total++; // \n между строками
        }
        return total;
      }

      // ============================================================
      // ПОЗИЦИЯ КУРСОРА В ВИЗУАЛЬНЫХ СТРОКАХ (с учётом переноса)
      // ============================================================
      // lines — массив { line: [символы], startX, width }
      // focus — индекс в ПЛОСКОМ массиве chars (с \n)
      // Возвращаем: { lineIdx, x, charInLine } — где x в МИРОВЫХ координатах

      function getCursorPositionInLines(lines, focus) {
        // Строим карту: для каждого символа (по индексу) — его строка и X
        const measureCanvas = document.createElement("canvas");
        const measureCtx = measureCanvas.getContext("2d");

        let flatIdx = 0;

        for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
          const lineInfo = lines[lineIdx];
          let xInLine = lineInfo.startX;

          for (let i = 0; i < lineInfo.line.length; i++) {
            if (flatIdx === focus) {
              return { lineIdx, x: xInLine, charInLine: i };
            }
            const c = lineInfo.line[i];
            measureCtx.font = buildFont(c, 1);
            xInLine += measureCtx.measureText(c.char).width;
            flatIdx++;
          }

          // Конец строки
          if (flatIdx === focus) {
            return { lineIdx, x: xInLine, charInLine: lineInfo.line.length };
          }

          // Переход на новую строку — это \n, увеличиваем счётчик
          // НО: \n есть только в конце логической строки, а не визуальной.
          // Поэтому считаем \n только если следующая строка начинается с нового логического абзаца.
          // Упрощение: сравниваем длину lineInfo.line с реальным количеством символов
          // до следующего \n в flat-массиве. Но у нас нет flat-массива здесь.
          //
          // ВМЕСТО ЭТОГО: используем тот факт, что wrapRichTextLines уже разбил
          // по \n, а потом по ширине. Значит, между lineIdx и lineIdx+1 может
          // быть \n (если это был абзац) или ничего (если это был перенос).
          //
          // Мы не можем это определить из lines. Поэтому эта функция НЕ МОЖЕТ
          // корректно работать с focus. Нужен flat-массив.

          // Решение: передавать flatChars вместо lines.
          flatIdx++; // предполагаем, что между строками всегда \n
        }

        // Конец текста
        const lastLine = lines[lines.length - 1];
        if (!lastLine) return { lineIdx: 0, x: 0, charInLine: 0 };

        let lastX = lastLine.startX;
        lastLine.line.forEach((c) => {
          measureCtx.font = buildFont(c, 1);
          lastX += measureCtx.measureText(c.char).width;
        });
        return { lineIdx: lines.length - 1, x: lastX, charInLine: lastLine.line.length };
      }
      // По X (мировые координаты) найти индекс символа в строке
      function findCharInLineByX(lineInfo, targetX, sheetObj) {
        const localX = targetX - lineInfo.startX;
        if (localX <= 0) return 0;

        const measureCanvas = document.createElement("canvas");
        const measureCtx = measureCanvas.getContext("2d");

        let xCursor = 0;
        for (let i = 0; i < lineInfo.line.length; i++) {
          const c = lineInfo.line[i];
          measureCtx.font = buildFont(c, 1);
          const charW = measureCtx.measureText(c.char).width;
          if (localX < xCursor + charW / 2) return i;
          xCursor += charW;
        }

        return lineInfo.line.length;
      }

      addGlobalKeyListeners();

      let activeTouchId = null;
      let touchMoved = false;
      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      function initAllEventListeners() {
        if (!canvas) return;

        // ЕДИНЫЙ СЛОЙ TOUCH → MOUSE + PINCH-TO-ZOOM (ИСПРАВЛЕННЫЙ)
        // ============================================================
        (function enableTouchSupport() {
          if (!canvas) return;

          function makeMouseEvent(type, touch, extra = {}) {
            return new MouseEvent(type, {
              bubbles: true,
              cancelable: true,
              view: window,
              clientX: touch.clientX,
              clientY: touch.clientY,
              screenX: touch.screenX,
              screenY: touch.screenY,
              button: 0,
              buttons: type === "mouseup" ? 0 : 1,
              ...extra,
            });
          }

          let pinchStartDist = 0;
          let pinchStartZoom = 1;
          let pinchCenter = { x: 0, y: 0 };
          let pinchStartCamera = { x: 0, y: 0 };
          let isMultiTouch = false;

          canvas.addEventListener(
            "touchstart",
            function (e) {
              

              // ===== ДВА ПАЛЬЦА: PINCH-TO-ZOOM =====
              if (e.touches.length === 2) {
                e.preventDefault();
                e.stopPropagation();
                isMultiTouch = true;
                activeTouchId = null;

                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchStartDist = Math.sqrt(dx * dx + dy * dy);
                pinchStartZoom = zoom;
                pinchStartCamera = { x: camera.x, y: camera.y };

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                pinchCenter = {
                  x: ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left) * scaleX,
                  y: ((e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top) * scaleY,
                };

                // Сбрасываем активные режимы
                isDrawing = false;
                isSelecting = false;
                isDraggingGroup = false;
                isPanning = false;
                if (shapeStart) {
                  shapeStart = null;
                  shapeEnd = null;
                }
                render();
                return;
              }

              // ===== ОДИН ПАЛЕЦ: КАК МЫШЬ =====
              if (e.touches.length === 1 && !isMultiTouch) {
                const touch = e.touches[0];
                activeTouchId = touch.identifier;
                touchMoved = false;

                // ВАЖНО: сначала устанавливаем activeTouchId, потом dispatch
                canvas.dispatchEvent(makeMouseEvent("mousedown", touch));

                // Двойной тап
                const now = Date.now();
                const dx = touch.clientX - lastTapX;
                const dy = touch.clientY - lastTapY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (now - lastTapTime < 300 && dist < 30) {
                  canvas.dispatchEvent(makeMouseEvent("dblclick", touch));
                  lastTapTime = 0;
                } else {
                  lastTapTime = now;
                }
                lastTapX = touch.clientX;
                lastTapY = touch.clientY;
              }
            },
            { passive: false },
          );

          canvas.addEventListener(
            "touchmove",
            function (e) {
              // ===== ДВА ПАЛЬЦА: PINCH =====
              if (e.touches.length === 2 && pinchStartDist > 0) {
                e.preventDefault();
                e.stopPropagation();

                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const factor = dist / pinchStartDist;
                const newZoom = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, pinchStartZoom * factor));

                const worldX = pinchCenter.x / pinchStartZoom + pinchStartCamera.x;
                const worldY = pinchCenter.y / pinchStartZoom + pinchStartCamera.y;

                zoom = newZoom;
                camera.x = worldX - pinchCenter.x / zoom;
                camera.y = worldY - pinchCenter.y / zoom;

                const zd = document.getElementById("zoom-display");
                if (zd) zd.textContent = Math.round(zoom * 100) + "%";
                requestRender();
                return;
              }

              // ===== ОДИН ПАЛЕЦ =====
              if (e.touches.length === 1) {
                const touch = e.touches[0];
                if (touch.identifier !== activeTouchId) return;

                touchMoved = true;
                e.preventDefault(); // ВАЖНО: предотвращаем скролл
                canvas.dispatchEvent(makeMouseEvent("mousemove", touch));
              }
            },
            { passive: false },
          );

          canvas.addEventListener(
            "touchend",
            function (e) {
              // Если был мультитач — просто сбрасываем
              if (isMultiTouch) {
                if (e.touches.length < 2) {
                  pinchStartDist = 0;
                  isMultiTouch = false;
                }
                // НЕ возвращаемся сразу — нужно завершить возможные операции
                if (e.touches.length === 0) {
                  activeTouchId = null;
                  touchMoved = false;
                }
                return;
              }

              if (activeTouchId === null) return;

              // Ищем завершённый палец
              let ended = null;
              for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                  ended = e.changedTouches[i];
                  break;
                }
              }
              if (!ended) return;

              // ВАЖНО: НЕ сбрасываем activeTouchId до dispatch!
              canvas.dispatchEvent(makeMouseEvent("mouseup", ended));

              // Если это был тап (не свайп) — генерируем click
              if (!touchMoved) {
                canvas.dispatchEvent(makeMouseEvent("click", ended));
              }

              activeTouchId = null;
              touchMoved = false;
            },
            { passive: false },
          );

          canvas.addEventListener(
            "touchcancel",
            function (e) {
              // Принудительно завершаем все активные режимы
              if (isDrawing) {
                isDrawing = false;
                drawPoints = [];
                currentDrawObj = null;
              }
              if (isSelecting) {
                isSelecting = false;
                const box = document.getElementById("selection-box");
                if (box) box.style.display = "none";
              }
              if (isResizing) {
                isResizing = false;
                window._resizeStartState = null;
              }
              if (isDraggingGroup) {
                isDraggingGroup = false;
                groupBasePositions = [];
              }
              if (shapeStart) {
                shapeStart = null;
                shapeEnd = null;
              }
              if (isPanning) {
                isPanning = false;
                canvas.style.cursor = mode === "pan" ? "grab" : "default";
              }
              isErasing = false;
              eraserCooldown = false;
              activeTouchId = null;
              touchMoved = false;
              isMultiTouch = false;
              pinchStartDist = 0;
              render();
            },
            { passive: false },
          );

          // Запрет контекстного меню (долгое нажатие)
          canvas.addEventListener("contextmenu", function (e) {
            e.preventDefault();
          });
        })();

        // ============================================================
        // КНОПКА "ДОСКИ" - ОТКРЫВАЕТ СПИСОК ДОСОК

        document.getElementById("boards-menu-btn").addEventListener("click", function (e) {

          const btn = this;

          try {
            // Сначала пробуем вставить из внутреннего буфера (скопированное на доске)
            if (clipboard.length > 0) {
              pasteObjects();
              btn.innerHTML = "✅";

              setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.color = "";
                btn.disabled = false;
              }, 1500);
              return;
            }

            // Если внутренний буфер пуст — пробуем из глобального буфера
            const items = await navigator.clipboard.read();
            let found = false;

            for (const item of items) {
              const imageTypes = item.types.filter((t) => t.startsWith("image/"));

              if (imageTypes.length > 0) {
                const blob = await item.getType(imageTypes[0]);
                const reader = new FileReader();
                reader.onload = function (event) {
                  insertImageFromDataUrl(event.target.result);
                  btn.innerHTML = "✅";
                  btn.style.color = "#34c759";
                  setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.color = "";
                    btn.disabled = false;
                  }, 1500);
                };
                reader.readAsDataURL(blob);
                found = true;
                break;
              }

              if (item.types.includes("text/plain")) {
                const blob = await item.getType("text/plain");
                const text = await blob.text();
                if (text && text.trim().length > 0) {
                  insertTextOnBoard(text.trim());
                  found = true;
                  btn.innerHTML = "✅";
                  btn.style.color = "#34c759";
                  setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.color = "";
                    btn.disabled = false;
                  }, 1500);
                  break;

              }
            }

            if (!found) {

              btn.style.color = "#e53e3e";
              setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.color = "";
                btn.disabled = false;

              showHint("❌ Нет данных для вставки");

            isPanning = true;
            panStartX = (e.clientX - rect.left) * scaleX;
            panStartY = (e.clientY - rect.top) * scaleY;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;

            let dx = currentX - panStartX;
            let dy = currentY - panStartY;

            const worldDx = dx / zoom;
            const worldDy = dy / zoom;

            camera.x = panStartCamX - worldDx;

            if (coords.x >= minX && coords.x <= maxX && coords.y >= minY && coords.y <= maxY) {

              sheetSelection.anchor = idx;

              updateSheetToolbarFromSelection();

            e.preventDefault();

          }

          // ===== ОБЫЧНЫЙ РЕЖИМ =====
          focusTarget = "canvas";

          if (mode === "pan") return;

          if (e.button === 2) return;

          if (mode === "pan") return;
          e.preventDefault();
          if (e.button === 2) return;

          // ===== ПРОВЕРКА: попал ли клик в маркер ресайза =====
          if (mode === "select" && selected.length > 0) {
            const handleHit = checkResizeHandleHit(e);
            if (handleHit) {
              e.stopPropagation();
              e.preventDefault();

              isResizing = true;
              resizeHandle = handleHit;
              resizeStart = { x: coords.x, y: coords.y };

              // ===== ЗАПОМИНАЕМ СОСТОЯНИЕ ВСЕХ ВЫДЕЛЕННЫХ ОБЪЕКТОВ =====
              window._resizeStartState = selected
                .map((id) => {
                  const obj = objects.find((o) => o.id === id);
                  if (!obj) return null;
                  const state = { id: obj.id, type: obj.type };
                  if (obj.type === "text") {
                    state.size = obj.size;
                    state.x = obj.x;
                    state.y = obj.y;
                  } else if (obj.type === "image") {
                    state.x = obj.x;
                    state.y = obj.y;
                    state.width = obj.width;
                    state.height = obj.height;
                  } else if (obj.type === "free-line" && obj.points) {
                    state.points = obj.points.map((p) => ({ x: p.x, y: p.y }));
                  } else if (obj.type === "coords" || obj.type === "sheet") {
                    state.x1 = obj.x1;
                    state.y1 = obj.y1;
                    state.x2 = obj.x2;
                    state.y2 = obj.y2;
                  } else {
                    state.x1 = obj.x1;
                    state.y1 = obj.y1;
                    state.x2 = obj.x2;
                    state.y2 = obj.y2;
                  }
                  return state;
                })
                .filter((s) => s !== null);

              canvas.style.cursor = "grabbing";
              return;
            }
          }

          if (mode === "select") {
            const found = findObjectAt(coords.x, coords.y);

            if (found) {

              render();
              isSelecting = true;
              selectionStart = { x: coords.x, y: coords.y };
              selectionEnd = { x: coords.x, y: coords.y };

            }

            isSelecting = true;
            selectionStart = { x: coords.x, y: coords.y };
            selectionEnd = { x: coords.x, y: coords.y };
            return;
          }

          if (mode === "draw") {
            isDrawing = true;
            drawPoints = [{ x: coords.x, y: coords.y }];
            currentDrawObj = {
              id: nextId++,
              type: "free-line",
              points: [...drawPoints],
              color: currentColor,
              thickness: currentThickness,
              dash: [],

            };
            objects.push(currentDrawObj);

            // ===== WEBSOCKET: начало линии =====
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(

                    objId: currentDrawObj.id,

                    color: currentDrawObj.color,
                    thickness: currentDrawObj.thickness,
                    isStart: true,
                  },
                }),
              );

            return;
          }

          if (mode === "eraser") {
            if (isErasing) return;
            isErasing = true;
            eraserCooldown = false;
            eraseAt(coords);

          }

          const shape = SHAPE_LIST.find((s) => s.id === mode);
          if (mode === "segment" || mode === "ray" || mode === "line" || shape || mode === "sheet") {
            shapeStart = { x: coords.x, y: coords.y };
            shapeEnd = { x: coords.x, y: coords.y };

          if (mode === "text") {

            // ===== СОЗДАЁМ ТЕКСТ БЕЗ ПРИВЯЗКИ К ЛИСТУ =====

        panStartCamY = 0;

      // ============================================================
      // WEBSOCKET ДЛЯ РЕАЛЬНОГО ВРЕМЕНИ
      // ============================================================
      let ws = null;
      let wsReconnectTimer = null;

      function initWebSocket() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          return;
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}`;
        

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          
          joinWsRoom();
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleWsMessage(msg);
          } catch (e) {
            console.error("❌ Ошибка парсинга WS:", e);
          }
        };

        ws.onclose = () => {
          
          clearTimeout(wsReconnectTimer);
          wsReconnectTimer = setTimeout(initWebSocket, 3000);
        };

        ws.onerror = (err) => {
          console.error("❌ WebSocket ошибка:", err);
        };
      }

      function joinWsRoom() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const boardId = getBoardId();
        const userId = currentUser?.id || "anon";
        const role = currentUser?.role || "student";

        ws.send(
          JSON.stringify({
            type: "join",
            roomId: boardId,
            userId: userId,
            role: role,
          }),
        );

        
      }

      function handleWsMessage(msg) {
        switch (msg.type) {
          case "draw":
            // Кто-то рисует линию в реальном времени
            handleRemoteDraw(msg);
            break;

          case "sync":
            // Кто-то прислал полное состояние доски
            if (msg.data && msg.data.objects) {
              objects = msg.data.objects;
              requestRender();
              
            }
            break;

          case "sync_request":
            // Кто-то просит текущее состояние — отправляем своё
            sendFullSync();
            break;

          case "undo":
          case "redo":
            // Кто-то отменил/повторил действие
            if (msg.data) {
              objects = msg.data;
              requestRender();
            }
            break;

          case "clear":
            objects = [];
            requestRender();
            break;
        }
      }

      // Обработка чужого рисования
      const remoteDrawBuffers = {}; // { objId: { points: [...], color, thickness } }

      function handleRemoteDraw(msg) {
        const data = msg.data;
        if (!data) return;

        const { objId, point, color, thickness, isStart, isEnd } = data;

        // ===== КОНЕЦ ЛИНИИ — НЕ ДОБАВЛЯЕМ ТОЧКУ =====
        if (isEnd) {
          delete remoteDrawBuffers[objId];
          return;
        }

        // ===== НАЧАЛО НОВОЙ ЛИНИИ =====
        if (isStart) {
          remoteDrawBuffers[objId] = {
            points: [point],
            color: color || "#000",
            thickness: thickness || 2,
            userId: msg.userId,
          };
          const exists = objects.find((o) => o.id === objId);
          if (!exists) {
            objects.push({
              id: objId,
              type: "free-line",
              points: [...remoteDrawBuffers[objId].points],
              color: remoteDrawBuffers[objId].color,
              thickness: remoteDrawBuffers[objId].thickness,
              userId: msg.userId,
            });
          }
          requestRender();
          return;
        }

        // ===== ПРОДОЛЖЕНИЕ ЛИНИИ =====
        if (remoteDrawBuffers[objId] && point) {
          remoteDrawBuffers[objId].points.push(point);
          const obj = objects.find((o) => o.id === objId);
          if (obj) {
            obj.points = [...remoteDrawBuffers[objId].points];
          }
          requestRender();
        }
      }

      // Отправить полное состояние доски всем
      function sendFullSync() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(
          JSON.stringify({
            type: "sync",
            data: { objects: objects },
          }),
        );
      }

      // Отправить одно изменение (новый объект, удаление и т.д.)
      function sendFullBoardUpdate() {
        sendFullSync();
      }

      // ============================================================
      // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
      // ============================================================

      // ============================================================
      // РАЗМЕР CANVAS
      // ============================================================
      function resizeCanvas() {
        if (!canvas) return;
        const container = canvas.parentElement;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const w = rect.width || window.innerWidth;
        const h = rect.height || window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        if (ctx) {
          // Масштабирование для сохранения пропорций
          ctx.setTransform(1, 0, 0, 1, 0, 0);
        }
        requestRender();
      }

      function getFullImagePath(path) {
        if (!path) return "";

        // Если путь уже полный URL
        if (path.startsWith("http://") || path.startsWith("https://")) {
          return path;
        }

        // Нормализуем путь
        let normalized = path.replace(/\\/g, "/");
        let fileName = normalized.split("/").pop();

        // Очищаем от спецсимволов, НО сохраняем расширение
        let cleanName = fileName.replace(/[^a-zA-Z0-9._-]/g, "");

        // ===== СОХРАНЯЕМ ЛЮБОЕ РАСШИРЕНИЕ =====
        let ext = "";
        let baseName = cleanName;
        if (cleanName.includes(".")) {
          const parts = cleanName.split(".");
          ext = parts.pop().toLowerCase(); // берём последнюю часть как расширение
          baseName = parts.join(".");
        }

        // Если расширение есть - используем его, иначе ставим jpg
        const fileExt = ext || "jpg";

        
        
        
        

        // ===== ПРОВЕРКА: файл из assignments (q-...) =====
        const assignmentMatch = cleanName.match(/^(q-\d+-\d+)/);
        if (assignmentMatch) {
          const result = window.location.origin + "/uploads/assignments/" + assignmentMatch[1] + "." + fileExt;
          
          return result;
        }

        // ===== ПРОВЕРКА: файл из submissions (цифры-дефис-цифры) =====
        const submissionMatch = cleanName.match(/^(\d+-\d+)/);
        if (submissionMatch) {
          const result = window.location.origin + "/uploads/submissions/" + submissionMatch[1] + "." + fileExt;
          
          return result;
        }

        // ===== ЕСЛИ ИМЯ НАЧИНАЕТСЯ С ПРЕФИКСА - СОХРАНЯЕМ ЕГО =====
        if (cleanName.startsWith("submissions")) {
          const result = window.location.origin + "/uploads/" + cleanName;
          
          return result;
        }
        if (cleanName.startsWith("uploads")) {
          // Если имя начинается с "uploadsassignments" - это файл из assignments
          if (cleanName.includes("assignments")) {
            const qMatch = cleanName.match(/(q-\d+-\d+)/);
            if (qMatch) {
              const result = window.location.origin + "/uploads/assignments/" + qMatch[1] + "." + fileExt;
              
              return result;
            }
          }
          // Если имя начинается с "uploadssubmissions" - это файл из submissions
          if (cleanName.includes("submissions")) {
            const numMatch = cleanName.match(/(\d+-\d+)/);
            if (numMatch) {
              const result = window.location.origin + "/uploads/submissions/" + numMatch[1] + "." + fileExt;
              
              return result;
            }
          }
          const result = window.location.origin + "/" + cleanName;
          
          return result;
        }

        // ===== ПОСЛЕДНЯЯ ПОПЫТКА: ищем паттерны в середине =====
        const qMatch = baseName.match(/(q-\d+-\d+)/);
        if (qMatch) {
          const result = window.location.origin + "/uploads/assignments/" + qMatch[1] + "." + fileExt;
          
          return result;
        }

        const numMatch = baseName.match(/(\d+-\d+)/);
        if (numMatch) {
          const result = window.location.origin + "/uploads/submissions/" + numMatch[1] + "." + fileExt;
          
          return result;
        }

        // ===== ПОСЛЕДНИЙ ВАРИАНТ =====
        const result = window.location.origin + "/uploads/submissions/" + cleanName;
        
        return result;
      }

      function getCurrentUserId() {
        if (currentUser && currentUser.id) return currentUser.id;
        if (!window._tempUserId)
          window._tempUserId = "temp_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
        return window._tempUserId;
      }

      function showStatus(text) {
        const el = document.getElementById("status");
        if (!el) return;
        el.textContent = text;
        el.style.display = "block";
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => (el.style.display = "none"), 1500);
      }

      function showHint(text) {
        const el = document.getElementById("copy-hint");
        if (!el) return;
        el.textContent = text;
        el.classList.add("show");
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => el.classList.remove("show"), 1500);
      }

      function getCoords(e) {
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;

        // Для touch: ищем нужный палец
        if (activeTouchId !== null && (e.changedTouches || e.touches)) {
          const list = e.changedTouches || e.touches || [];
          for (let i = 0; i < list.length; i++) {
            if (list[i].identifier === activeTouchId) {
              clientX = list[i].clientX;
              clientY = list[i].clientY;
              break;
            }
          }
        }

        // Fallback
        if (clientX === undefined) {
          if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }
        }

        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: ((clientX - rect.left) * scaleX) / zoom + camera.x,
          y: ((clientY - rect.top) * scaleY) / zoom + camera.y,
        };
      }

      function worldToScreen(wx, wy) {
        return { x: (wx - camera.x) * zoom, y: (wy - camera.y) * zoom };
      }

      function screenToWorld(sx, sy) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: sx / (scaleX * zoom) + camera.x,
          y: sy / (scaleY * zoom) + camera.y,
        };
      }

      // ============================================================
      // ГОЛОСОВЫЕ КОММЕНТАРИИ
      // ============================================================

      // Глобальные переменные для записи
      let mediaRecorder = null;
      let audioChunks = [];
      let isRecording = false;
      let recordingStartTime = 0;
      let recordingTimer = null;

      function highlightText(element, textToHighlight) {
        if (!element) return;
        const text = textToHighlight.trim();
        if (!text) return;

        let clean = element.dataset.clean;
        if (!clean) {
          clean = element.textContent.replace(/\s+/g, " ").trim();
          element.dataset.clean = clean;
        }

        const spans = element.querySelectorAll(".text-highlight");
        for (const s of spans) {
          if (s.textContent.trim() === text) return;
        }

        const pos = clean.toLowerCase().indexOf(text.toLowerCase());
        if (pos === -1) {
          
          return;
        }

        if (spans.length > 0) {
          const allTexts = [];
          for (const s of spans) {
            allTexts.push(s.textContent.trim());
          }
          allTexts.push(text);
          allTexts.sort((a, b) => b.length - a.length);

          let html = clean;
          for (const t of allTexts) {
            const idx2 = html.toLowerCase().indexOf(t.toLowerCase());
            if (idx2 !== -1) {
              const before2 = html.substring(0, idx2);
              const found2 = html.substring(idx2, idx2 + t.length);
              const after2 = html.substring(idx2 + t.length);
              html =
                before2 +
                `<span class="text-highlight" style="background:#ffeb3b;padding:2px 4px;border-radius:2px;border-bottom:2px solid #667eea;">${found2}</span>` +
                after2;
            }
          }
          element.innerHTML = html;
          return;
        }

        const before = clean.substring(0, pos);
        const found = clean.substring(pos, pos + text.length);
        const after = clean.substring(pos + text.length);

        element.innerHTML =
          before +
          `<span class="text-highlight" style="background:#ffeb3b;padding:2px 4px;border-radius:2px;border-bottom:2px solid #667eea;">${found}</span>` +
          after;
      }

      function getDashPattern(thickness, zoom) {
        const base = Math.max(thickness, 2);
        return [base * 2.5 * zoom, base * 1.5 * zoom];
      }

      // Вспомогательная функция для экранирования HTML
      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function loadVoiceComments(submissionId, subtaskIndex, container) {
        try {
          const response = await fetch(`/api/voice-comments/${submissionId}`, {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          });

          if (!response.ok) return;

          const allComments = await response.json();
          const comments = allComments.filter((c) => c.subtask_index === subtaskIndex);

          let voiceContainer = container.querySelector(".voice-comments-container");
          if (!voiceContainer) {
            voiceContainer = document.createElement("div");
            voiceContainer.className = "voice-comments-container";
            voiceContainer.style.cssText = "margin-top:8px;";
            container.appendChild(voiceContainer);
          }

          const isTeacher = currentUser?.role === "teacher";

          // ПОКАЗЫВАЕМ КОММЕНТАРИИ ВСЕМ (и ученику, и учителю)
          if (comments.length === 0) {
            voiceContainer.style.display = "none";
            return;
          }

          voiceContainer.style.display = "block";

          // Рендерим список комментариев
          voiceContainer.innerHTML = `
            <div style="font-size:12px;color:#8e44ad;font-weight:600;margin-bottom:6px;">
                🎙️ Голосовые комментарии учителя (${comments.length}):
            </div>
            ${comments
              .map(
                (vc) => `
                <div class="voice-comment" data-voice-id="${vc.id}" style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f0f4ff;border-radius:8px;margin-bottom:4px;border-left:3px solid #8e44ad;">
                    ${
                      vc.selected_text
                        ? `
                        <span style="background:#ffeb3b;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;flex-shrink:0;cursor:pointer;" 
                              onclick="alert('Комментарий к тексту: \\"${escapeHtml(vc.selected_text)}\\"')">
                            "${escapeHtml(vc.selected_text.substring(0, 25))}${vc.selected_text.length > 25 ? "..." : ""}"
                        </span>
                    `
                        : ""
                    }
                    <button class="play-btn" onclick="toggleVoicePlayback(this, '${vc.audio_path || vc.audio_url}')" 
                            style="width:30px;height:30px;border-radius:50%;border:none;background:#8e44ad;color:white;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        ▶
                    </button>
                    <div class="voice-timeline" onclick="seekVoice(this, event)" 
                         style="flex:1;height:4px;background:#ddd;border-radius:2px;cursor:pointer;position:relative;min-width:60px;">
                        <div class="progress" style="height:100%;background:#8e44ad;border-radius:2px;width:0%;"></div>
                    </div>
                    <span class="voice-duration" style="font-size:11px;color:#999;min-width:35px;">${formatDuration(vc.duration || 0)}</span>
                    ${
                      isTeacher
                        ? `
                        <button class="voice-delete" onclick="deleteVoiceComment(${vc.id}, ${submissionId}, ${subtaskIndex}, this)" 
                                style="background:none;border:none;color:#999;cursor:pointer;font-size:14px;padding:0 4px;" title="Удалить комментарий">✕</button>
                    `
                        : ""
                    }
                </div>
            `,
              )
              .join("")}
        `;

          // ===== ПОДСВЕЧИВАЕМ ТЕКСТ (ДЛЯ ВСЕХ) =====
          const textEl = container.querySelector(".student-answer-text");
          if (textEl) {
            

            // Сохраняем оригинальный текст
            if (!textEl.dataset.originalText) {
              const tempDiv = document.createElement("div");
              tempDiv.innerHTML = textEl.innerHTML;
              textEl.dataset.originalText = tempDiv.textContent;
            }

            // Восстанавливаем чистый текст
            textEl.innerHTML = textEl.dataset.originalText;

            // Подсвечиваем каждый голосовой комментарий
            let count = 0;
            for (const vc of comments) {
              if (vc.selected_text && vc.selected_text.trim()) {
                
                highlightText(textEl, vc.selected_text);
                count++;
              }
            }
            
          }
        } catch (error) {
          console.error("❌ Ошибка загрузки голосовых комментариев:", error);
        }
      }

      // Форматирование длительности
      function formatDuration(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, "0")}`;
      }

      // Воспроизведение голосового комментария
      function toggleVoicePlayback(btn, audioPath) {
        const container = btn.closest(".voice-comment");
        const timeline = container.querySelector(".voice-timeline .progress");
        const durationEl = container.querySelector(".voice-duration");

        // Если уже играет этот же — останавливаем
        if (btn.dataset.playing === "true") {
          if (window._currentVoiceAudio) {
            window._currentVoiceAudio.pause();
            window._currentVoiceAudio.currentTime = 0;
          }
          btn.dataset.playing = "false";
          btn.textContent = "▶";
          btn.classList.remove("playing");
          if (timeline) timeline.style.width = "0%";
          return;
        }

        // Останавливаем другие
        document.querySelectorAll(".voice-comment .play-btn").forEach((b) => {
          b.dataset.playing = "false";
          b.textContent = "▶";
          b.classList.remove("playing");
          const t = b.closest(".voice-comment").querySelector(".voice-timeline .progress");
          if (t) t.style.width = "0%";
        });
        if (window._currentVoiceAudio) {
          window._currentVoiceAudio.pause();
          window._currentVoiceAudio = null;
        }

        // ===== ФОРМИРУЕМ ПУТЬ =====
        let fullPath = audioPath;

        // Если путь уже полный
        if (fullPath.startsWith("http://") || fullPath.startsWith("https://")) {
          // Ничего не делаем
        } else {
          // Убираем дублирование
          fullPath = fullPath.replace(/\\/g, "/");
          fullPath = fullPath.replace(/uploadsaudio/g, "uploads/audio/");
          fullPath = fullPath.replace(/uploads\/audio\/uploads\/audio/g, "uploads/audio");

          // Если путь начинается с uploads/, добавляем origin
          if (fullPath.startsWith("uploads/")) {
            fullPath = window.location.origin + "/" + fullPath;
          } else if (fullPath.startsWith("/uploads/")) {
            fullPath = window.location.origin + fullPath;
          } else if (!fullPath.startsWith("http")) {
            // Если просто имя файла
            fullPath = window.location.origin + "/uploads/audio/" + fullPath;
          }
        }

        
        

        const audio = new Audio(fullPath);
        window._currentVoiceAudio = audio;

        btn.dataset.playing = "true";
        btn.textContent = "⏸";
        btn.classList.add("playing");

        audio.addEventListener("timeupdate", function () {
          if (timeline) {
            const progress = (this.currentTime / this.duration) * 100;
            timeline.style.width = Math.min(100, progress) + "%";
          }
          if (durationEl) {
            durationEl.textContent = formatDuration(this.currentTime);
          }
        });

        audio.addEventListener("ended", function () {
          btn.dataset.playing = "false";
          btn.textContent = "▶";
          btn.classList.remove("playing");
          if (timeline) timeline.style.width = "0%";
          if (durationEl) durationEl.textContent = formatDuration(0);
          window._currentVoiceAudio = null;
        });

        audio.addEventListener("error", function (e) {
          console.error("❌ Ошибка воспроизведения:", e);
          console.error("❌ Путь:", fullPath);
          alert("❌ Ошибка воспроизведения аудио.\nПуть: " + fullPath);
          btn.dataset.playing = "false";
          btn.textContent = "▶";
          btn.classList.remove("playing");
          window._currentVoiceAudio = null;
        });

        audio.play().catch((err) => {
          console.error("❌ Ошибка воспроизведения:", err);
          alert("❌ Не удалось воспроизвести аудио");
          btn.dataset.playing = "false";
          btn.textContent = "▶";
          btn.classList.remove("playing");
          window._currentVoiceAudio = null;
        });
      }

      // Клик по таймлайну для перемотки
      function seekVoice(container, event) {
        const audio = window._currentVoiceAudio;
        if (!audio) return;

        const rect = container.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const newTime = x * audio.duration;
        audio.currentTime = Math.max(0, Math.min(audio.duration, newTime));

        const progress = container.querySelector(".progress");
        if (progress) {
          progress.style.width = Math.min(100, (audio.currentTime / audio.duration) * 100) + "%";
        }
      }

      // Запись голосового комментария
      function startVoiceRecording(btn, submissionId, subtaskIndex) {
        if (isRecording) {
          stopVoiceRecording(btn, submissionId, subtaskIndex);
          return;
        }

        // Проверяем поддержку
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("❌ Ваш браузер не поддерживает запись голоса");
          return;
        }

        navigator.mediaDevices
          .getUserMedia({ audio: true })
          .then((stream) => {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
              if (event.data.size > 0) {
                audioChunks.push(event.data);
              }
            };

            mediaRecorder.onstop = function () {
              // Создаём аудиофайл
              const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
              const duration = Math.round((Date.now() - recordingStartTime) / 1000);

              // Отправляем на сервер
              uploadVoiceComment(btn, submissionId, subtaskIndex, audioBlob, duration);

              // Освобождаем ресурсы
              stream.getTracks().forEach((track) => track.stop());
            };

            mediaRecorder.start();
            isRecording = true;
            recordingStartTime = Date.now();

            btn.textContent = "⏹ Остановить";
            btn.classList.add("recording");

            // Таймер для отображения длительности
            recordingTimer = setInterval(() => {
              const elapsed = Math.round((Date.now() - recordingStartTime) / 1000);
              btn.textContent = `⏹ ${formatDuration(elapsed)}`;
            }, 1000);

            showHint("🎙️ Запись... Нажмите кнопку снова для остановки");
          })
          .catch((err) => {
            console.error("Ошибка доступа к микрофону:", err);

      function getObjectBounds(obj) {
        if (!obj) return null;
        let x1, x2, y1, y2;
        if (obj.type === "free-line" && obj.points && obj.points.length > 0) {
          x1 = Math.min(...obj.points.map((p) => p.x));
          x2 = Math.max(...obj.points.map((p) => p.x));
          y1 = Math.min(...obj.points.map((p) => p.y));
          y2 = Math.max(...obj.points.map((p) => p.y));
        } else if (obj.type === "text") {
          const tempCanvas = document.createElement("canvas");
          const tempCtx = tempCanvas.getContext("2d");
          const fontSize = obj.size || 24;
          const font = obj.font || "Arial";
          const style = (obj.bold ? "bold " : "") + (obj.italic ? "italic " : "") + fontSize + "px " + font;
          tempCtx.font = style;
          const lines = (obj.text || "").split("\n");
          let maxWidth = 0;
          lines.forEach((line) => {
            const w = tempCtx.measureText(line).width;
            if (w > maxWidth) maxWidth = w;
          });
          const lineHeight = fontSize * 1.4;

          let minX = obj.x;
          let maxX = obj.x + maxWidth;
          if (obj.align === "center") {
            minX = obj.x - maxWidth / 2;
            maxX = obj.x + maxWidth / 2;
          } else if (obj.align === "right") {
            minX = obj.x - maxWidth;
            maxX = obj.x;
          }

          return {
            minX: minX,
            maxX: maxX,
            minY: obj.y,
            maxY: obj.y + lines.length * lineHeight,
          };
        } else if (obj.type === "image") {
          return { minX: obj.x, maxX: obj.x + obj.width, minY: obj.y, maxY: obj.y + obj.height };
        } else if (obj.type === "circle" || obj.type === "sphere") {
          const cx = (obj.x1 + obj.x2) / 2;
          const cy = (obj.y1 + obj.y2) / 2;
          const r = Math.sqrt((obj.x2 - obj.x1) ** 2 + (obj.y2 - obj.y1) ** 2) / 2;
          x1 = cx - r;
          x2 = cx + r;
          y1 = cy - r;
          y2 = cy + r;
        } else {
          x1 = Math.min(obj.x1, obj.x2);
          x2 = Math.max(obj.x1, obj.x2);
          y1 = Math.min(obj.y1, obj.y2);
          y2 = Math.max(obj.y1, obj.y2);
        }
        return { minX: x1, maxX: x2, minY: y1, maxY: y2 };
      }

      function getSelectedBounds() {
        if (selected.length === 0) return null;
        let minX = Infinity,
          maxX = -Infinity,
          minY = Infinity,
          maxY = -Infinity;
        selected.forEach((id) => {
          const o = objects.find((obj) => obj.id === id);
          if (!o) return;
          const b = getObjectBounds(o);
          if (!b) return;
          if (b.minX < minX) minX = b.minX;
          if (b.maxX > maxX) maxX = b.maxX;
          if (b.minY < minY) minY = b.minY;
          if (b.maxY > maxY) maxY = b.maxY;
        });
        return { minX, maxX, minY, maxY };
      }

      function isPointInSelectionBounds(wx, wy) {
        const bounds = getSelectedBounds();
        if (!bounds) return false;
        const pad = CONFIG.SELECTION_PAD;
        return wx >= bounds.minX - pad && wx <= bounds.maxX + pad && wy >= bounds.minY - pad && wy <= bounds.maxY + pad;
      }

      function findObjectAt(wx, wy) {
        const radius = currentThickness * 3; // Увеличил радиус для удобства
        let bestMatch = null;
        let bestDist = Infinity;

        for (let i = objects.length - 1; i >= 0; i--) {
          const obj = objects[i];

          // Текст и изображения
          if (obj.type === "text" || obj.type === "image") {
            const b = getObjectBounds(obj);
            if (b && wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
              return obj;
            }
            continue;
          }

          // Листы
          if (obj.type === "sheet") {
            const b = getObjectBounds(obj);
            if (b && wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
              return obj;
            }
            continue;
          }

          // Линии (отрезки, лучи, прямые)
          if (obj.type === "segment" || obj.type === "ray" || obj.type === "line") {
            const dx = obj.x2 - obj.x1;
            const dy = obj.y2 - obj.y1;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) continue;

            const t = Math.max(0, Math.min(1, ((wx - obj.x1) * dx + (wy - obj.y1) * dy) / len2));
            const cx = obj.x1 + t * dx;
            const cy = obj.y1 + t * dy;
            const dist2 = (wx - cx) ** 2 + (wy - cy) ** 2;

            // Ищем ближайшую линию
            if (dist2 < bestDist && dist2 < radius ** 2) {
              bestDist = dist2;
              bestMatch = obj;
            }
            continue;
          }

          // Фигуры (круги, прямоугольники, треугольники и т.д.)
          if (obj.type !== "free-line") {
            const b = getObjectBounds(obj);
            if (!b) continue;
            if (wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
              return obj;
            }
            continue;
          }

          // Free-line (рисованные линии) - считаем расстояние до каждого сегмента
          if (obj.type === "free-line" && obj.points) {
            for (let j = 0; j < obj.points.length - 1; j++) {
              const p1 = obj.points[j];
              const p2 = obj.points[j + 1];
              const dx = p2.x - p1.x;
              const dy = p2.y - p1.y;
              const len2 = dx * dx + dy * dy;
              if (len2 === 0) continue;

              const t = Math.max(0, Math.min(1, ((wx - p1.x) * dx + (wy - p1.y) * dy) / len2));
              const cx = p1.x + t * dx;
              const cy = p1.y + t * dy;
              const dist2 = (wx - cx) ** 2 + (wy - cy) ** 2;

              if (dist2 < bestDist && dist2 < radius ** 2) {
                bestDist = dist2;
                bestMatch = obj;
              }
            }
          }
        }

        return bestMatch;
      }

      // Универсальная функция: зум относительно точки на экране (в пикселях canvas)
      function zoomAtScreenPoint(screenX, screenY, factor) {
        const oldZoom = zoom;
        const newZoom = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, zoom * factor));
        if (newZoom === oldZoom) return;

        // Мировые координаты точки, которая находится под курсором/центром экрана
        const worldX = screenX / zoom + camera.x;
        const worldY = screenY / zoom + camera.y;

        zoom = newZoom;

        // Сдвигаем камеру так, чтобы эта же мировая точка осталась на том же месте экрана
        camera.x = worldX - screenX / zoom;
        camera.y = worldY - screenY / zoom;

        document.getElementById("zoom-display").textContent = Math.round(zoom * 100) + "%";
        requestRender();
      }

      function zoomFit() {
        zoom = 1;
        camera.x = 0;
        camera.y = 0;
        document.getElementById("zoom-display").textContent = "100%";
        requestRender();
      }

      function getBoardHistory() {
        const boardId = getBoardId();
        if (!boardHistories[boardId]) {
          boardHistories[boardId] = { history: [], index: -1 };
        }
        return boardHistories[boardId];
      }

      function saveBoardHistory() {
        const boardId = getBoardId();
        if (!boardHistories[boardId]) {
          boardHistories[boardId] = { history: [], index: -1 };
        }
        const myHistory = boardHistories[boardId];

        // Обрезаем всё, что после текущего индекса
        if (myHistory.index < myHistory.history.length - 1) {
          myHistory.history = myHistory.history.slice(0, myHistory.index + 1);
        }

        // Сохраняем ТЕКУЩЕЕ состояние
        myHistory.history.push(JSON.parse(JSON.stringify(objects)));
        myHistory.index = myHistory.history.length - 1;

        if (myHistory.history.length > 50) {
          myHistory.history.shift();
          myHistory.index--;
        }
      }

      }

      // ============================================================
      // ОТРИСОВКА
      // ============================================================
      let renderPending = false;
      let renderTimeout = null;

      function render() {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawObjects();
        drawTempShape();
        updateSelectionFrame();
        updateSelectionBox();
        updateStatus();
      }

      function drawGrid() {
        const levels = [
          { step: 2048, color: "#e8e8e8" },
          { step: 512, color: "#e0e0e0" },
          { step: 128, color: "#d8d8d8" },
          { step: 32, color: "#d0d0d0" },
        ];
        let visibleLevels = [];
        if (zoom < 0.15) visibleLevels = [0];
        else if (zoom < 0.4) visibleLevels = [0, 1];
        else if (zoom < 1.0) visibleLevels = [0, 1, 2];
        else visibleLevels = [1, 2, 3];
        const visibleLeft = camera.x - canvas.width / zoom;
        const visibleRight = camera.x + canvas.width / zoom;
        const visibleTop = camera.y - canvas.height / zoom;
        const visibleBottom = camera.y + canvas.height / zoom;
        visibleLevels.forEach((idx) => {
          const g = levels[idx];
          const step = g.step;
          const startX = Math.floor(visibleLeft / step) * step;
          const startY = Math.floor(visibleTop / step) * step;
          ctx.strokeStyle = g.color;
          ctx.lineWidth = 1;
          for (let x = startX; x <= visibleRight; x += step) {
            const p = worldToScreen(x, camera.y);
            ctx.beginPath();
            ctx.moveTo(p.x, 0);
            ctx.lineTo(p.x, canvas.height);
            ctx.stroke();
          }
          for (let y = startY; y <= visibleBottom; y += step) {
            const p = worldToScreen(camera.x, y);
            ctx.beginPath();
            ctx.moveTo(0, p.y);
            ctx.lineTo(canvas.width, p.y);
            ctx.stroke();
          }
        });
      }

      function drawObjects() {
        // ===== СЛОЙ 1: ВСЕ ИЗОБРАЖЕНИЯ =====
        objects.forEach((obj) => {
          if (obj.type === "image") {
            drawImageObject(ctx, obj);
          }
        });

        // ===== СЛОЙ 2: ВСЁ ОСТАЛЬНОЕ =====
        objects.forEach((obj) => {
          if (obj.type === "image") return;

          if (obj.type === "text") {
            drawTextObject(ctx, obj);
            return;
          }
          if (obj.type === "sheet") {
            drawSheet(ctx, obj);
            return;
          }

          const p1 = { x: obj.x1, y: obj.y1 };
          const p2 = { x: obj.x2, y: obj.y2 };
          const screenP1 = worldToScreen(p1.x, p1.y);
          const screenP2 = worldToScreen(p2.x, p2.y);

          // ===== ЕДИНОЕ ПРАВИЛО: размеры * zoom, координаты через worldToScreen =====
          const worldThickness = (obj.thickness || currentThickness) * zoom;

          if (obj.type === "segment" || obj.type === "ray" || obj.type === "line") {
            drawShape(
              ctx,
              obj.type,
              screenP1,
              screenP2,
              obj.color || currentColor,
              worldThickness,
              obj.dashed || false,
            );
            return;
          }

          if (obj.type !== "free-line") {
            const isLine = obj.type === "segment" || obj.type === "ray" || obj.type === "line";
            drawShape(
              ctx,
              obj.type,
              screenP1,
              screenP2,
              obj.color || currentColor,
              worldThickness,
              isLine ? obj.dashed || false : false,
            );
            return;
          }

          // free-line
          ctx.strokeStyle = obj.color || "#000";
          ctx.fillStyle = obj.color || "#000";
          ctx.lineWidth = Math.max(1, worldThickness);
          ctx.setLineDash(obj.dash ? obj.dash.map((d) => d * zoom) : []);
          if (obj.type === "free-line" && obj.points && obj.points.length > 1) {
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            const first = worldToScreen(obj.points[0].x, obj.points[0].y);
            ctx.moveTo(first.x, first.y);
            for (let i = 1; i < obj.points.length; i++) {
              const p = worldToScreen(obj.points[i].x, obj.points[i].y);
              ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
          }
          ctx.setLineDash([]);
        });
      }

      function drawTempShape() {
        if (!shapeStart || !shapeEnd) return;
        const p1 = worldToScreen(shapeStart.x, shapeStart.y);
        const p2 = worldToScreen(shapeEnd.x, shapeEnd.y);
        if (mode === "text") {
          const x = Math.min(p1.x, p2.x);
          const y = Math.min(p1.y, p2.y);
          const w = Math.abs(p2.x - p1.x);
          const h = Math.abs(p2.y - p1.y);
          ctx.strokeStyle = "#007aff";
          ctx.lineWidth = 2 * zoom;
          ctx.setLineDash(getDashPattern(currentThickness, zoom));
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(0,122,255,0.05)";
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "#007aff";
          ctx.font = 14 * zoom + "px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("📝 Текст", x + w / 2, y + h / 2);
          return;
        }
        if (mode === "image") {
          const x = Math.min(p1.x, p2.x);
          const y = Math.min(p1.y, p2.y);
          const w = Math.abs(p2.x - p1.x);
          const h = Math.abs(p2.y - p1.y);
          ctx.strokeStyle = "#3498db";
          ctx.lineWidth = 2 * zoom;
          ctx.setLineDash(getDashPattern(currentThickness, zoom));
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(52,152,219,0.05)";
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "#3498db";
          ctx.font = 14 * zoom + "px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🖼️ Изображение", x + w / 2, y + h / 2);
          return;
        }
        if (mode === "sheet") {
          const x = Math.min(p1.x, p2.x);
          const y = Math.min(p1.y, p2.y);
          const w = Math.abs(p2.x - p1.x);
          const h = Math.abs(p2.y - p1.y);
          ctx.shadowColor = "rgba(0,0,0,0.1)";
          ctx.shadowBlur = 15 * zoom;
          ctx.shadowOffsetX = 3 * zoom;
          ctx.shadowOffsetY = 3 * zoom;
          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.fillRect(x, y, w, h);
          ctx.shadowColor = "transparent";
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 1.5 * zoom;
          ctx.setLineDash(getDashPattern(currentThickness, zoom));
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);
          const cornerSize = Math.min(w, h) * 0.06;
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2 * zoom;
          ctx.beginPath();
          ctx.moveTo(x, y + cornerSize);
          ctx.lineTo(x, y);
          ctx.lineTo(x + cornerSize, y);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + w - cornerSize, y);
          ctx.lineTo(x + w, y);
          ctx.lineTo(x + w, y + cornerSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x, y + h - cornerSize);
          ctx.lineTo(x, y + h);
          ctx.lineTo(x + cornerSize, y + h);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + w - cornerSize, y + h);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x + w, y + h - cornerSize);
          ctx.stroke();
          return;
        }
        if (mode === "segment" || mode === "ray" || mode === "line") {
          ctx.strokeStyle = currentColor + "80";
          ctx.fillStyle = currentColor + "80";
          ctx.lineWidth = Math.max(1, currentThickness * zoom);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.setLineDash(isDashed ? getDashPattern(currentThickness, zoom) : []);

          if (mode === "ray") {
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            const lineW = Math.max(1, currentThickness * zoom);

            const arrowLen = Math.max(15 * zoom, lineW * 4);
            const arrowWidth = Math.max(12 * zoom, lineW * 3);

            const lineEndX = p2.x - arrowLen * Math.cos(angle);
            const lineEndY = p2.y - arrowLen * Math.sin(angle);

            const perpX = (-Math.sin(angle) * arrowWidth) / 2;
            const perpY = (Math.cos(angle) * arrowWidth) / 2;

            // 1. Сначала линия (с пунктиром)
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(lineEndX, lineEndY);
            ctx.stroke();

            // 2. ВЫКЛЮЧАЕМ ПУНКТИР для стрелки
            ctx.setLineDash([]);

            // 3. Рисуем стрелку (сплошную)
            ctx.beginPath();
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(lineEndX + perpX, lineEndY + perpY);
            ctx.lineTo(lineEndX - perpX, lineEndY - perpY);
            ctx.closePath();
            ctx.stroke();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
          ctx.setLineDash([]);
        } else if (SHAPE_LIST.find((s) => s.id === mode)) {
          // Для фигур пунктир НЕ применяем
          drawShape(ctx, mode, p1, p2, currentColor, currentThickness * zoom, false);
        }
      }

      function drawShape(ctx, type, p1, p2, color, thickness, dashed) {
        const isLineType = type === "segment" || type === "ray" || type === "line";
        const useDash = isLineType ? dashed : false;
        const x1 = p1.x,
          y1 = p1.y,
          x2 = p2.x,
          y2 = p2.y;
        const cx = (x1 + x2) / 2,
          cy = (y1 + y2) / 2;
        const w = x2 - x1,
          h = y2 - y1;
        const r = Math.sqrt(w * w + h * h) / 2;
        ctx.strokeStyle = color || "#000";
        ctx.fillStyle = color + "20" || "rgba(0,0,0,0.05)";
        ctx.lineWidth = thickness || 2;
        ctx.setLineDash(useDash ? getDashPattern(currentThickness, zoom) : []);
        ctx.beginPath();
        switch (type) {
          case "triangle":
            ctx.moveTo(cx, y1);
            ctx.lineTo(x1, y2);
            ctx.lineTo(x2, y2);
            ctx.closePath();
            break;
          case "triangle_eq": {
            const side = Math.min(Math.abs(w), Math.abs(h));
            const h3 = (side * Math.sqrt(3)) / 2;
            ctx.moveTo(cx, y1);
            ctx.lineTo(cx - side / 2, y1 + h3);
            ctx.lineTo(cx + side / 2, y1 + h3);
            ctx.closePath();
            break;
          }
          case "triangle_right":
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1, y2);
            ctx.lineTo(x2, y2);
            ctx.closePath();
            break;
          case "square": {
            const s = Math.min(Math.abs(w), Math.abs(h));
            ctx.rect(cx - s / 2, cy - s / 2, s, s);
            break;
          }
          case "rect":
            ctx.rect(x1, y1, w, h);
            break;
          case "parallelogram": {
            const shift = w * 0.3;
            ctx.moveTo(x1 + shift, y1);
            ctx.lineTo(x2, y1);
            ctx.lineTo(x2 - shift, y2);
            ctx.lineTo(x1, y2);
            ctx.closePath();
            break;
          }
          case "rhombus":
            ctx.moveTo(cx, y1);
            ctx.lineTo(x2, cy);
            ctx.lineTo(cx, y2);
            ctx.lineTo(x1, cy);
            ctx.closePath();
            break;
          case "trapezoid": {
            const topW = w * 0.5;
            ctx.moveTo(cx - topW / 2, y1);
            ctx.lineTo(cx + topW / 2, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x1, y2);
            ctx.closePath();
            break;
          }
          case "circle":
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            break;
          case "hexagon": {
            for (let i = 0; i < 6; i++) {
              const angle = Math.PI / 6 + (i * Math.PI) / 3;
              const px = cx + r * Math.cos(angle);
              const py = cy + r * Math.sin(angle);
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            break;
          }
          case "cube": {
            const s2 = Math.min(Math.abs(w), Math.abs(h)) * 0.5;
            const off = s2 * 0.35;
            ctx.rect(cx - s2 / 2, cy - s2 / 2, s2, s2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - s2 / 2, cy - s2 / 2);
            ctx.lineTo(cx - s2 / 2 + off, cy - s2 / 2 - off);
            ctx.lineTo(cx + s2 / 2 + off, cy - s2 / 2 - off);
            ctx.lineTo(cx + s2 / 2, cy - s2 / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + s2 / 2, cy - s2 / 2);
            ctx.lineTo(cx + s2 / 2 + off, cy - s2 / 2 - off);
            ctx.lineTo(cx + s2 / 2 + off, cy + s2 / 2 - off);
            ctx.lineTo(cx + s2 / 2, cy + s2 / 2);
            ctx.stroke();
            ctx.setLineDash([4 * zoom, 5 * zoom]);
            ctx.beginPath();
            ctx.moveTo(cx - s2 / 2, cy - s2 / 2);
            ctx.lineTo(cx - s2 / 2 + off, cy - s2 / 2 - off);
            ctx.lineTo(cx - s2 / 2 + off, cy + s2 / 2 - off);
            ctx.lineTo(cx - s2 / 2, cy + s2 / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - s2 / 2 + off, cy - s2 / 2 - off);
            ctx.lineTo(cx - s2 / 2 + off, cy + s2 / 2 - off);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - s2 / 2 + off, cy + s2 / 2 - off);
            ctx.lineTo(cx + s2 / 2 + off, cy + s2 / 2 - off);
            ctx.stroke();
            ctx.setLineDash(useDash ? getDashPattern(currentThickness, zoom) : []);
            return;
          }
          case "cylinder": {
            const cylR = Math.min(Math.abs(w), Math.abs(h)) * 0.4;
            const cylH = Math.abs(h) * 0.6;
            ctx.ellipse(cx, cy - cylH / 2, cylR, cylR * 0.25, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.ellipse(cx, cy + cylH / 2, cylR, cylR * 0.25, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - cylR, cy - cylH / 2);
            ctx.lineTo(cx - cylR, cy + cylH / 2);
            ctx.moveTo(cx + cylR, cy - cylH / 2);
            ctx.lineTo(cx + cylR, cy + cylH / 2);
            ctx.stroke();
            ctx.setLineDash([4 * zoom, 5 * zoom]);
            ctx.beginPath();
            ctx.moveTo(cx - cylR, cy - cylH / 2);
            ctx.lineTo(cx - cylR, cy + cylH / 2);
            ctx.stroke();
            ctx.setLineDash(useDash ? getDashPattern(thickness / zoom, zoom) : []);
            return;
          }
          case "sphere": {
            const sphereR = Math.min(Math.abs(w), Math.abs(h)) * 0.45;
            ctx.arc(cx, cy, sphereR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(cx, cy, sphereR, sphereR * 0.25, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(cx, cy, sphereR * 0.25, sphereR, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([4 * zoom, 5 * zoom]);
            ctx.beginPath();
            ctx.ellipse(cx, cy, sphereR, sphereR * 0.25, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash(useDash ? getDashPattern(thickness / zoom, zoom) : []);
            return;
          }
          case "segment":
          case "ray":
          case "line":
            ctx.strokeStyle = color || "#000";
            ctx.fillStyle = color || "#000";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.setLineDash(useDash ? getDashPattern(thickness / zoom, zoom) : []);

            if (type === "ray") {
              const angle = Math.atan2(y2 - y1, x2 - x1);
              const lineW = thickness || 2; // уже * zoom приходит из drawObjects

              const arrowLen = Math.max(15 * zoom, lineW * 4);
              const arrowWidth = Math.max(12 * zoom, lineW * 3);

              const lineEndX = x2 - arrowLen * Math.cos(angle);
              const lineEndY = y2 - arrowLen * Math.sin(angle);

              const perpX = (-Math.sin(angle) * arrowWidth) / 2;
              const perpY = (Math.cos(angle) * arrowWidth) / 2;

              ctx.lineWidth = lineW;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(lineEndX, lineEndY);
              ctx.stroke();

              // ← ВЫКЛЮЧАЕМ ПУНКТИР ДЛЯ СТРЕЛКИ
              ctx.setLineDash([]);

              ctx.beginPath();
              ctx.moveTo(x2, y2);
              ctx.lineTo(lineEndX + perpX, lineEndY + perpY);
              ctx.lineTo(lineEndX - perpX, lineEndY - perpY);
              ctx.closePath();
              ctx.stroke();
              ctx.fill();
            } else {
              ctx.lineWidth = thickness || 2;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }

            ctx.setLineDash([]);
            return;
          default:
            ctx.rect(x1, y1, w, h);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawTextObject(ctx, obj) {
        if (!obj || obj.type !== "text") return;
        const p = worldToScreen(obj.x || 0, obj.y || 0);

        const fontSize = (obj.size || 24) * zoom;
        const font = obj.font || "Arial";
        const style = (obj.bold ? "bold " : "") + (obj.italic ? "italic " : "") + fontSize + "px " + font;

        const pad = 8 * zoom;
        const decoLineWidth = Math.max(1, 1.5 * zoom);
        const underlineOffset = 2 * zoom;

        ctx.save();
        ctx.font = style;
        ctx.textBaseline = "top";

        if (!obj.text || obj.text.trim() === "") {
          ctx.fillStyle = "rgba(180,180,180,0.6)";
          ctx.font = "italic " + fontSize + "px " + font;
          ctx.textAlign = obj.align || "left";
          ctx.fillText("Введите текст...", p.x, p.y);
          ctx.restore();
          return;
        }

        if (obj.hasBg && obj.bgColor) {
          ctx.fillStyle = obj.bgColor;
          const lines = obj.text.split("\n");
          let maxWidth = 0;
          lines.forEach((line) => {
            const w = ctx.measureText(line).width;
            if (w > maxWidth) maxWidth = w;
          });
          const lineHeight = fontSize * 1.4;
          const totalHeight = lines.length * lineHeight;

          ctx.fillRect(
            p.x - pad - (obj.align === "right" ? maxWidth : 0) + (obj.align === "center" ? maxWidth / 2 : 0),
            p.y - pad,
            maxWidth + pad * 2,
            totalHeight + pad * 2,
          );
        }

        ctx.fillStyle = obj.color || "#000000";
        ctx.textAlign = obj.align || "left";
        const lines = obj.text.split("\n");
        const lineHeight = fontSize * 1.4;
        let yOffset = 0;
        const decoColor = obj.color || "#000";

        lines.forEach((line) => {
          ctx.fillText(line, p.x, p.y + yOffset);
          const metrics = ctx.measureText(line);
          const width = metrics.width;

          if (obj.underline) {
            ctx.strokeStyle = decoColor;
            ctx.lineWidth = decoLineWidth;
            let xStart = p.x;
            if (obj.align === "center") xStart = p.x - width / 2;
            else if (obj.align === "right") xStart = p.x - width;
            ctx.beginPath();
            ctx.moveTo(xStart, p.y + yOffset + fontSize + underlineOffset);
            ctx.lineTo(xStart + width, p.y + yOffset + fontSize + underlineOffset);
            ctx.stroke();
          }

          if (obj.strike) {
            ctx.strokeStyle = decoColor;
            ctx.lineWidth = decoLineWidth;
            let xStart = p.x;
            if (obj.align === "center") xStart = p.x - width / 2;
            else if (obj.align === "right") xStart = p.x - width;
            ctx.beginPath();
            ctx.moveTo(xStart, p.y + yOffset + fontSize / 2);
            ctx.lineTo(xStart + width, p.y + yOffset + fontSize / 2);
            ctx.stroke();
          }

          yOffset += lineHeight;
        });

        ctx.restore();
      }

      function drawImageObject(ctx, obj) {
        if (!obj.imgData) return;

        const p = worldToScreen(obj.x, obj.y);
        const w = obj.width * zoom;
        const h = obj.height * zoom;

        let img = imageCache[obj.id];

        if (!img) {
          img = new Image();
          img._loaded = false;
          img.onload = function () {
            img._loaded = true;
            requestRender();
          };
          img.src = obj.imgData;
          imageCache[obj.id] = img;
        }

        if (img._loaded && img.naturalWidth > 0) {
          ctx.drawImage(img, p.x, p.y, w, h);
        } else {
          ctx.fillStyle = "rgba(240, 240, 240, 0.5)";
          ctx.fillRect(p.x, p.y, w, h);
        }
      }

      function drawSheet(ctx, obj) {
        const p1 = worldToScreen(obj.x1, obj.y1);
        const p2 = worldToScreen(obj.x2, obj.y2);
        const x = Math.min(p1.x, p2.x);
        const y = Math.min(p1.y, p2.y);
        const w = Math.abs(p2.x - p1.x);
        const h = Math.abs(p2.y - p1.y);
        ctx.shadowColor = "rgba(0,0,0,0.15)";
        ctx.shadowBlur = 20 * zoom;
        ctx.shadowOffsetX = 4 * zoom;
        ctx.shadowOffsetY = 4 * zoom;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, w, h);
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = obj.color || "#333";
        ctx.lineWidth = 1.5 * zoom;
        ctx.strokeRect(x, y, w, h);
        const cornerSize = Math.min(w, h) * 0.06;
        ctx.strokeStyle = obj.color || "#333";
        ctx.lineWidth = 2 * zoom;
        ctx.beginPath();
        ctx.moveTo(x, y + cornerSize);
        ctx.lineTo(x, y);
        ctx.lineTo(x + cornerSize, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w - cornerSize, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w, y + cornerSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y + h - cornerSize);
        ctx.lineTo(x, y + h);
        ctx.lineTo(x + cornerSize, y + h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w - cornerSize, y + h);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x + w, y + h - cornerSize);
        ctx.stroke();

        drawSheetText(ctx, obj);
      }

      function updateSelectionFrame() {
        const frame = document.getElementById("selection-frame");

        const padScreen = 10; // 10 пикселей на экране

        const p1 = worldToScreen(b.minX - pad, b.minY - pad);
        const p2 = worldToScreen(b.maxX + pad, b.maxY + pad);

        s("handle-tl", p1.x, p1.y);

        s("handle-bl", p1.x, p2.y);
        s("handle-br", p2.x, p2.y);
        s("handle-t", p1.x + w / 2, p1.y);
        s("handle-b", p1.x + w / 2, p2.y);
        s("handle-l", p1.x, p1.y + h / 2);
        s("handle-r", p2.x, p1.y + h / 2); // Обновляем кнопку редактирования листа
        // Обновляем кнопку редактирования листа — только если есть выделение

      // ============================================================

      function updateSheetEditButton() {
        const btn = document.getElementById("sheet-edit-btn");

        if (isSheetTextMode && editingSheet) {
          btn.style.display = "block";
          btn.classList.add("active");
          btn.textContent = "✓ Готово";

        }

        // Ищем выделенный лист
        let sheetObj = null;

          if (obj && obj.type === "sheet") {

          if (bounds) {
            const rect = canvas.getBoundingClientRect();
            const p = worldToScreen(bounds.maxX, bounds.minY);

            // p.x, p.y — координаты внутри canvas, добавляем смещение canvas
            let left = rect.left + p.x + 12;
            let top = rect.top + p.y;

            // Не вылезаем за экран
            if (left + 200 > window.innerWidth) left = window.innerWidth - 210;
            if (top < 10) top = 10;
            if (top + 40 > window.innerHeight) top = window.innerHeight - 50;

            btn.style.position = "fixed";
            btn.style.left = left + "px";
            btn.style.top = top + "px";
            btn.style.display = "block";
            btn.classList.remove("active");

      // ===== МИГАНИЕ КУРСОРА НА ЛИСТЕ =====
      let _cursorBlinkInterval = null;

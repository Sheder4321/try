      function initAnnotationSystemForImage(imgElement, container, submissionId, isTeacher, existingAnnotations) {
        if (!imgElement || !container) {
          console.warn("⚠️ Нет изображения или контейнера");
          return;
        }

        const instanceId = "ann_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
        const wrapper = imgElement.parentElement;
        if (!wrapper) return;

        

        // Настраиваем изображение
        imgElement.style.display = "block";
        imgElement.style.width = "100%";
        imgElement.style.height = "auto";
        imgElement.style.maxHeight = "400px";
        imgElement.style.objectFit = "contain";
        imgElement.style.position = "relative";
        imgElement.style.zIndex = "1";

        wrapper.style.position = "relative";
        wrapper.style.display = "inline-block";
        wrapper.style.width = "100%";
        wrapper.style.maxWidth = "500px";
        wrapper.style.background = "#f5f5f5";
        wrapper.style.borderRadius = "4px";
        wrapper.style.overflow = "hidden";

        // Удаляем старый canvas
        const oldCanvas = wrapper.querySelector("canvas");
        if (oldCanvas) oldCanvas.remove();

        // Создаём canvas
        const canvas = document.createElement("canvas");
        canvas.id = instanceId + "_canvas";
        canvas.style.cssText = `
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: ${isTeacher ? "crosshair" : "default"};
        pointer-events: ${isTeacher ? "auto" : "none"};
        z-index: 10;
        background: transparent !important;
    `;
        wrapper.appendChild(canvas);

        // Контейнер для комментариев (ВСЕГДА под фото)
        const existingContainer = container.querySelector(".teacher-comments-container");
        if (existingContainer) existingContainer.remove();

        const commentsContainer = document.createElement("div");
        commentsContainer.className = "teacher-comments-container";
        commentsContainer.style.cssText = `
        margin-top: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 10px;
        background: #fafafa;
        max-height: 300px;
        overflow-y: auto;
        width: 100%;
        max-width: 500px;
    `;
        // Вставляем ПОСЛЕ wrapper (под фото)
        wrapper.parentNode.insertBefore(commentsContainer, wrapper.nextSibling);

        // Данные экземпляра
        const instanceData = {
          id: instanceId,
          annotations: existingAnnotations
            ? existingAnnotations.map((a) => ({
                id: a.id,
                x: a.x || 0,
                y: a.y || 0,
                w: a.width || a.w || 20,
                h: a.height || a.h || 20,
                comment: a.comment || "",
                color: a.color || "#ff3b30",
                isVoice: a.isVoice || false,
                audioPath: a.audioPath || null,
                duration: a.duration || 0,
              }))
            : [],
          isTeacher: isTeacher,
          submissionId: submissionId,
          canvas: canvas,
          wrapper: wrapper,
          imgElement: imgElement,
          commentsContainer: commentsContainer,
          isDrawing: false,
          startX: 0,
          startY: 0,
          currentRect: null,
        };

        window._annotationInstances[instanceId] = instanceData;

        function getScale() {
          const img = wrapper.querySelector("img");
          if (!img || !img.complete || img.naturalWidth === 0) {
              return { scaleX: 1, scaleY: 1, offsetX: 0, offsetY: 0, naturalWidth: 1, naturalHeight: 1 };
          }
          
          const naturalWidth = img.naturalWidth;
          const naturalHeight = img.naturalHeight;
          
          // ===== СЧИТАЕМ РАЗМЕРЫ ОТНОСИТЕЛЬНО WRAPPER, А НЕ IMG =====
          const wrapperRect = wrapper.getBoundingClientRect();
          const wrapperWidth = wrapperRect.width;
          const wrapperHeight = wrapperRect.height;
          
          // ===== НАХОДИМ РЕАЛЬНЫЕ РАЗМЕРЫ ИЗОБРАЖЕНИЯ (с учётом object-fit) =====
          // Формула: если object-fit: contain, то изображение вписывается
          // в прямоугольник wrapperWidth × wrapperHeight, сохраняя пропорции.
          const naturalRatio = naturalWidth / naturalHeight;
          const wrapperRatio = wrapperWidth / wrapperHeight;
          
          let displayWidth, displayHeight;
          if (wrapperRatio > naturalRatio) {
              // Wrapper шире — ограничиваем по высоте
              displayHeight = wrapperHeight;
              displayWidth = displayHeight * naturalRatio;
          } else {
              // Wrapper выше — ограничиваем по ширине
              displayWidth = wrapperWidth;
              displayHeight = displayWidth / naturalRatio;
          }
          
          // ===== СМЕЩЕНИЕ (ЦЕНТРИРОВАНИЕ) =====
          const offsetX = (wrapperWidth - displayWidth) / 2;
          const offsetY = (wrapperHeight - displayHeight) / 2;
          
          const scaleX = displayWidth / naturalWidth;
          const scaleY = displayHeight / naturalHeight;
          
          return { scaleX, scaleY, offsetX, offsetY, naturalWidth, naturalHeight };
      }

        function drawAnnotations() {
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const data = window._annotationInstances[instanceId];
          if (!data || data.annotations.length === 0) return;
          const scale = getScale();
          data.annotations.forEach((ann, index) => {
            const x = ann.x * scale.scaleX + scale.offsetX;
            const y = ann.y * scale.scaleY + scale.offsetY;
            const w = ann.w * scale.scaleX;
            const h = ann.h * scale.scaleY;
            ctx.save();
            const color = ann.isVoice ? "#8e44ad" : ann.color || "#ff3b30";
            ctx.fillStyle = color + "30";
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.setLineDash(ann.isVoice ? [6, 4] : []);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
            const fontSize = Math.max(12, 16 * Math.min(scale.scaleX, scale.scaleY));
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            const icon = ann.isVoice ? "🎙️" : "💬";
            ctx.fillText(icon + " #" + (index + 1), x + 4, y + 4);
            ctx.restore();
          });
        }

        function updateCommentList() {
          const data = window._annotationInstances[instanceId];
          if (!data) return;
          const listEl = commentsContainer.querySelector(".teacher-comments-list");
          if (!listEl) return;

          const totalComments = data.annotations.length;
          const voiceComments = data.annotations.filter((a) => a.isVoice).length;
          const textComments = data.annotations.filter((a) => !a.isVoice).length;

          if (data.annotations.length === 0) {
            listEl.innerHTML = `<div style="color:#999;font-size:12px;text-align:center;padding:10px 0;">📝 Нет комментариев учителя</div>`;
            return;
          }

          listEl.innerHTML = `
            <div style="font-size:11px;color:#999;margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap;">
                <span>📌 Всего: ${totalComments}</span>
                ${textComments > 0 ? `<span>💬 Текстовых: ${textComments}</span>` : ""}
                ${voiceComments > 0 ? `<span>🎙️ Голосовых: ${voiceComments}</span>` : ""}
            </div>
            ${data.annotations
              .map((ann, index) => {
                const color = ann.isVoice ? "#8e44ad" : ann.color || "#ff3b30";
                const icon = ann.isVoice ? "🎙️" : "💬";
                const isVoice = ann.isVoice;
                const hasAudio = isVoice && ann.audioPath;
                const duration = ann.duration || 0;

                // Формируем путь к аудио для ученика
                let audioUrl = ann.audioPath;
                if (audioUrl && !audioUrl.startsWith("http")) {
                  audioUrl = window.location.origin + "/" + audioUrl.replace(/^\/+/, "");
                }

                return `
                    <div style="padding:6px 10px;border-left:3px solid ${color};margin-bottom:4px;background:white;border-radius:4px;font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;"
                         onmouseover="this.style.background='#e8f0fe'"
                         onmouseout="this.style.background='white'">
                        <div style="flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:120px;">
                            <span style="font-weight:bold;font-size:11px;color:${color};">${icon} #${index + 1}</span>
                            <span style="font-weight:500;font-size:12px;word-break:break-word;">${ann.comment || "Без текста"}</span>
                            ${isVoice && duration > 0 ? `<span style="font-size:10px;color:#999;white-space:nowrap;">⏱ ${formatDuration(duration)}</span>` : ""}
                        </div>
                        <div style="display:flex;gap:4px;flex-shrink:0;">
                            ${
                              isVoice && hasAudio
                                ? `
                                <button onclick="event.stopPropagation();playAnnotationAudioById('${instanceId}', ${index})" 
                                        style="padding:4px 14px;background:#8e44ad;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px;transition:all 0.2s;"
                                        onmouseover="this.style.background='#7d3c98'"
                                        onmouseout="this.style.background='#8e44ad'">
                                    ▶ Воспроизвести
                                </button>
                            `
                                : ""
                            }
                            ${
                              isTeacher
                                ? `
                                <button onclick="event.stopPropagation();deleteAnnotation('${instanceId}', ${index})" 
                                        style="background:none;border:none;color:#999;cursor:pointer;font-size:14px;padding:0 6px;"
                                        title="Удалить комментарий">✕</button>
                            `
                                : ""
                            }
                        </div>
                    </div>
                `;
              })
              .join("")}
        `;
        }

        function setupCanvas() {
          const rect = wrapper.getBoundingClientRect();
          const w = rect.width || 400;
          const h = rect.height || 300;
          canvas.width = w;
          canvas.height = h;
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          drawAnnotations();
          updateCommentList();
        }

        async function saveAnnotation(ann) {
          if (!submissionId) return;
          try {
            const response = await fetch("/api/annotations", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
              body: JSON.stringify({
                submissionId: submissionId,
                subtaskIndex: 0,
                x: Math.round(ann.x),
                y: Math.round(ann.y),
                width: Math.round(ann.w),
                height: Math.round(ann.h),
                comment: ann.comment || "",
                color: ann.isVoice ? "#8e44ad" : "#ff3b30",
                isVoice: ann.isVoice || false,
                audioPath: ann.audioPath || null,
                duration: ann.duration || 0,
              }),
            });
            if (response.ok) {
              const data = await response.json();
              ann.id = data.id;
              
              showHint("✅ Комментарий сохранён");
            }
          } catch (e) {
            console.error("❌ Ошибка сохранения:", e);
          }
        }

        // ===== ПОКАЗ ВЫБОРА ТИПА КОММЕНТАРИЯ =====
        function showAnnotationTypeSelector(rectData) {
          const overlay = document.createElement("div");
          overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        `;
          overlay.innerHTML = `
            <div style="background:white;border-radius:16px;padding:30px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                <h3 style="margin:0 0 12px 0;font-size:18px;color:#333;">📌 Выберите тип комментария</h3>
                <div style="background:#f0f4ff;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;color:#666;border-left:3px solid #667eea;">
                    <div style="font-size:12px;color:#999;margin-bottom:4px;">Выделенная область на фото:</div>
                    <span style="font-weight:500;">${Math.round(rectData.w)}×${Math.round(rectData.h)} пикселей</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <button onclick="this.closest('div[style*=\\'fixed\\']').remove();finishAnnotation('${instanceId}', ${JSON.stringify(rectData).replace(/"/g, "&quot;")}, 'text')" 
                            style="padding:14px 20px;background:#667eea;color:white;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;transition:all 0.3s;display:flex;align-items:center;gap:10px;justify-content:center;"
                            onmouseover="this.style.background='#5a67d8'"
                            onmouseout="this.style.background='#667eea'">
                        <span style="font-size:20px;">📝</span> Текстовый комментарий
                    </button>
                    <button onclick="this.closest('div[style*=\\'fixed\\']').remove();finishAnnotation('${instanceId}', ${JSON.stringify(rectData).replace(/"/g, "&quot;")}, 'voice')" 
                            style="padding:14px 20px;background:#e53e3e;color:white;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;transition:all 0.3s;display:flex;align-items:center;gap:10px;justify-content:center;"
                            onmouseover="this.style.background='#c0392b'"
                            onmouseout="this.style.background='#e53e3e'">
                        <span style="font-size:20px;">🎙️</span> Голосовой комментарий
                    </button>
                    <button onclick="this.closest('div[style*=\\'fixed\\']').remove()" 
                            style="padding:10px;background:transparent;color:#999;border:none;cursor:pointer;font-size:13px;margin-top:4px;">
                        Отмена
                    </button>
                </div>
            </div>
        `;
          document.body.appendChild(overlay);
          overlay.addEventListener("click", function (e) {
            if (e.target === this) this.remove();
          });
        }

        // ===== ЗАВЕРШЕНИЕ АННОТАЦИИ =====
        window.finishAnnotation = function (id, rectData, type) {
          const data = window._annotationInstances[id];
          if (!data) return;
          const scale = getScale();
          let annX = Math.min(rectData.x, rectData.x + rectData.w);
          let annY = Math.min(rectData.y, rectData.y + rectData.h);
          let annW = Math.abs(rectData.w);
          let annH = Math.abs(rectData.h);
          annX = (annX - scale.offsetX) / scale.scaleX;
          annY = (annY - scale.offsetY) / scale.scaleY;
          annW = annW / scale.scaleX;
          annH = annH / scale.scaleY;
          annX = Math.max(0, Math.min(scale.naturalWidth - 5, annX));
          annY = Math.max(0, Math.min(scale.naturalHeight - 5, annY));
          annW = Math.max(5, Math.min(scale.naturalWidth - annX, annW));
          annH = Math.max(5, Math.min(scale.naturalHeight - annY, annH));

          if (type === "text") {
            const comment = prompt("💬 Введите текстовый комментарий к выделенной области:");
            if (comment && comment.trim()) {
              const ann = {
                x: annX,
                y: annY,
                w: annW,
                h: annH,
                color: "#ff3b30",
                comment: comment.trim(),
                isVoice: false,
                audioPath: null,
                duration: 0,
              };
              data.annotations.push(ann);
              drawAnnotations();
              updateCommentList();
              saveAnnotation(ann);
              showHint("✅ Текстовый комментарий добавлен");
            }
          } else if (type === "voice") {
            startVoiceAnnotationRecording(id, annX, annY, annW, annH);
          }
        };

        // ===== ЗАПИСЬ ГОЛОСОВОГО КОММЕНТАРИЯ =====
        function startVoiceAnnotationRecording(instanceId, x, y, w, h) {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("❌ Ваш браузер не поддерживает запись голоса");
            return;
          }
          const data = window._annotationInstances[instanceId];
          if (!data) return;

          const overlay = document.createElement("div");
          overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        `;
          overlay.innerHTML = `
            <div style="background:white;border-radius:20px;padding:40px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                <div style="font-size:60px;margin-bottom:12px;">🎙️</div>
                <h3 style="margin:0 0 8px 0;font-size:20px;color:#333;">Запись голосового комментария</h3>
                <div style="background:#f0f4ff;padding:8px 12px;border-radius:6px;margin-bottom:16px;font-size:13px;color:#666;border-left:3px solid #667eea;">
                    <span style="font-weight:500;">Выделенная область на фото</span>
                    <span style="font-size:11px;color:#999;display:block;margin-top:2px;">${Math.round(w)}×${Math.round(h)} пикселей</span>
                </div>
                <div style="width:80px;height:80px;margin:16px auto;border-radius:50%;background:#e53e3e;display:flex;align-items:center;justify-content:center;animation:pulse-record 1s infinite;">
                    <span style="font-size:30px;color:white;">●</span>
                </div>
                <div id="recording-time-${instanceId}" style="font-size:24px;font-weight:bold;color:#333;margin:8px 0;">0:00</div>
                <div style="font-size:13px;color:#999;margin-bottom:16px;">Говорите в микрофон...</div>
                <button id="stop-recording-btn-${instanceId}" 
                        style="padding:12px 40px;background:#e53e3e;color:white;border:none;border-radius:50px;cursor:pointer;font-size:16px;font-weight:500;transition:all 0.3s;"
                        onmouseover="this.style.background='#c0392b'"
                        onmouseout="this.style.background='#e53e3e'">
                    ⏹ Остановить запись
                </button>
                <div style="margin-top:12px;">
                    <button onclick="this.closest('div[style*=\\'fixed\\']').remove()" 
                            style="background:transparent;border:none;color:#999;cursor:pointer;font-size:13px;">
                        Отмена
                    </button>
                </div>
            </div>
        `;
          document.body.appendChild(overlay);

          if (!document.getElementById("pulse-record-style")) {
            const style = document.createElement("style");
            style.id = "pulse-record-style";
            style.textContent = `@keyframes pulse-record { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229,62,62,0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(229,62,62,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229,62,62,0); } }`;
            document.head.appendChild(style);
          }

          let mediaRecorderLocal = null;
          let audioChunksLocal = [];
          let startTime = Date.now();
          let timerInterval = null;

          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then((stream) => {
              mediaRecorderLocal = new MediaRecorder(stream);
              audioChunksLocal = [];
              mediaRecorderLocal.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunksLocal.push(event.data);
              };
              mediaRecorderLocal.onstop = function () {
                const audioBlob = new Blob(audioChunksLocal, { type: "audio/webm" });
                const duration = Math.round((Date.now() - startTime) / 1000);
                overlay.remove();
                const ann = {
                  x: x,
                  y: y,
                  w: w,
                  h: h,
                  color: "#8e44ad",
                  comment: "🎙️ Голосовой комментарий к фото",
                  isVoice: true,
                  audioPath: null,
                  duration: duration,
                  audioBlob: audioBlob,
                };
                data.annotations.push(ann);
                drawAnnotations();
                updateCommentList();
                saveAnnotationWithAudio(ann, audioBlob, instanceId);
                stream.getTracks().forEach((track) => track.stop());
              };
              mediaRecorderLocal.start();

              timerInterval = setInterval(() => {
                const elapsed = Math.round((Date.now() - startTime) / 1000);
                const timeEl = document.getElementById(`recording-time-${instanceId}`);
                if (timeEl) timeEl.textContent = formatDuration(elapsed);
              }, 500);

              document.getElementById(`stop-recording-btn-${instanceId}`).addEventListener("click", function () {
                if (mediaRecorderLocal && mediaRecorderLocal.state === "recording") {
                  mediaRecorderLocal.stop();
                  clearInterval(timerInterval);
                }
              });
            })
            .catch((err) => {
              console.error("❌ Ошибка доступа к микрофону:", err);
              alert("❌ Нет доступа к микрофону. Разрешите доступ в настройках браузера.");
              overlay.remove();
            });
        }

        // ===== СОХРАНЕНИЕ АННОТАЦИИ С АУДИО =====
        async function saveAnnotationWithAudio(ann, audioBlob, instanceId) {
          if (!submissionId) return;
          try {
            const response = await fetch("/api/annotations", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
              body: JSON.stringify({
                submissionId: submissionId,
                subtaskIndex: 0,
                x: Math.round(ann.x),
                y: Math.round(ann.y),
                width: Math.round(ann.w),
                height: Math.round(ann.h),
                comment: ann.comment || "🎙️ Голосовой комментарий к фото",
                color: "#8e44ad",
                isVoice: true,
                duration: ann.duration || 0,
                audioPath: null,
              }),
            });
            if (!response.ok) {
              const err = await response.json();
              throw new Error(err.error || "Ошибка создания аннотации");
            }
            const data = await response.json();
            ann.id = data.id;

            if (audioBlob) {
              const formData = new FormData();
              formData.append("audio", audioBlob, `annotation_${ann.id}.webm`);
              formData.append("submissionId", submissionId);
              formData.append("subtaskIndex", 0);
              formData.append("duration", ann.duration || 0);
              formData.append("annotationId", ann.id);
              formData.append("selectedText", "Комментарий к фото");

              const audioResponse = await fetch("/api/voice-comments", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${localStorage.getItem("token")}`,
                },
                body: formData,
              });

              if (audioResponse.ok) {
                const audioData = await audioResponse.json();
                ann.audioPath = audioData.audio_path || audioData.audioPath;
                
                showHint("✅ Голосовой комментарий сохранён!");
              } else {
                console.error("❌ Ошибка сохранения аудио");
              }
            }
            updateCommentList();
          } catch (e) {
            console.error("❌ Ошибка сохранения:", e);
            alert("❌ Ошибка сохранения: " + e.message);
          }
        }

        // ===== ВОСПРОИЗВЕДЕНИЕ АУДИО (ДЛЯ ВСЕХ) =====
        window.playAnnotationAudioById = function (instanceId, index) {
          const data = window._annotationInstances[instanceId];
          if (!data || index >= data.annotations.length) return;

          const ann = data.annotations[index];
          if (!ann.audioPath) {
            alert("❌ Аудио не найдено");
            return;
          }

          let fullPath = ann.audioPath;
          if (!fullPath.startsWith("http")) {
            fullPath = window.location.origin + "/" + fullPath.replace(/^\/+/, "");
          }

          // Останавливаем предыдущее аудио
          if (window._currentAnnotationAudio) {
            window._currentAnnotationAudio.pause();
            window._currentAnnotationAudio = null;
          }

          const audio = new Audio(fullPath);
          window._currentAnnotationAudio = audio;

          // Меняем текст кнопки
          const btns = document.querySelectorAll(`[onclick*="playAnnotationAudioById('${instanceId}', ${index})"]`);
          btns.forEach((btn) => {
            btn.textContent = "⏸ Остановить";
            btn.style.background = "#e53e3e";
          });

          audio.play().catch((err) => {
            console.error("❌ Ошибка воспроизведения:", err);
            alert("❌ Не удалось воспроизвести аудио");
            btns.forEach((btn) => {
              btn.textContent = "▶ Воспроизвести";
              btn.style.background = "#8e44ad";
            });
          });

          audio.onended = function () {
            btns.forEach((btn) => {
              btn.textContent = "▶ Воспроизвести";
              btn.style.background = "#8e44ad";
            });
            window._currentAnnotationAudio = null;
          };
        };

        // ===== ЛОГИКА ВЫДЕЛЕНИЯ (ТОЛЬКО ДЛЯ УЧИТЕЛЯ) =====
        if (isTeacher) {
          canvas.addEventListener("mousedown", function (e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            instanceData.startX = (e.clientX - rect.left) * scaleX;
            instanceData.startY = (e.clientY - rect.top) * scaleY;
            instanceData.isDrawing = true;
            instanceData.currentRect = { x: instanceData.startX, y: instanceData.startY, w: 0, h: 0 };
          });

          canvas.addEventListener("mousemove", function (e) {
            if (!instanceData.isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;
            instanceData.currentRect.w = currentX - instanceData.startX;
            instanceData.currentRect.h = currentY - instanceData.startY;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scale = getScale();
            instanceData.annotations.forEach((ann) => {
              const x = ann.x * scale.scaleX + scale.offsetX;
              const y = ann.y * scale.scaleY + scale.offsetY;
              const w = ann.w * scale.scaleX;
              const h = ann.h * scale.scaleY;
              ctx.save();
              const color = ann.isVoice ? "#8e44ad" : ann.color || "#ff3b30";
              ctx.fillStyle = color + "30";
              ctx.fillRect(x, y, w, h);
              ctx.strokeStyle = color;
              ctx.lineWidth = 2.5;
              ctx.setLineDash(ann.isVoice ? [6, 4] : []);
              ctx.strokeRect(x, y, w, h);
              ctx.setLineDash([]);
              ctx.restore();
            });
            if (instanceData.currentRect) {
              const r = instanceData.currentRect;
              ctx.save();
              ctx.strokeStyle = "#007aff";
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              ctx.strokeRect(r.x, r.y, r.w, r.h);
              ctx.restore();
            }
          });

          canvas.addEventListener("mouseup", function (e) {
            if (!instanceData.isDrawing) return;
            instanceData.isDrawing = false;
            const r = instanceData.currentRect;
            if (!r) return;
            if (Math.abs(r.w) > 10 && Math.abs(r.h) > 10) {
              const img = wrapper.querySelector("img");
              if (img && img.complete && img.naturalWidth > 0) {
                showAnnotationTypeSelector({ x: r.x, y: r.y, w: r.w, h: r.h });
              }
            }
            instanceData.currentRect = null;
            drawAnnotations();
          });

          canvas.addEventListener("mouseleave", function () {
            if (instanceData.isDrawing) {
              instanceData.isDrawing = false;
              instanceData.currentRect = null;
              drawAnnotations();
            }
          });
        }

        // ===== ГЛОБАЛЬНЫЕ ФУНКЦИИ =====
        window.highlightAnnotation = function (id, index) {
          const data = window._annotationInstances[id];
          if (!data || index >= data.annotations.length) return;
          const ann = data.annotations[index];
          const canvas = data.canvas;
          drawAnnotations();
          const scale = getScale();
          const ctx = canvas.getContext("2d");
          const x = ann.x * scale.scaleX + scale.offsetX;
          const y = ann.y * scale.scaleY + scale.offsetY;
          const w = ann.w * scale.scaleX;
          const h = ann.h * scale.scaleY;
          ctx.save();
          ctx.strokeStyle = "#007aff";
          ctx.lineWidth = 4;
          ctx.setLineDash([8, 6]);
          ctx.strokeRect(x - 4, y - 4, w + 8, h + 8);
          ctx.restore();
          const icon = ann.isVoice ? "🎙️" : "💬";
          showHint(icon + " " + ann.comment);
        };

        window.deleteAnnotation = function (id, index) {
          const data = window._annotationInstances[id];
          if (!data) return;
          if (!confirm("Удалить этот комментарий?")) return;
          const ann = data.annotations[index];
          if (ann && ann.id) {
            fetch(`/api/annotations/${ann.id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
            }).catch((e) => console.error("Ошибка удаления:", e));
          }
          data.annotations.splice(index, 1);
          drawAnnotations();
          updateCommentList();
          showHint("🗑️ Комментарий удалён");
        };

        window.clearAllAnnotations = function (id) {
          const data = window._annotationInstances[id];
          if (!data || data.annotations.length === 0) return;
          if (!confirm("Удалить все комментарии?")) return;
          data.annotations.forEach((ann) => {
            if (ann.id) {
              fetch(`/api/annotations/${ann.id}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
              }).catch((e) => console.error("Ошибка удаления:", e));
            }
          });
          data.annotations = [];
          drawAnnotations();
          updateCommentList();
          showHint("🗑️ Все комментарии удалены");
        };

        // ===== ОТОБРАЖЕНИЕ =====
        commentsContainer.innerHTML = `
        <div style="font-weight:600;font-size:13px;color:#333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:6px;">
            <span>👨‍🏫 Комментарии учителя (${existingAnnotations?.length || 0})</span>
            ${isTeacher ? `<button onclick="clearAllAnnotations('${instanceId}')" style="background:none;border:none;color:#e53e3e;cursor:pointer;font-size:11px;padding:2px 6px;">✕ Очистить все</button>` : ""}
        </div>
        <div class="teacher-comments-list" style="font-size:13px;">
            ${
              existingAnnotations && existingAnnotations.length > 0
                ? existingAnnotations
                    .map((ann, index) => {
                      const color = ann.isVoice ? "#8e44ad" : ann.color || "#ff3b30";
                      const icon = ann.isVoice ? "🎙️" : "💬";
                      const hasAudio = ann.isVoice && ann.audioPath;
                      let audioUrl = ann.audioPath;
                      if (audioUrl && !audioUrl.startsWith("http")) {
                        audioUrl = window.location.origin + "/" + audioUrl.replace(/^\/+/, "");
                      }
                      return `
                        <div style="padding:6px 10px;border-left:3px solid ${color};margin-bottom:4px;background:white;border-radius:4px;font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;"
                             onmouseover="this.style.background='#e8f0fe'"
                             onmouseout="this.style.background='white'">

      async function createAssignment() {
        

        const classId = selectedClassId;
        const title = document.getElementById("assignment-title").value.trim();
        const description = document.getElementById("assignment-desc").value.trim();
        const maxScore = parseFloat(document.getElementById("assignment-max-score").value) || 100;
        const dueDate = document.getElementById("assignment-due-date").value;

        // ===== ОБЩАЯ ПОДСКАЗКА =====
        const hasAssignmentHint = document.getElementById("assignment-has-hint")?.checked || false;
        const assignmentHintText = document.getElementById("assignment-hint-text")?.value?.trim() || "";
        const assignmentHintFile = document.getElementById("assignment-hint-file");
        const hasAssignmentHintFile =
          assignmentHintFile && assignmentHintFile.files && assignmentHintFile.files.length > 0;

        if (!title) {
          alert("Введите название задания");
          return;
        }

        const modalContent = document.getElementById("modal-content");
        if (!modalContent) {
          alert("Ошибка: модальное окно не найдено");
          return;
        }

        const subtaskItems = modalContent.querySelectorAll(".subtask-item");

        if (subtaskItems.length === 0) {
          alert("Добавьте хотя бы одно подзадание");
          return;
        }

        const items = [];
        let hasError = false;

        subtaskItems.forEach((item, idx) => {
          const questionText = item.querySelector(".subtask-question")?.value?.trim() || "";
          const autoCheck = item.querySelector(".subtask-auto-check")?.checked || false;
          const correctAnswer = item.querySelector(".subtask-correct")?.value?.trim() || "";
          const hasImage = item.querySelector(".subtask-has-image")?.checked || false;
          const fileInput = item.querySelector(".subtask-image-file");
          const hasFile = fileInput && fileInput.files && fileInput.files.length > 0;

          // Проверяем подсказку для подзадания
          const hasHint = item.querySelector(".subtask-has-hint")?.checked || false;
          const hintText = item.querySelector(".subtask-hint-text")?.value?.trim() || "";
          const hintFileInput = item.querySelector(".subtask-hint-file");
          const hasHintFile = hintFileInput && hintFileInput.files && hintFileInput.files.length > 0;

          if (!questionText && !hasFile) {
            alert(`Подзадание ${idx + 1}: добавьте текст вопроса или изображение`);
            hasError = true;
            return;
          }

          if (autoCheck && !correctAnswer) {
            alert(`Подзадание ${idx + 1}: включена автопроверка, но не введён правильный ответ`);
            hasError = true;
            return;
          }

          // Создаём объект подзадания
          const subtaskData = {
            question: questionText || null,
            autoCheck: autoCheck,
            correctAnswer: autoCheck ? correctAnswer : null,
            hasImage: hasImage || hasFile,
          };

          // Добавляем подсказку для подзадания, если она есть
          if (hasHint && (hintText || hasHintFile)) {
            subtaskData.teacherHint = {
              text: hintText || null,
            };
            if (hasHintFile) {
              subtaskData.teacherHint.hasImage = true;
            }
          }

          items.push(subtaskData);
        });

        if (hasError) return;

        const formData = new FormData();
        formData.append("classId", classId);
        formData.append("title", title);
        formData.append("description", description || "");
        formData.append("maxScore", maxScore);
        formData.append("dueDate", dueDate || "");
        formData.append("items", JSON.stringify(items));
        formData.append("autoCheck", "false");

        // ===== ДОБАВЛЯЕМ ОБЩУЮ ПОДСКАЗКУ =====
        if (hasAssignmentHint && (assignmentHintText || hasAssignmentHintFile)) {
          const hintData = {
            text: assignmentHintText || null,
          };
          if (hasAssignmentHintFile) {
            hintData.hasImage = true;
          }
          formData.append("assignmentHint", JSON.stringify(hintData));
        }

        // Загружаем изображения для вопросов и подсказок
        subtaskItems.forEach((item, idx) => {
          // Изображение вопроса
          const fileInput = item.querySelector(".subtask-image-file");
          if (fileInput && fileInput.files && fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const ext = file.name.split(".").pop();
            const fileName = `assignment_${Date.now()}_${idx}.${ext}`;
            
            formData.append(`image_${idx}`, file, fileName);
          }

          // Изображение подсказки для подзадания
          const hintFileInput = item.querySelector(".subtask-hint-file");
          if (hintFileInput && hintFileInput.files && hintFileInput.files.length > 0) {
            const file = hintFileInput.files[0];
            const ext = file.name.split(".").pop();
            const fileName = `hint_${Date.now()}_${idx}.${ext}`;
            
            formData.append(`hint_image_${idx}`, file, fileName);
          }
        });

        // ===== ЗАГРУЖАЕМ ИЗОБРАЖЕНИЕ ДЛЯ ОБЩЕЙ ПОДСКАЗКИ =====
        const assignmentHintFileInput = document.getElementById("assignment-hint-file");
        if (assignmentHintFileInput && assignmentHintFileInput.files && assignmentHintFileInput.files.length > 0) {
          const file = assignmentHintFileInput.files[0];
          const ext = file.name.split(".").pop();
          const fileName = `hint_assignment_${Date.now()}.${ext}`;
          
          formData.append("assignment_hint_image", file, fileName);
        }

        

        try {
          const response = await fetch("/api/assignments", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: formData,
          });

          const result = await response.json();
          

          if (!response.ok) {
            throw new Error(result.error || result.message || "Ошибка создания задания");
          }

          closeModal();
          alert("✅ Задание создано успешно!");
          loadAssignmentsPage();
        } catch (error) {
          console.error("❌ Ошибка:", error);
          alert("❌ Ошибка: " + error.message);
        }
      }

      async function submitAssignmentAnswers(assignmentId) {
        

        // Находим все поля ввода в текущей модалке
        const modalContent = document.getElementById("modal-content");
        if (!modalContent) {
          console.error("❌ Модальное окно не найдено");
          alert("Ошибка: модальное окно не найдено");
          return;
        }

        const answerInputs = modalContent.querySelectorAll(".subtask-answer-input");
        const fileInputs = modalContent.querySelectorAll(".subtask-answer-file");

        
        

        const answers = [];
        let hasEmpty = false;

        answerInputs.forEach((input, idx) => {
          const val = input.value.trim();
          const fileInput = modalContent.querySelector(`.subtask-answer-file[data-index="${idx}"]`);
          const hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
          if (!val && !hasFile) hasEmpty = true;
          answers.push({ index: idx, text: val });
        });

        if (hasEmpty && !confirm("Некоторые ответы пустые. Продолжить?")) return;

        // Отключаем кнопку

          submitBtn.style.cursor = "not-allowed";

        if (statusEl) {
          statusEl.textContent = "⏳ Отправка...";
          statusEl.style.color = "#2563eb";
        }

        const formData = new FormData();
        formData.append("assignmentId", assignmentId);
        formData.append("answers", JSON.stringify(answers));

        // Добавляем файлы
        fileInputs.forEach((input) => {
          if (input.files && input.files.length > 0) {
            const index = input.dataset.index;
            const file = input.files[0];
            
            // Используем правильное имя поля
            formData.append(`image_${index}`, file);
          }
        });

        try {
          const response = await fetch("/api/submissions/batch", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
              // НЕ ставим Content-Type при FormData
            },
            body: formData,
          });

          const data = await response.json();
          

          if (!response.ok) {
            throw new Error(data.error || "Ошибка отправки");
          }

          // Успешно
          if (statusEl) {
            statusEl.textContent = "✅ Ответы успешно отправлены!";
            statusEl.style.color = "#059669";
          }

          // Очищаем черновик
          clearDraft(assignmentId);

          if (submitBtn) {
            submitBtn.style.display = "none";
          }

          showAutoSaveStatus("✅ Ответы отправлены!");

          setTimeout(() => {
            closeModal();
            loadAssignmentsPage();
          }, 1500);
        } catch (error) {
          console.error("❌ Ошибка:", error);
          if (statusEl) {
            statusEl.textContent = "❌ " + error.message;
            statusEl.style.color = "#dc2626";
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "📤 Попробовать снова";

            submitBtn.style.cursor = "pointer";

      // Можно добавить авто-сохранение при вводе
      document.querySelectorAll(".subtask-answer-input").forEach((input) => {
        input.addEventListener(
          "input",
          debounce(() => {
            // Сохраняем черновик
          }, 500),
        );
      });

      // ============================================================
      // АВТОСОХРАНЕНИЕ ЧЕРНОВИКОВ
      // ============================================================

      // Хранилище черновиков
      let draftData = {
        assignmentId: null,
        answers: {},
        images: {},
      };

      // Загрузка черновика из localStorage
      function loadDraft(assignmentId) {
        try {
          const key = "draft_" + assignmentId;
          const saved = localStorage.getItem(key);
          if (saved) {
            const data = JSON.parse(saved);
            // Проверяем, не устарел ли черновик (например, старше 1 дня)
            if (Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
              return data;
            } else {
              // Удаляем устаревший черновик
              localStorage.removeItem(key);
            }
          }
        } catch (e) {
          console.error("Ошибка загрузки черновика:", e);
        }
        return null;
      }

      // Сохранение черновика в localStorage
      function saveDraft(assignmentId, answers, images) {
        try {
          const key = "draft_" + assignmentId;
          const data = {
            assignmentId: assignmentId,
            answers: answers,
            images: images || {},
            timestamp: Date.now(),
          };
          localStorage.setItem(key, JSON.stringify(data));
          
          showAutoSaveStatus("💾 Черновик сохранён");
        } catch (e) {
          console.error("Ошибка сохранения черновика:", e);
        }
      }

      // Очистка черновика
      function clearDraft(assignmentId) {
        try {
          const key = "draft_" + assignmentId;
          localStorage.removeItem(key);
          
        } catch (e) {
          console.error("Ошибка удаления черновика:", e);
        }
      }

      // Показ статуса автосохранения
      let autoSaveTimeout = null;
      function showAutoSaveStatus(text) {
        let statusEl = document.getElementById("auto-save-status");
        if (!statusEl) {
          statusEl = document.createElement("div");
          statusEl.id = "auto-save-status";
          statusEl.style.cssText = `
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        `;
          document.body.appendChild(statusEl);
        }

        statusEl.textContent = text;
        statusEl.style.opacity = "1";

        clearTimeout(autoSaveTimeout);
        autoSaveTimeout = setTimeout(() => {
          statusEl.style.opacity = "0";
        }, 1500);
      }

      // Функция автосохранения
      function autoSave(assignmentId) {
        const answerInputs = document.querySelectorAll(".subtask-answer-input");
        const fileInputs = document.querySelectorAll(".subtask-answer-file");

        const answers = {};
        const images = {};

        answerInputs.forEach((input) => {
          const index = input.dataset.index;
          if (index !== undefined) {
            answers[index] = input.value.trim();
          }
        });

        fileInputs.forEach((input) => {
          const index = input.dataset.index;
          if (index !== undefined && input.files && input.files.length > 0) {
            // Сохраняем только имя файла, сам файл не храним в localStorage
            const file = input.files[0];
            images[index] = {
              name: file.name,
              size: file.size,
              type: file.type,
              // Не храним содержимое файла в localStorage, только информацию
            };
          }
        });

        saveDraft(assignmentId, answers, images);
      }

      // ============================================================
      // ПОЛНАЯ ПРОВЕРКА РАБОТЫ (УЧИТЕЛЬ)
      // ============================================================

      async function gradeSubmissionFull(submissionId, assignmentId) {
        const scoreEl = document.getElementById("grade-score");
        const commentEl = document.getElementById("grade-comment");

        // Собираем баллы за подзадания
        const scoreInputs = document.querySelectorAll(".subtask-score");
        let subtaskScores = [];
        let totalScore = 0;
        let hasEmptyScore = false;

        scoreInputs.forEach((input, idx) => {
          const val = input.value.trim();
          if (val === "") {
            hasEmptyScore = true;
            subtaskScores.push(null);
          } else {
            const num = parseFloat(val);
            if (!isNaN(num)) {
              subtaskScores.push(num);
              totalScore += num;
            } else {
              subtaskScores.push(null);
            }
          }
        });

        // Если есть подзадания без автопроверки, используем сумму баллов
        let finalScore = scoreEl ? parseFloat(scoreEl.value) : null;

        if (subtaskScores.length > 0) {
          // Если есть неоцененные подзадания и не введена общая оценка
          const hasNullScores = subtaskScores.some((s) => s === null);
          if (hasNullScores && finalScore === null) {
            if (!confirm("Некоторые подзадания не оценены. Продолжить?")) return;
          }
          // Если общая оценка не введена, используем сумму баллов
          if (finalScore === null || isNaN(finalScore)) {
            finalScore = totalScore;

      function restoreFullImageId(path) {
        if (!path) return path;

        const match = path.match(/(\d+-\d+)/);
        if (!match) return path;

        const shortId = match[1];
        const parts = shortId.split("-");

        // Если ID слишком короткий (меньше 13 цифр до дефиса) - пробуем восстановить
        if (parts[0].length < 13) {
          // Список известных полных ID
          const knownIds = [

            "1788473989404-56722637",
            // Добавьте сюда другие известные ID по мере необходимости
          ];

          // Ищем полный ID, который содержит короткий ID
          for (const fullId of knownIds) {
            if (fullId.includes(parts[0]) || fullId.includes(shortId)) {
              // Восстанавливаем расширение
              let ext = "jpg";
              if (path.includes(".")) {
                ext = path.split(".").pop().toLowerCase();
              }
              // Определяем тип (submissions или assignments)
              let type = "submissions";
              if (path.includes("/assignments/") || path.includes("assignments")) {
                type = "assignments";
              }
              // Возвращаем полный путь
              return window.location.origin + "/uploads/" + type + "/" + fullId + "." + ext;
            }
          }

          // Если не нашли в списке, пробуем восстановить по паттерну
          // Проверяем, не начинается ли ID с "8847" (должно быть "178847")
          if (parts[0].startsWith("8847")) {
            const fullId = "1" + parts[0] + "-" + parts[1];
            let ext = "jpg";
            if (path.includes(".")) {
              ext = path.split(".").pop().toLowerCase();

            let type = "submissions";

              type = "assignments";
            }
            const result = window.location.origin + "/uploads/" + type + "/" + fullId + "." + ext;
            
            return result;
          }
        }

        return path;
